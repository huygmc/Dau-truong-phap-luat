<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Trần_Huy_VKSND khu vực Đắk Lắk">
<title>Đấu trường Pháp luật</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%E2%9A%96%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#050820;--bg2:#160c45;--gold:#f7c948;--ink:#eef1ff;--muted:#aab1d8;--line:rgba(255,255,255,.15);
--r:#e5484d;--rd:#8f1d22;--b:#3b82f6;--bd:#1e40af;--y:#f59e0b;--yd:#a15c07;--g:#22c55e;--gd:#15803d;--p:#8b5cf6;--pd:#5b21b6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Be Vietnam Pro','Segoe UI',Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% -10%,#2c1a85 0%,var(--bg2) 38%,var(--bg1) 82%) fixed;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none}
#app{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:66px 16px 80px;perspective:1400px}
#dev{position:fixed;bottom:0;left:0;right:0;z-index:5;text-align:center;padding:9px;font-size:13px;color:var(--muted);background:linear-gradient(transparent,rgba(0,0,0,.7));pointer-events:none}
#dev b{color:var(--gold);letter-spacing:.3px}
#topbar{position:fixed;top:12px;right:12px;z-index:60;display:flex;gap:8px;align-items:center}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(10,14,40,.78);color:#fff;font-size:19px;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 4px 0 rgba(0,0,0,.4)}
.ibtn:active{transform:translateY(3px);box-shadow:none}
#vol{width:90px;accent-color:var(--gold)}
.coin{width:84px;height:84px;margin:0 auto;position:relative;transform-style:preserve-3d;animation:spinY 7s linear infinite}
.coin span{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:42px;background:radial-gradient(circle at 35% 30%,#fff6c2,#f7c948 45%,#a8730a);border:4px solid #fde68a;box-shadow:inset 0 0 14px rgba(0,0,0,.4),0 0 30px rgba(247,201,72,.35);backface-visibility:hidden}
.coin span.bk{transform:rotateY(180deg)}
@keyframes spinY{to{transform:rotateY(360deg)}}
.title3d{font-weight:900;font-size:clamp(30px,6vw,58px);text-align:center;line-height:1.08;margin:12px 0 4px;color:#fff6d6;letter-spacing:1px;
text-shadow:0 1px 0 #f0c02c,0 2px 0 #e0ae22,0 3px 0 #cf9c1a,0 4px 0 #bd8a13,0 5px 0 #aa780d,0 6px 0 #966608,0 7px 0 #805506,0 12px 22px rgba(0,0,0,.7);animation:float 5s ease-in-out infinite;transform-origin:50% 100%}
.title3d.sm{font-size:clamp(24px,4.4vw,40px)}
@keyframes float{0%,100%{transform:rotateX(16deg) translateY(0)}50%{transform:rotateX(8deg) translateY(-6px)}}
.sub{text-align:center;color:var(--muted);margin:2px 0 18px;font-weight:600}
.h2{font-weight:900;font-size:24px;text-align:center;margin:4px 0 14px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.h3{font-weight:800;font-size:18px;margin:0 0 10px}
.panel{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 22px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(8px)}
.enter{animation:enter .55s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes enter{from{opacity:0;transform:translateZ(-220px) rotateX(-22deg)}to{opacity:1;transform:none}}
.btn{--c:var(--g);--d:var(--gd);position:relative;border:0;border-radius:14px;padding:12px 20px;font:800 15px/1.2 inherit;font-family:inherit;color:#fff;background:var(--c);cursor:pointer;box-shadow:0 6px 0 var(--d),0 12px 20px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,filter .15s;text-shadow:0 1px 1px rgba(0,0,0,.35);margin:4px 2px}
.btn:hover{filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--d),0 4px 8px rgba(0,0,0,.35)}
.btn:disabled{filter:grayscale(.9) brightness(.6);cursor:not-allowed}
.btn.gold{--c:linear-gradient(180deg,#ffe58a,#f2b705);--d:#9a6500;color:#3a2400;text-shadow:none}
.btn.blue{--c:var(--b);--d:var(--bd)}.btn.purple{--c:var(--p);--d:var(--pd)}.btn.red{--c:var(--r);--d:var(--rd)}.btn.orange{--c:var(--y);--d:var(--yd)}
.btn.ghost{--c:rgba(255,255,255,.12);--d:rgba(0,0,0,.45)}
.btn.big{font-size:20px;padding:17px 24px;width:100%}
.btn.sm{font-size:13px;padding:8px 12px;border-radius:10px;box-shadow:0 4px 0 var(--d)}
.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.32);color:#fff;font:inherit;font-size:15px;outline:none}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(247,201,72,.25)}
select.inp option{color:#000}
textarea.inp{resize:vertical;min-height:64px;font-size:14px}
.lb{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px;font-weight:700}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.note{font-size:13px;color:var(--muted);line-height:1.55}
.warn{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.45);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin:10px 0}
.chk{display:inline-flex;gap:8px;align-items:center;margin:4px 12px 4px 0;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
.center{text-align:center}
.ok-t{color:#86efac}.err-t{color:#fca5a5}
/* --- hộp thoại --- */
.mback{position:fixed;inset:0;z-index:100;background:rgba(2,4,20,.72);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.mbox{background:linear-gradient(170deg,#24196b,#120c3a);border:1px solid rgba(247,201,72,.45);border-radius:20px;padding:22px;max-width:520px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.mmsg{font-size:16px;line-height:1.55;margin-bottom:12px}
.mbtns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:12px}
/* --- chọn cuộc thi --- */
.exlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;perspective:1000px}
.excard{border:2px solid var(--line);cursor:pointer;color:#fff;text-align:left;border-radius:18px;padding:16px;font-family:inherit;background:linear-gradient(150deg,rgba(124,58,237,.35),rgba(37,99,235,.25));box-shadow:0 8px 0 rgba(0,0,0,.35),0 16px 26px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s,border-color .2s}
.excard:hover:not(:disabled){transform:translateY(-5px) rotateX(8deg)}
.excard.sel{border-color:var(--gold);box-shadow:0 8px 0 #9a6500,0 0 32px rgba(247,201,72,.45);background:linear-gradient(150deg,rgba(247,201,72,.3),rgba(124,58,237,.3))}
.excard:disabled{opacity:.45;cursor:not-allowed}
.excard .g{font-size:12px;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.excard b{display:block;font-size:17px;margin:4px 0 8px;line-height:1.3}
.excard small{color:var(--muted);font-size:13px}
/* --- phòng thi --- */
.exam{display:grid;grid-template-columns:1fr 310px;gap:18px;align-items:start}
.ex-side{position:sticky;top:66px;margin:0}
.clock{font-size:46px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.clock.warn{color:#ff7b7b;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.prog{height:9px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);border-radius:9px;transition:width .3s}
.ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0;max-height:46vh;overflow:auto;padding:2px}
.nb{position:relative;height:42px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font:800 15px inherit;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.nb.done{background:#16a34a;border-color:#4ade80}
.nb.cur{outline:3px solid var(--gold);outline-offset:1px}
.nb.fl::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:#f59e0b;box-shadow:0 0 6px #f59e0b}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.ex-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.badge{display:inline-block;font-size:13px;font-weight:800;padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.badge.fl{background:rgba(245,158,11,.25);border-color:#f59e0b;color:#fde68a}
.qpaper{background:linear-gradient(180deg,#ffffff,#eef0ff);color:#14183a;border-radius:20px;padding:22px 22px 18px;box-shadow:0 10px 0 #8f98d4,0 26px 44px rgba(0,0,0,.5);animation:slidein .35s ease-out both}
@keyframes slidein{from{opacity:0;transform:translateX(30px) rotateY(-8deg)}to{opacity:1;transform:none}}
.qpaper .qt{font-size:clamp(17px,2vw,21px);font-weight:800;line-height:1.5;margin:10px 0 16px;white-space:pre-line}
.exo{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid #d5d9f5;background:#fff;color:#1d2250;border-radius:14px;padding:12px 14px;margin:9px 0;font:600 16px/1.45 inherit;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #d5d9f5;transition:all .12s}
.exo:hover{border-color:#818cf8;transform:translateX(4px)}
.exo .L{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#e0e3ff;color:#3730a3}
.exo.sel{border-color:#2563eb;background:#e8f0ff;box-shadow:0 4px 0 #2563eb}
.exo.sel .L{background:#2563eb;color:#fff}
.exo.right{border-color:#16a34a;background:#e8fbe9;box-shadow:0 4px 0 #16a34a}
.exo.right .L{background:#16a34a;color:#fff}
.exo.wrong{border-color:#dc2626;background:#fdecec;box-shadow:0 4px 0 #dc2626}
.exo.wrong .L{background:#dc2626;color:#fff}
.ex-nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}
.rv{display:grid;grid-template-columns:70px 1fr 140px;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);margin:7px 0;cursor:pointer}
.rv:hover{border-color:var(--gold)}
.rv .s{font-weight:800;text-align:right}
.ref{font-size:13px;color:#4b4fbf;background:#e0e3ff;border-radius:10px;padding:6px 10px;display:inline-block;margin-top:4px}
/* --- kết quả --- */
.trophy{font-size:100px;text-align:center;animation:troph 4s ease-in-out infinite;filter:drop-shadow(0 16px 20px rgba(0,0,0,.6))}
@keyframes troph{0%,100%{transform:rotateY(-25deg) translateY(0)}50%{transform:rotateY(25deg) translateY(-12px)}}
.score{font-size:clamp(46px,9vw,80px);font-weight:900;text-align:center;color:var(--gold);text-shadow:0 4px 0 #8a5a00,0 14px 26px rgba(0,0,0,.6)}
.pass{display:inline-block;font-weight:900;font-size:20px;padding:8px 22px;border-radius:999px;margin:6px}
.pass.y{background:#16a34a;box-shadow:0 5px 0 #14532d}.pass.n{background:#b45309;box-shadow:0 5px 0 #78350f}
.quote{margin:18px auto;max-width:720px;text-align:center;font-size:19px;font-weight:700;line-height:1.5;padding:16px 22px;border-radius:18px;background:linear-gradient(135deg,rgba(247,201,72,.2),rgba(139,92,246,.18));border:1px solid rgba(247,201,72,.5)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:rgba(0,0,0,.38);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:800;font-size:15px}
.chip.gold{color:var(--gold)}.chip.fire{color:#ffb38a}
/* --- thiết lập --- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.tab{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;padding:10px 16px;border-radius:12px;font:800 15px inherit;font-family:inherit;cursor:pointer}
.tab.on{background:linear-gradient(180deg,#ffe58a,#f2b705);color:#3a2400;border-color:#f2b705}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-size:28px;color:var(--gold);display:block}
.stat small{color:var(--muted);font-size:12px}
.ecfg{background:rgba(0,0,0,.26);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.ecfg .row{grid-template-columns:2fr 1fr 1fr 1fr}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb td,table.tb th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.tb th{color:var(--muted);font-size:12px}
.qedit{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.qedit .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.qedit .op{display:flex;gap:8px;align-items:center;margin:5px 0}
.qedit .op input[type=radio]{width:20px;height:20px;accent-color:#22c55e;flex:none}
.qedit .inp{padding:7px 10px;font-size:14px}
.tag{font-size:11px;background:rgba(139,92,246,.4);padding:2px 8px;border-radius:999px;color:#fff}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0}
.drop{border:2px dashed rgba(247,201,72,.6);border-radius:16px;padding:20px 14px;text-align:center;cursor:pointer;background:rgba(247,201,72,.06)}
.drop:hover,.drop.over{background:rgba(247,201,72,.16)}
/* --- trò chơi (luyện tập) --- */
.hud{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ring{width:80px;height:80px;position:relative;flex:none}.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:26px}
.ring.hot .t{color:#ff6b6b;animation:pulse .5s infinite alternate}
.qcard{background:linear-gradient(180deg,#ffffff,#e6e9ff);color:#14183a;border-radius:22px;padding:24px;font-weight:800;font-size:clamp(17px,2.3vw,24px);text-align:center;line-height:1.45;box-shadow:0 10px 0 #8f98d4,0 26px 44px rgba(0,0,0,.55);margin:16px 0 26px;animation:qin .7s cubic-bezier(.2,.9,.3,1.15) both;transform-origin:50% 0;white-space:pre-line}
.qcard.long{font-size:clamp(15px,1.8vw,19px)}
@keyframes qin{from{opacity:0;transform:rotateX(-95deg)}to{opacity:1;transform:rotateX(0)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;perspective:900px}
.opt{--c:var(--r);--d:var(--rd);display:flex;align-items:center;gap:12px;min-height:80px;text-align:left;border:0;border-radius:16px;padding:12px 16px;color:#fff;font:700 17px/1.35 inherit;font-family:inherit;background:var(--c);box-shadow:0 8px 0 var(--d),0 18px 26px rgba(0,0,0,.4);cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .35s;animation:pop .55s both}
.opt.small{font-size:14px}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
@keyframes pop{from{opacity:0;transform:translateY(40px) rotateX(50deg)}to{opacity:1;transform:none}}
.opt:hover:not(:disabled){transform:translateY(-5px) rotateX(12deg)}
.opt .ic{flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:18px;font-weight:900}
.o1{--c:var(--b);--d:var(--bd)}.o2{--c:var(--y);--d:var(--yd)}.o3{--c:var(--g);--d:var(--gd)}
.opt.ok{animation:okA .8s both;box-shadow:0 8px 0 var(--d),0 0 0 4px #fff,0 0 46px rgba(255,255,255,.75)}
@keyframes okA{0%{transform:scale(1)}45%{transform:scale(1.07) rotateY(360deg)}100%{transform:scale(1.04)}}
.opt.no{opacity:.25;transform:scale(.95)}.opt.bad{opacity:.55;animation:shake .5s}.opt.gone{visibility:hidden}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pus{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.fb{text-align:center;font-size:23px;font-weight:900;min-height:34px;margin-top:14px}
.float{position:fixed;font-weight:900;font-size:42px;color:var(--gold);text-shadow:0 3px 0 #8a5a00,0 10px 22px rgba(0,0,0,.7);animation:fl 1.3s ease-out forwards;pointer-events:none;z-index:90;transform:translate(-50%,-50%)}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-20%) scale(.5)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-220%)}}
.splash{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(circle,rgba(30,10,80,.6),rgba(0,0,0,.85));perspective:800px}
.splash div{font-size:clamp(32px,7vw,68px);font-weight:900;text-align:center;color:#fff6d6;text-shadow:0 4px 0 #b8860b,0 8px 0 #7a5600,0 18px 30px #000;animation:spl 1.6s cubic-bezier(.2,.9,.3,1.2) both}
.splash small{display:block;font-size:20px;color:#fff;text-shadow:none;margin-top:10px;font-weight:700}
@keyframes spl{0%{transform:rotateY(-180deg) scale(.2);opacity:0}45%{transform:rotateY(10deg) scale(1.1);opacity:1}60%{transform:none}85%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;perspective:1000px;max-width:540px;margin:10px auto}
.mc{aspect-ratio:1/1.1;position:relative;cursor:pointer;border:0;background:none;padding:0}
.mc .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.mc.up .in,.mc.done .in{transform:rotateY(180deg)}
.mc .f,.mc .k{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.mc .f{background:linear-gradient(135deg,#4f46e5,#7c3aed);font-size:30px;color:#c7d2fe;border:2px solid rgba(255,255,255,.28)}
.mc .k{background:#fff;transform:rotateY(180deg);font-size:clamp(28px,6vw,42px)}
.mc.done .k{background:#bbf7d0;box-shadow:0 0 24px #4ade80}
.gifts{display:flex;justify-content:center;gap:46px;flex-wrap:wrap;padding:40px 0 20px;perspective:800px}
.gw{display:flex;flex-direction:column;align-items:center;gap:22px;min-width:120px}
.gift{width:100px;height:100px;position:relative;cursor:pointer;transform-style:preserve-3d;animation:cube 7s linear infinite;border:0;background:none;padding:0}
.gw:nth-child(2) .gift{animation-duration:9s;animation-direction:reverse}.gw:nth-child(3) .gift{animation-duration:6s}
.gift i{position:absolute;inset:0;border-radius:8px;font-style:normal;display:grid;place-items:center;font-size:40px;font-weight:900;color:#fff;background:linear-gradient(90deg,transparent 42%,#fde047 42% 58%,transparent 58%),linear-gradient(0deg,transparent 42%,#fde047 42% 58%,transparent 58%),linear-gradient(135deg,var(--gc),var(--gk));border:2px solid rgba(255,255,255,.4)}
.gift i:nth-child(1){transform:translateZ(50px)}.gift i:nth-child(2){transform:rotateY(180deg) translateZ(50px)}.gift i:nth-child(3){transform:rotateY(90deg) translateZ(50px)}.gift i:nth-child(4){transform:rotateY(-90deg) translateZ(50px)}.gift i:nth-child(5){transform:rotateX(90deg) translateZ(50px)}.gift i:nth-child(6){transform:rotateX(-90deg) translateZ(50px)}
@keyframes cube{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
.gift.open{animation:boom .7s forwards}
@keyframes boom{to{transform:rotateX(-22deg) rotateY(540deg) scale(1.7);opacity:0}}
.prize{min-height:52px;font-weight:800;text-align:center;opacity:0;transform:rotateX(90deg);transition:all .6s .3s}
.prize.show{opacity:1;transform:none;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.prize.mine{background:linear-gradient(180deg,#ffe58a,#f2b705);color:#3a2400}
@media(max-width:860px){.exam{grid-template-columns:1fr}.ex-side{order:-1;position:relative;top:0}.ngrid{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));max-height:none}.clock{font-size:34px}.ecfg .row{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.opts{grid-template-columns:1fr}.rv{grid-template-columns:52px 1fr}.rv .s{grid-column:2;text-align:left}#vol{display:none}.mgrid{grid-template-columns:repeat(3,1fr)}}
@media print{body{background:#fff;color:#000}#bg,#fx,#topbar,#dev,.noprint{display:none!important}#app{padding:0}.panel{box-shadow:none;border:1px solid #999;backdrop-filter:none;background:#fff}.title3d,.score{color:#000;text-shadow:none;animation:none;transform:none}.quote{color:#000}.chip{color:#000;background:#fff}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
a.btn{text-decoration:none;display:inline-block}
.netst{text-align:center;font-size:13px;font-weight:700;color:var(--muted);margin:-10px 0 14px}.netst.off{color:#fca5a5}
.netbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-color:rgba(96,165,250,.55)}
.sync{margin:12px auto 0;max-width:620px;font-size:14px;font-weight:700;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.sync.ok{color:#86efac}.sync.bad{color:#fca5a5}
.spin{width:42px;height:42px;margin:4px auto 12px;border-radius:50%;border:4px solid rgba(255,255,255,.18);border-top-color:var(--gold);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<canvas id="bg"></canvas><canvas id="fx"></canvas>
<div id="topbar">
 <input id="vol" type="range" min="0" max="1" step="0.05" title="Âm lượng">
 <button class="ibtn" id="bMute" title="Bật/tắt âm thanh">🔊</button>
 <button class="ibtn" id="bFull" title="Toàn màn hình">⛶</button>
 <button class="ibtn" id="bAdm" title="Người thiết lập">⚙</button>
</div>
<main id="app"></main>

m nhưng phải kịp thời”"},{"id":"ksdd004","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, sau khi đã ban hành văn bản yêu cầu trả lời kiến nghị mà vẫn không nhận được trả lời thì Viện kiểm sát xử lý thế nào?","o":["Chấm dứt việc theo dõi, lưu hồ sơ và coi như cơ quan bị kiến nghị đã chấp nhận nội dung kiến nghị","Khởi kiện cơ quan bị kiến nghị ra Tòa án để buộc trả lời kiến nghị trong thời hạn 15 ngày","Chuyển hồ sơ cho cơ quan điều tra xem xét trách nhiệm hình sự của người đứng đầu cơ quan bị kiến nghị","Tự mình hoặc báo cáo VKS cấp trên trực tiếp thông báo cho cấp trên của cơ quan bị kiến nghị và báo cáo cấp ủy, HĐND"],"a":3,"ref":"Điều 7 Quy chế 436: “tự mình hoặc báo cáo Viện kiểm sát cấp trên trực tiếp thông báo cho cơ quan, tổ chức cấp trên trực tiếp của cơ quan, tổ chức bị kiến nghị biết để xử lý, đồng thời gửi văn bản báo cáo cấp ủy, Hội đồng nhân dân có thẩm quyền”"},{"id":"ksdd005","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, trường hợp xét thấy việc Tòa án trả lại đơn khởi kiện không có căn cứ thì Kiểm sát viên làm gì?","o":["Tự mình yêu cầu Tòa án thụ lý vụ án và thông báo cho người khởi kiện biết","Hướng dẫn đương sự nộp đơn khởi kiện tại một Tòa án khác cùng cấp","Báo cáo Viện trưởng ban hành quyết định kháng nghị phúc thẩm văn bản trả lại đơn","Đề xuất Viện trưởng kiến nghị với Tòa án đã trả lại đơn (khoản 1 Điều 194 BLTTDS)"],"a":3,"ref":"Điều 11 Quy chế 436: “Trường hợp xét thấy việc Tòa án trả lại đơn khởi kiện không có căn cứ thì báo cáo, đề xuất Viện trưởng thực hiện quyền kiến nghị với Tòa án đã trả lại đơn khởi kiện theo quy định tại khoản 1 Điều 194 BLTTDS”"},{"id":"ksdd006","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, khi kiểm sát việc thụ lý vụ án, Kiểm sát viên, Kiểm tra viên kiểm sát những nội dung nào?","o":["Chỉ kiểm sát việc nộp tiền tạm ứng án phí và thời hạn gửi thông báo thụ lý","Thẩm quyền, thời hiệu, điều kiện khởi kiện, tư cách pháp lý người khởi kiện và nội dung khác","Đánh giá chứng cứ để xác định trước yêu cầu của bên nào có căn cứ chấp nhận","Chỉ kiểm sát hình thức đơn khởi kiện và danh mục tài liệu kèm theo đơn"],"a":1,"ref":"Khoản 2 Điều 13 Quy chế 436: “kiểm sát về thẩm quyền giải quyết vụ án của Tòa án, thời hiệu khởi kiện, điều kiện khởi kiện, tư cách pháp lý của người khởi kiện và những nội dung khác”"},{"id":"ksdd007","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, Kiểm sát viên, Kiểm tra viên kiểm sát điều kiện, căn cứ, nội dung, thủ tục rút gọn trong thời hạn bao lâu kể từ ngày nhận được quyết định đưa vụ án ra giải quyết theo thủ tục rút gọn kèm hồ sơ?","o":["03 ngày làm việc","07 ngày","15 ngày","05 ngày làm việc"],"a":0,"ref":"Điều 14 Quy chế 436: “Trong thời hạn 03 ngày làm việc, kể từ ngày nhận được quyết định đưa vụ án ra giải quyết theo thủ tục rút gọn kèm theo hồ sơ vụ án”"},{"id":"ksdd008","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, xét thấy tài liệu, chứng cứ chưa bảo đảm cho việc giải quyết vụ án thì Kiểm sát viên, Kiểm tra viên làm gì?","o":["Chờ đến phiên tòa sơ thẩm mới phát biểu về việc thiếu chứng cứ","Tự mình xác minh, thu thập chứng cứ ngay ở giai đoạn sơ thẩm để bảo đảm việc giải quyết vụ án","Đề nghị đương sự rút đơn khởi kiện và nộp lại khi có đủ tài liệu, chứng cứ","Báo cáo lãnh đạo kịp thời yêu cầu Tòa án xác minh, thu thập chứng cứ bổ sung"],"a":3,"ref":"Khoản 1 Điều 16 Quy chế 436: “báo cáo lãnh đạo Viện kiểm sát kịp thời yêu cầu Tòa án xác minh, thu thập tài liệu, chứng cứ bổ sung theo quy định tại khoản 3 Điều 58 BLTTDS”"},{"id":"ksdd009","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, đương sự đã thực hiện các biện pháp cần thiết nhưng không thu thập được chứng cứ, đề nghị Tòa án hỗ trợ mà Tòa án không hỗ trợ và không có lý do chính đáng thì Kiểm sát viên báo cáo lãnh đạo Viện kiểm sát thực hiện quyền gì?","o":["Yêu cầu Tòa án hỗ trợ đương sự thu thập chứng cứ theo Điều 15 Luật Tổ chức Tòa án nhân dân","Kháng nghị phúc thẩm ngay khi Tòa án từ chối hỗ trợ đương sự thu thập chứng cứ","Ra quyết định tạm đình chỉ giải quyết vụ án cho đến khi Tòa án hỗ trợ đương sự","Thay mặt đương sự khởi kiện yêu cầu cơ quan đang lưu giữ cung cấp tài liệu, chứng cứ"],"a":0,"ref":"Khoản 2 Điều 16 Quy chế 436: “Viện kiểm sát yêu cầu Tòa án hỗ trợ đương sự thu thập tài liệu, chứng cứ theo quy định tại Điều 15 Luật Tổ chức TAND năm 2024” … “sửa đổi, bổ sung năm 2025”"},{"id":"ksdd010","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, phát hiện vi phạm trong việc áp dụng, thay đổi, hủy bỏ biện pháp khẩn cấp tạm thời thì Kiểm sát viên báo cáo lãnh đạo thực hiện quyền kiến nghị theo quy định nào?","o":["Điều 140 BLTTDS","Điều 327 BLTTDS","Điều 194 BLTTDS","Điều 278 BLTTDS"],"a":0,"ref":"Điều 17 Quy chế 436: “Trường hợp phát hiện vi phạm thì báo cáo lãnh đạo Viện kiểm sát thực hiện quyền kiến nghị theo quy định tại Điều 140 BLTTDS”"},{"id":"ksdd011","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, có căn cứ xác định sự thỏa thuận của các đương sự (đã được Tòa án công nhận) là do bị nhầm lẫn, lừa dối, đe dọa, cưỡng ép thì Kiểm sát viên xử lý thế nào?","o":["Báo cáo đề xuất lãnh đạo Viện kiểm sát kháng nghị phúc thẩm quyết định công nhận sự thỏa thuận","Báo cáo bằng văn bản đề xuất xem xét kháng nghị giám đốc thẩm, kèm tài liệu làm căn cứ","Hướng dẫn đương sự kháng cáo quyết định công nhận sự thỏa thuận trong 15 ngày","Kiến nghị Thẩm phán đã ra quyết định tự hủy quyết định công nhận sự thỏa thuận"],"a":1,"ref":"Khoản 1 Điều 18 Quy chế 436: “báo cáo bằng văn bản với lãnh đạo Viện kiểm sát có thẩm quyền xem xét kháng nghị theo thủ tục giám đốc thẩm, kèm theo tài liệu làm căn cứ cho việc kháng nghị”"},{"id":"ksdd012","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, khi nghiên cứu hồ sơ phát hiện Tòa án chưa thu thập đầy đủ tài liệu, chứng cứ bảo đảm cho việc giải quyết vụ án đúng pháp luật thì Kiểm sát viên làm gì?","o":["Tự mình tiến hành xem xét, thẩm định tại chỗ và lập biên bản đưa vào hồ sơ vụ án","Trả lại hồ sơ và đề nghị Viện trưởng không cử Kiểm sát viên tham gia phiên tòa","Đề nghị Tòa án đình chỉ giải quyết vụ án vì chưa đủ chứng cứ để giải quyết","Báo cáo, đề xuất lãnh đạo yêu cầu Tòa án xác minh, thu thập chứng cứ (khoản 3 Điều 58 BLTTDS)"],"a":3,"ref":"Khoản 3 Điều 21 Quy chế 436: “Kiểm tra viên báo cáo, đề xuất lãnh đạo Viện kiểm sát yêu cầu Toà án xác minh, thu thập tài liệu, chứng cứ theo quy định tại khoản 3 Điều 58 BLTTDS”"},{"id":"ksdd013","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, sau khi nghiên cứu hồ sơ vụ án, Kiểm sát viên, Kiểm tra viên phải xây dựng những văn bản nào?","o":["Biên bản nghiên cứu hồ sơ gửi Tòa án cùng với hồ sơ vụ án","Dự thảo bản án và dự thảo quyết định kháng nghị để trình lãnh đạo","Báo cáo đề xuất quan điểm giải quyết, dự thảo đề cương hỏi, dự thảo văn bản phát biểu","Chỉ dự thảo văn bản phát biểu ý kiến tại phiên tòa và gửi trước cho Tòa án"],"a":2,"ref":"Khoản 4 Điều 21 Quy chế 436: “xây dựng báo cáo đề xuất lãnh đạo Viện kiểm sát về quan điểm giải quyết vụ án, dự thảo đề cương hỏi, dự thảo văn bản phát biểu ý kiến tại phiên tòa”"},{"id":"ksdd014","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, phần nhận xét, đánh giá, ý kiến đề xuất của người nghiên cứu trong báo cáo đề xuất gồm những nội dung nào?","o":["Về nhân thân, hoàn cảnh kinh tế, gia đình của các đương sự và người làm chứng","Về án phí, chi phí tố tụng và thời hạn giải quyết vụ án của Tòa án các cấp","Chỉ về đường lối giải quyết vụ án và mức án phí mà mỗi đương sự phải chịu","Về tố tụng; về thu thập, đánh giá tài liệu, chứng cứ; về áp dụng pháp luật; về đường lối giải quyết vụ án"],"a":3,"ref":"Điểm b khoản 1 Điều 22 Quy chế 436: “vụ án về tố tụng; về thu thập, đánh giá tài liệu, chứng cứ; về áp dụng pháp luật; về đường lối giải quyết vụ án”"},{"id":"ksdd015","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, người nghiên cứu hồ sơ phải ký báo cáo đề xuất như thế nào?","o":["Ký và đóng dấu giáp lai giữa các trang","Không phải ký, chỉ cần lãnh đạo đơn vị ký duyệt","Ký nháy vào cuối mỗi trang và ký, ghi rõ họ tên vào cuối báo cáo","Chỉ ký và ghi rõ họ tên ở trang cuối báo cáo"],"a":2,"ref":"Khoản 2 Điều 22 Quy chế 436: “Người nghiên cứu hồ sơ phải ký nháy vào cuối mỗi trang và ký, ghi rõ họ tên vào cuối báo cáo”"},{"id":"ksdd016","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, lãnh đạo đơn vị, lãnh đạo Viện kiểm sát cho ý kiến đối với báo cáo đề xuất như thế nào?","o":["Chỉ cần ký nháy vào trang đầu báo cáo, không phải ghi ý kiến","Cho ý kiến miệng tại cuộc họp, Kiểm sát viên tự ghi lại vào biên bản","Ghi \"đã xem\" và ký; quan điểm cụ thể trao đổi trực tiếp với Kiểm sát viên","Nêu rõ đồng ý hay không đồng ý với đề xuất và lý do; ký, ghi rõ họ tên dưới ý kiến"],"a":3,"ref":"Khoản 3 Điều 22 Quy chế 436: “nêu rõ quan điểm đồng ý hoặc không đồng ý với đề xuất và lý do, ý kiến khác (nếu có); ký và ghi rõ họ tên dưới ý kiến của mình”"},{"id":"ksdd017","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, tại phiên tòa sơ thẩm, Kiểm sát viên hỏi vào thời điểm nào và hỏi những vấn đề gì?","o":["Kiểm sát viên hỏi trước Hội đồng xét xử để làm rõ nội dung đề cương hỏi","Kiểm sát viên hỏi xen kẽ cùng Hội đồng xét xử theo từng vấn đề","Kiểm sát viên không được hỏi, chỉ phát biểu ý kiến sau phần tranh luận","Sau khi Hội đồng xét xử kết thúc việc hỏi, Kiểm sát viên chỉ hỏi những vấn đề còn chưa rõ"],"a":3,"ref":"Khoản 1 Điều 25 Quy chế 436: “Sau khi Hội đồng xét xử kết thúc việc hỏi, Kiểm sát viên chỉ hỏi những vấn đề còn chưa rõ nhằm làm sáng tỏ sự thật khách quan của vụ án”"},{"id":"ksdd018","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, Kiểm sát viên yêu cầu tạm ngừng phiên tòa để thu thập, xác minh chứng cứ nhưng Hội đồng xét xử không chấp nhận và vẫn xét xử thì Kiểm sát viên phải làm gì?","o":["Rút khỏi phiên tòa, lập biên bản và báo cáo ngay lãnh đạo Viện kiểm sát","Tiếp tục tham gia, phát biểu rõ vụ án chưa đủ cơ sở giải quyết vì thiếu chứng cứ đã yêu cầu bổ sung","Đồng ý với quan điểm của Hội đồng xét xử và phát biểu theo chứng cứ hiện có","Chỉ phát biểu về việc tuân theo pháp luật tố tụng, không phát biểu về việc giải quyết vụ án"],"a":1,"ref":"Khoản 5 Điều 25 Quy chế 436: “phát biểu quan điểm của Viện kiểm sát nêu rõ việc chưa có đủ cơ sở để giải quyết vụ án vì thiếu những chứng cứ mà Kiểm sát viên đã yêu cầu Tòa án xác minh, thu thập bổ sung”"},{"id":"ksdd019","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, khi Chủ tọa phiên tòa tuyên án, Kiểm sát viên phải làm gì?","o":["Tuyên bố ngay tại phiên tòa việc kháng nghị bản án","Ghi chép nhận định, căn cứ pháp luật và phần quyết định của bản án để làm căn cứ kiểm sát bản án","Ký xác nhận vào bản án cùng Hội đồng xét xử","Phát biểu lại quan điểm của Viện kiểm sát nếu phần quyết định khác với đề xuất"],"a":1,"ref":"Khoản 6 Điều 25 Quy chế 436: “Kiểm sát viên phải ghi chép nhận định, căn cứ pháp luật và phần quyết định của bản án để làm căn cứ kiểm sát bản án, quyết định”"},{"id":"ksdd020","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, sau khi kết thúc phiên tòa sơ thẩm, Kiểm sát viên phải thực hiện việc gì?","o":["Báo cáo trong thời hạn 10 ngày khi nhận được bản án","Chỉ báo cáo khi đề xuất kháng nghị","Báo cáo ngay kết quả xét xử vụ án với lãnh đạo Viện kiểm sát","Báo cáo bằng miệng vào cuộc họp giao ban cuối tháng"],"a":2,"ref":"Điều 27 Quy chế 436: “Sau khi kết thúc phiên tòa sơ thẩm, Kiểm sát viên phải báo cáo ngay kết quả xét xử vụ án với lãnh đạo Viện kiểm sát”"},{"id":"ksdd021","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, Kiểm sát viên, Kiểm tra viên phải lập phiếu kiểm sát khi kiểm sát những văn bản nào của Tòa án cấp sơ thẩm?","o":["Bản án; quyết định đình chỉ, tạm đình chỉ giải quyết vụ án; quyết định công nhận sự thỏa thuận của các đương sự","Chỉ bản án sơ thẩm; các quyết định khác chỉ cần ghi vào sổ theo dõi án dân sự","Quyết định đưa vụ án ra xét xử, quyết định hoãn phiên tòa và quyết định tạm ngừng phiên tòa","Thông báo nộp tiền tạm ứng án phí và biên lai thu tiền tạm ứng án phí của đương sự"],"a":0,"ref":"Khoản 1 Điều 28 Quy chế 436: “phải lập phiếu kiểm sát khi kiểm sát bản án, quyết định đình chỉ giải quyết vụ án, quyết định tạm đình chỉ giải quyết vụ án, quyết định công nhận sự thỏa thuận của các đương sự”"},{"id":"ksdd022","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, phát hiện vi phạm trong bản án sơ thẩm nhưng đã hết thời hạn kháng nghị của Viện kiểm sát cùng cấp thì xử lý thế nào?","o":["Chuyển ngay hồ sơ lên Viện kiểm sát nhân dân tối cao đề nghị kháng nghị giám đốc thẩm","Không còn biện pháp xử lý vì bản án đã có hiệu lực, chỉ ghi nhận vào phiếu kiểm sát","Ban hành quyết định kháng nghị quá hạn kèm văn bản giải thích lý do gửi Tòa án cấp sơ thẩm","Báo cáo Viện trưởng cấp mình để báo cáo Viện kiểm sát cấp trên trực tiếp xem xét kháng nghị phúc thẩm"],"a":3,"ref":"Khoản 2 Điều 28 Quy chế 436: “Trường hợp đã hết thời hạn kháng nghị của Viện kiểm sát cùng cấp thì báo cáo Viện trưởng Viện kiểm sát cấp mình để báo cáo lãnh đạo Viện kiểm sát cấp trên trực tiếp xem xét kháng nghị phúc thẩm theo thẩm quyền”"},{"id":"ksdd023","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, Viện kiểm sát ở cấp sơ thẩm phải sao gửi ngay bản án, quyết định chưa có hiệu lực pháp luật kèm Phiếu kiểm sát và thông báo việc kháng cáo (nếu có) cho cơ quan nào?","o":["Tòa án cấp phúc thẩm","Viện kiểm sát ở cấp phúc thẩm","Viện kiểm sát nhân dân tối cao (Vụ 9)","Cơ quan thi hành án dân sự"],"a":1,"ref":"Khoản 5 Điều 28 Quy chế 436: “Viện kiểm sát ở cấp sơ thẩm phải sao gửi ngay bản án, quyết định chưa có hiệu lực pháp luật kèm theo Phiếu kiểm sát bản án” … “cho Viện kiểm sát ở cấp phúc thẩm”"},{"id":"ksdd024","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, khi cần xác minh, thu thập chứng cứ để bảo đảm việc kháng nghị phúc thẩm, Viện kiểm sát thực hiện theo quy định nào của BLTTDS?","o":["Điều 97 và Điều 106 BLTTDS","Điều 205 và Điều 206 BLTTDS","Điều 184 và Điều 185 BLTTDS","Điều 326 và Điều 327 BLTTDS"],"a":0,"ref":"Khoản 1 Điều 33 Quy chế 436: “thực hiện quyền xác minh, thu thập tài liệu, chứng cứ theo quy định tại Điều 97 và Điều 106 BLTTDS”"},{"id":"ksdd025","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, ngoài việc gửi theo quy định của BLTTDS, quyết định kháng nghị phúc thẩm của Viện kiểm sát cấp sơ thẩm còn phải đồng thời gửi cho ai?","o":["Chánh án Tòa án nhân dân tối cao","Viện kiểm sát cấp trên trực tiếp","Cơ quan điều tra cùng cấp","Ủy ban nhân dân cấp xã nơi có đất"],"a":1,"ref":"Khoản 4 Điều 34 Quy chế 436: “đồng thời gửi cho Viện kiểm sát cấp trên trực tiếp”"},{"id":"ksdd026","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, tại phiên tòa phúc thẩm, việc thay đổi, bổ sung, rút kháng nghị do ai quyết định?","o":["Viện trưởng Viện kiểm sát đã kháng nghị quyết định qua điện thoại","Kiểm sát viên tham gia phiên tòa quyết định và chịu trách nhiệm","Hội đồng xét xử phúc thẩm quyết định","Tập thể lãnh đạo Viện kiểm sát cấp trên quyết định"],"a":1,"ref":"Khoản 3 Điều 35 Quy chế 436: “Tại phiên tòa phúc thẩm, việc thay đổi, bổ sung, rút kháng nghị do Kiểm sát viên tham gia phiên tòa quyết định và phải chịu trách nhiệm về quyết định của mình”"},{"id":"ksdd027","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, trước khi mở phiên tòa, Viện trưởng Viện kiểm sát cấp trên trực tiếp xét thấy có căn cứ rút kháng nghị của cấp dưới thì xử lý thế nào?","o":["Báo cáo Viện trưởng Viện kiểm sát nhân dân tối cao quyết định việc rút kháng nghị","Có văn bản yêu cầu Tòa án cấp phúc thẩm đình chỉ xét xử phúc thẩm","Tự ban hành quyết định rút kháng nghị mà không cần trao đổi với Viện trưởng cấp dưới","Trao đổi bằng văn bản với Viện trưởng cấp dưới; nếu không nhất trí thì cấp trên quyết định và chịu trách nhiệm"],"a":3,"ref":"Khoản 2 Điều 35 Quy chế 436: “thì trao đổi bằng văn bản với Viện trưởng Viện kiểm sát cấp dưới đã kháng nghị để Viện trưởng Viện kiểm sát cấp dưới xem xét rút kháng nghị” … “thì Viện trưởng Viện kiểm sát cấp trên quyết định và chịu trách nhiệm về quyết định đó”"},{"id":"ksdd028","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, trường hợp Kiểm sát viên có quan điểm khác với quan điểm của Viện trưởng thì Kiểm sát viên có quyền và nghĩa vụ gì?","o":["Được tự quyết định theo quan điểm của mình và chịu trách nhiệm cá nhân","Phải chấp hành ngay ý kiến của Viện trưởng, không được báo cáo lại","Có quyền từ chối nhiệm vụ được giao và phải kịp thời báo cáo bằng văn bản với Viện trưởng","Báo cáo miệng với Viện kiểm sát cấp trên mà không cần báo cáo Viện trưởng"],"a":2,"ref":"Khoản 3 Điều 63 Quy chế 436: “thì có quyền từ chối nhiệm vụ được giao và phải kịp thời báo cáo bằng văn bản với Viện trưởng”"},{"id":"ksdd029","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Theo Quy chế 436/QĐ-VKSTC, sau khi Kiểm sát viên báo cáo quan điểm khác, nếu Viện trưởng vẫn quyết định việc thi hành thì xử lý thế nào?","o":["Viện trưởng phải có văn bản; Kiểm sát viên phải chấp hành, không chịu trách nhiệm về hậu quả và báo cáo bằng văn bản với cấp trên","Viện trưởng chỉ cần chỉ đạo miệng; Kiểm sát viên chấp hành, không phải báo cáo cấp trên","Kiểm sát viên phải chấp hành và chịu toàn bộ trách nhiệm về hậu quả của việc thi hành","Kiểm sát viên được quyền không chấp hành và tự quyết định theo quan điểm của mình"],"a":0,"ref":"Khoản 3 Điều 63 Quy chế 436: “trường hợp Viện trưởng vẫn quyết định việc thi hành thì phải có văn bản và Kiểm sát viên phải chấp hành nhưng không phải chịu trách nhiệm về hậu quả của việc thi hành”"},{"id":"ksdd030","cat":"ksdd","topic":"Quy chế 436/QĐ-VKSTC","q":"Quy chế công tác kiểm sát việc g
