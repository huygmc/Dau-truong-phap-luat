d":"nq205_108","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 3 Điều 18 Thông tư liên tịch số 09/2025/TTLT, hết thời hạn mà cơ quan, tổ chức, cá nhân được yêu cầu chấm dứt vi phạm không trả lời, không chấp nhận hoặc thực hiện không đầy đủ, không hiệu quả mà không có lý do chính đáng thì Viện kiểm sát làm gì?","o":["Đình chỉ việc kiểm tra, xác minh và thông báo cho bên vi phạm","Xem xét thực hiện việc thông báo khởi kiện hoặc kiến nghị khởi kiện","Đề nghị Tòa án xử phạt vi phạm hành chính đối với bên vi phạm","Ban hành ngay quyết định khởi kiện vụ án dân sự công ích"],"a":1,"ref":"Khoản 3 Điều 18 TTLT 09/2025"},{"id":"nq205_109","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 2 Điều 13 Nghị quyết số 205/2025/QH15, Viện kiểm sát tiến hành thông báo, kiến nghị khởi kiện trong thời hạn bao lâu kể từ ngày có kết quả kiểm tra, xác minh xác định quyền dân sự của chủ thể thuộc nhóm dễ bị tổn thương hoặc lợi ích công bị xâm phạm?","o":["02 tháng","45 ngày","30 ngày","15 ngày"],"a":2,"ref":"Khoản 2 Điều 13 NQ 205/2025/QH15"},{"id":"nq205_110","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo điểm b khoản 2 Điều 13 Nghị quyết số 205/2025/QH15, khi kiến nghị cơ quan, tổ chức, cá nhân có quyền, trách nhiệm khởi kiện thực hiện việc khởi kiện, Viện kiểm sát đồng thời gửi kiến nghị cho ai?","o":["Tòa án khu vực có thẩm quyền giải quyết sơ thẩm vụ án","Viện kiểm sát nhân dân tối cao (qua Vụ 9) để theo dõi","Cơ quan, tổ chức cấp trên trực tiếp của cơ quan, tổ chức, cá nhân đó","Ủy ban nhân dân cấp tỉnh nơi xảy ra hành vi vi phạm"],"a":2,"ref":"Điểm b khoản 2 Điều 13 NQ 205/2025/QH15"},{"id":"nq205_111","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 3 Điều 13 Nghị quyết số 205/2025/QH15, cơ quan, tổ chức, cá nhân nhận được thông báo, kiến nghị của Viện kiểm sát có trách nhiệm trả lời bằng văn bản trong thời hạn nào?","o":["15 ngày kể từ ngày nhận được thông báo, kiến nghị","30 ngày kể từ ngày nhận được thông báo, kiến nghị","20 ngày làm việc kể từ ngày nhận được thông báo, kiến nghị","02 tháng kể từ ngày nhận được thông báo, kiến nghị"],"a":1,"ref":"Khoản 3 Điều 13 NQ 205/2025/QH15"},{"id":"nq205_112","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 1 Điều 19 Thông tư liên tịch số 09/2025/TTLT, thông báo khởi kiện của Viện kiểm sát được gửi cho chủ thể nào?","o":["Chủ thể là nhóm dễ bị tổn thương có quyền dân sự bị xâm phạm hoặc người đại diện hợp pháp của họ","Cơ quan, tổ chức quản lý, phụ trách ngành, lĩnh vực có quyền khởi kiện","Tòa án khu vực có thẩm quyền giải quyết vụ án","Cơ quan, tổ chức, cá nhân có hành vi vi phạm và cơ quan cấp trên của họ"],"a":0,"ref":"Khoản 1 Điều 19 TTLT 09/2025"},{"id":"nq205_113","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo Hướng dẫn số 42/HD-VKSTC, trường hợp chủ thể có quyền dân sự bị xâm phạm hoặc người đại diện theo pháp luật của họ ủy quyền cho người khác thì thông báo khởi kiện được gửi cho ai?","o":["Chỉ gửi cho người ủy quyền","Gửi cho Hội có chức năng bảo vệ chủ thể đó thay thế","Người được ủy quyền, với điều kiện có văn bản ủy quyền hợp pháp","Gửi cho Ủy ban nhân dân cấp xã nơi người đó cư trú"],"a":2,"ref":"Điểm b tiểu mục 1.1 Mục 1 Phần III.B HD 42/HD-VKSTC"},{"id":"nq205_114","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 2 Điều 19 Thông tư liên tịch số 09/2025/TTLT, hết thời hạn trả lời mà Viện kiểm sát không nhận được văn bản trả lời của chủ thể thuộc nhóm dễ bị tổn thương được thông báo khởi kiện thì Viện kiểm sát làm gì?","o":["Gửi thông báo khởi kiện lần thứ hai cho chủ thể đó","Ban hành ngay quyết định khởi kiện vụ án dân sự công ích","Đình chỉ việc kiểm tra, xác minh theo điểm d khoản 1 Điều 12 Nghị quyết","Thực hiện việc kiến nghị khởi kiện theo Điều 20 Thông tư liên tịch"],"a":3,"ref":"Khoản 2 Điều 19 TTLT 09/2025"},{"id":"nq205_115","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 3 Điều 19 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát nhận được văn bản trả lời của chủ thể thuộc nhóm dễ bị tổn thương về việc họ sẽ tự mình khởi kiện hoặc đề nghị không khởi kiện thì xử lý thế nào?","o":["Xem xét, quyết định đình chỉ việc kiểm tra, xác minh theo điểm c hoặc điểm d khoản 1 Điều 12 Nghị quyết số 205/2025/QH15","Ban hành quyết định chấm dứt việc kiểm tra, xác minh theo khoản 5 Điều 17 Thông tư liên tịch số 09/2025/TTLT","Ban hành ngay quyết định khởi kiện vụ án dân sự công ích theo khoản 1 Điều 14 Nghị quyết số 205/2025/QH15","Ban hành kiến nghị khởi kiện gửi cơ quan quản lý ngành, lĩnh vực theo điểm b khoản 2 Điều 13 Nghị quyết số 205/2025/QH15"],"a":0,"ref":"Khoản 3 Điều 19 TTLT 09/2025"},{"id":"nq205_116","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 1 Điều 20 Thông tư liên tịch số 09/2025/TTLT, kiến nghị khởi kiện của Viện kiểm sát (Mẫu số 24/DSCI) được gửi cho chủ thể nào?","o":["Tòa án có thẩm quyền giải quyết","Cơ quan, tổ chức, cá nhân có hành vi vi phạm","Cơ quan, tổ chức quản lý, phụ trách ngành, lĩnh vực","Chủ thể thuộc nhóm dễ bị tổn thương bị xâm phạm"],"a":2,"ref":"Khoản 1 Điều 20 TTLT 09/2025"},{"id":"nq205_117","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 2 Điều 20 Thông tư liên tịch số 09/2025/TTLT, hết thời hạn mà Viện kiểm sát không nhận được văn bản trả lời của cơ quan, tổ chức được kiến nghị, hoặc nhận được văn bản từ chối khởi kiện không có lý do chính đáng, hoặc đề nghị Viện kiểm sát khởi kiện thì Viện kiểm sát xử lý thế nào?","o":["Gửi kiến nghị khởi kiện lần thứ hai cho cơ quan, tổ chức đó và cơ quan cấp trên","Xem xét, quyết định khởi kiện vụ án dân sự công ích trong thời hạn quy định tại khoản 1 Điều 14 Nghị quyết số 205/2025/QH15","Đình chỉ việc kiểm tra, xác minh vì đã thực hiện xong việc kiến nghị","Chuyển hồ sơ để cơ quan cấp trên của cơ quan được kiến nghị khởi kiện thay"],"a":1,"ref":"Khoản 2 Điều 20 TTLT 09/2025"},{"id":"nq205_118","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo Hướng dẫn số 42/HD-VKSTC, trường hợp có nhiều cơ quan, tổ chức cùng có quyền, trách nhiệm khởi kiện đối với một đối tượng hoặc lĩnh vực được bảo vệ thì Viện kiểm sát kiến nghị khởi kiện như thế nào?","o":["Kiến nghị đến tất cả cơ quan, tổ chức đó; nếu nhiều cơ quan cùng đồng ý thì tôn trọng quyết định của họ nhưng phải bảo đảm có ít nhất 01 cơ quan, tổ chức thực hiện khởi kiện","Chỉ kiến nghị cơ quan có cấp hành chính cao nhất; các cơ quan còn lại chỉ được thông báo để biết","Kiến nghị lần lượt từng cơ quan, mỗi cơ quan có 30 ngày trả lời theo thứ tự cấp quản lý","Chỉ kiến nghị cơ quan đầu tiên tiếp nhận vụ việc; nếu cơ quan này không khởi kiện thì Viện kiểm sát khởi kiện"],"a":0,"ref":"Tiểu mục 2.3 Mục 2 Phần III.B HD 42/HD-VKSTC"},{"id":"nq205_119","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo Hướng dẫn số 42/HD-VKSTC, trong thời hạn 30 ngày kể từ ngày nhận kiến nghị, cơ quan được kiến nghị đã có văn bản trả lời không khởi kiện nhưng sau đó lại có văn bản trả lời đồng ý khởi kiện thì xác định thế nào?","o":["Căn cứ văn bản trả lời đầu tiên","Xác định là cơ quan, tổ chức không khởi kiện","Viện kiểm sát phải ban hành kiến nghị mới","Xác định là cơ quan, tổ chức đã đồng ý khởi kiện"],"a":3,"ref":"Tiểu mục 2.4 Mục 2 Phần III.B HD 42/HD-VKSTC"},{"id":"nq205_120","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo Hướng dẫn số 42/HD-VKSTC, trong quá trình thông báo khởi kiện, nếu có sự bất đồng ý chí giữa chủ thể có quyền dân sự bị xâm phạm (hoặc người đại diện theo pháp luật) với người đại diện theo ủy quyền thì Viện kiểm sát căn cứ vào ý chí của ai?","o":["Hội có chức năng bảo vệ chủ thể đó","Kiểm sát viên được phân công tự quyết định","Chủ thể có quyền dân sự bị xâm phạm, người đại diện theo pháp luật","Người đại diện theo ủy quyền"],"a":2,"ref":"Tiểu mục 1.3 Mục 1 Phần III.B HD 42/HD-VKSTC"},{"id":"nq205_121","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo Hướng dẫn số 42/HD-VKSTC, nếu có sự bất đồng ý chí giữa trẻ em từ đủ 07 tuổi trở lên có quyền dân sự bị xâm phạm với người đại diện theo pháp luật mà ý kiến của người đại diện không có lợi cho trẻ em thì Viện kiểm sát xử lý thế nào?","o":["Lựa chọn cách thức thực hiện có lợi nhất cho trẻ em và nêu rõ căn cứ, lý do lựa chọn trong báo cáo đề xuất","Bắt buộc thực hiện theo ý kiến của trẻ em vì trẻ đã đủ 07 tuổi","Bắt buộc thực hiện theo ý kiến của người đại diện theo pháp luật của trẻ em","Đình chỉ việc kiểm tra, xác minh do có sự bất đồng ý chí"],"a":0,"ref":"Tiểu mục 1.3 Mục 1 Phần III.B HD 42/HD-VKSTC"},{"id":"nq205_122","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo Hướng dẫn số 20/HD-VKSTC, trường hợp chủ thể được Viện kiểm sát thông báo khởi kiện hoặc kiến nghị khởi kiện trả lời không khởi kiện mà không nêu lý do thì Viện kiểm sát xử lý thế nào?","o":["Yêu cầu chủ thể bổ sung lý do trước khi xem xét khởi kiện","Đình chỉ việc kiểm tra, xác minh","Coi như chủ thể đồng ý khởi kiện","Viện kiểm sát xem xét khởi kiện, không bắt buộc chủ thể phải có lý do chính đáng"],"a":3,"ref":"Tiểu mục 1.6 Mục 1 Phần III HD 20/HD-VKSTC"},{"id":"nq205_123","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo Hướng dẫn số 42/HD-VKSTC, trường hợp cơ quan, tổ chức cấp trên đã có văn bản trả lời là đã yêu cầu cơ quan cấp dưới khởi kiện nhưng cơ quan cấp dưới vẫn không khởi kiện thì Viện kiểm sát làm gì?","o":["Thông báo bằng văn bản cho cơ quan, tổ chức cấp trên biết để xem xét, xử lý trách nhiệm của cấp dưới","Kiến nghị khởi kiện lại từ đầu với cơ quan cấp dưới và chờ thêm 30 ngày","Đình chỉ việc kiểm tra, xác minh vì cơ quan cấp trên đã xử lý","Đề nghị Tòa án ra quyết định buộc cơ quan cấp dưới khởi kiện"],"a":0,"ref":"Tiểu mục 2.5 Mục 2 Phần III.B HD 42/HD-VKSTC"},{"id":"nq205_124","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 1 Điều 21 Thông tư liên tịch số 09/2025/TTLT, văn bản đề nghị Viện kiểm sát hỗ trợ khởi kiện phải nêu rõ nội dung gì?","o":["Số tiền chi phí tố tụng mà Viện kiểm sát phải tạm ứng thay người khởi kiện","Ý kiến đồng ý của Tòa án về việc Viện kiểm sát tham gia hỗ trợ","Cam kết không rút đơn khởi kiện trong suốt quá trình giải quyết vụ án","Biện pháp hỗ trợ được đề nghị và lý do cơ quan, tổ chức, cá nhân không thực hiện được biện pháp đó"],"a":3,"ref":"Khoản 1 Điều 21 TTLT 09/2025"},{"id":"nq205_125","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 1 Điều 21 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát trả lời bằng văn bản về việc hỗ trợ hoặc không hỗ trợ khởi kiện trong thời hạn nào kể từ ngày nhận được văn bản đề nghị?","o":["02 ngày làm việc","15 ngày","05 ngày làm việc","03 ngày làm việc"],"a":3,"ref":"Khoản 1 Điều 21 TTLT 09/2025"},{"id":"nq205_126","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Biện pháp nào sau đây KHÔNG thuộc các biện pháp hỗ trợ khởi kiện của Viện kiểm sát theo khoản 2 Điều 21 Thông tư liên tịch số 09/2025/TTLT?","o":["Cho ý kiến về các vấn đề có liên quan theo đề nghị mà Viện kiểm sát xét thấy cần thiết","Cung cấp tài liệu, chứng cứ về vụ án dân sự công ích mà Viện kiểm sát đã thu thập được","Tham gia tố tụng với tư cách người đại diện theo ủy quyền của người khởi kiện","Hướng dẫn về pháp luật tố tụng dân sự để thực hiện việc khởi kiện"],"a":2,"ref":"Khoản 2 Điều 21 TTLT 09/2025"},{"id":"nq205_127","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 3 Điều 21 Thông tư liên tịch số 09/2025/TTLT, đối với các biện pháp hỗ trợ cung cấp tài liệu, hướng dẫn pháp luật tố tụng dân sự, cho ý kiến, Viện kiểm sát gửi kết quả hỗ trợ trong thời hạn nào?","o":["02 tháng kể từ ngày nhận được văn bản đề nghị","03 ngày làm việc kể từ ngày nhận được văn bản đề nghị","30 ngày kể từ ngày nhận được văn bản đề nghị hỗ trợ khởi kiện","15 ngày kể từ ngày nhận được văn bản đề nghị"],"a":2,"ref":"Khoản 3 Điều 21 TTLT 09/2025"},{"id":"nq205_128","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 4 Điều 21 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát không hỗ trợ hoặc chấm dứt hỗ trợ khởi kiện trong trường hợp nào?","o":["Chủ thể đề nghị hỗ trợ là cơ quan nhà nước có bộ phận pháp chế chuyên trách hoặc có cán bộ làm công tác pháp chế","Có căn cứ xác định chủ thể đề nghị sẽ không khởi kiện; hoặc chủ thể khởi kiện thay đổi, rút một phần hoặc toàn bộ yêu cầu khởi kiện mà làm ảnh hưởng đến lợi ích công","Chủ thể đề nghị hỗ trợ đã có luật sư hoặc trợ giúp viên pháp lý tham gia bảo vệ quyền, lợi ích hợp pháp","Vụ án có giá trị tranh chấp nhỏ, không tương xứng với chi phí, thời gian Viện kiểm sát phải bỏ ra để hỗ trợ"],"a":1,"ref":"Khoản 4 Điều 21 TTLT 09/2025"},{"id":"nq205_129","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 6 Điều 21 Thông tư liên tịch số 09/2025/TTLT, sau khi trả lời không hỗ trợ hoặc chấm dứt hỗ trợ khởi kiện, Viện kiểm sát có thể làm gì?","o":["Chỉ được ban hành kiến nghị phòng ngừa vi phạm pháp luật gửi cơ quan quản lý","Thực hiện việc khởi kiện nếu thuộc trường hợp theo quy định của Nghị quyết số 205/2025/QH15 và Thông tư liên tịch","Phải chuyển vụ việc cho Viện kiểm sát cấp trên trực tiếp xem xét, quyết định","Không được thực hiện bất kỳ hoạt động nào khác đối với vụ việc đó và phải kết thúc hồ sơ"],"a":1,"ref":"Khoản 6 Điều 21 TTLT 09/2025"},{"id":"nq205_130","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo Hướng dẫn số 42/HD-VKSTC, khi thực hiện biện pháp hỗ trợ “cung cấp tài liệu, chứng cứ mà Viện kiểm sát đã thu thập được”, Viện kiểm sát cung cấp loại tài liệu nào?","o":["Bản sao có công chứng do người đề nghị hỗ trợ tự thực hiện tại tổ chức hành nghề công chứng","Bản chính tài liệu, chứng cứ để người khởi kiện nộp trực tiếp cho Tòa án","Chỉ cung cấp danh mục tài liệu, không cung cấp nội dung tài liệu, chứng cứ","Bản sao tài liệu, chứng cứ (Viện kiểm sát thực hiện sao y), có lập danh sách thành 02 bản"],"a":3,"ref":"Điểm a tiểu mục 3.4 Mục 3 Phần III.B HD 42/HD-VKSTC"},{"id":"nq205_131","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo Hướng dẫn số 42/HD-VKSTC, trường hợp bên vi phạm đồng ý thực hiện yêu cầu của Viện kiểm sát nhưng việc chấm dứt hành vi vi phạm, khắc phục hậu quả cần có lộ trình thì Viện kiểm sát xử lý thế nào?","o":["Khởi kiện ngay vụ án dân sự công ích vì hành vi vi phạm chưa được chấm dứt và hậu quả chưa được khắc phục xong","Yêu cầu xác định rõ biện pháp, thời hạn, lộ trình thực hiện, cam kết thực hiện và trách nhiệm thông báo cho Viện kiểm sát; đồng thời tổ chức theo dõi, kiểm tra","Chuyển cho Tòa án khu vực có thẩm quyền theo dõi việc thực hiện lộ trình khắc phục hậu quả của bên vi phạm","Đình chỉ ngay việc kiểm tra, xác minh vì bên vi phạm đã có văn bản đồng ý thực hiện yêu cầu của Viện kiểm sát"],"a":1,"ref":"Tiểu mục 7.4 Mục 7 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_132","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 1 Điều 14 Nghị quyết số 205/2025/QH15, Viện kiểm sát xem xét, quyết định khởi kiện vụ án dân sự công ích trong thời hạn bao lâu?","o":["02 tháng kể từ ngày Viện kiểm sát ban hành kiến nghị khởi kiện","02 tháng kể từ ngày hết thời hạn trả lời thông báo, kiến nghị (khoản 3 Điều 13) mà không có người khởi kiện hoặc không nhận được văn bản trả lời","30 ngày kể từ ngày hết thời hạn trả lời thông báo, kiến nghị mà không có người khởi kiện","03 tháng kể từ ngày thụ lý vụ việc dân sự công ích"],"a":1,"ref":"Khoản 1 Điều 14 NQ 205/2025/QH15"},{"id":"nq205_133","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Nội dung nào sau đây KHÔNG thuộc nội dung chính của quyết định khởi kiện vụ án dân sự công ích theo khoản 2 Điều 14 Nghị quyết số 205/2025/QH15?","o":["Mức án phí Viện kiểm sát tạm nộp","Yêu cầu khởi kiện và lý do khởi kiện","Tên, địa chỉ của bị đơn","Tên, địa chỉ của cơ quan, tổ chức, cá nhân được bảo vệ"],"a":0,"ref":"Khoản 2 Điều 14 NQ 205/2025/QH15"},{"id":"nq205_134","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 3 Điều 14 Nghị quyết số 205/2025/QH15, Viện kiểm sát gửi quyết định khởi kiện kèm theo tài liệu, chứng cứ đến Tòa án có thẩm quyền trong thời hạn nào?","o":["15 ngày kể từ ngày ban hành","07 ngày kể từ ngày ban hành","05 ngày làm việc kể từ ngày ban hành","03 ngày làm việc kể từ ngày ban hành"],"a":2,"ref":"Khoản 3 Điều 14 NQ 205/2025/QH15"},{"id":"nq205_135","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 4 Điều 14 Nghị quyết số 205/2025/QH15, khi khởi kiện vụ án dân sự công ích, Viện kiểm sát có nghĩa vụ gì về án phí?","o":["Không phải nộp tạm ứng án phí nhưng phải chịu án phí nếu yêu cầu không được chấp nhận","Phải nộp tạm ứng án phí nhưng không phải chịu án phí","Không phải nộp tạm ứng án phí, không phải chịu án phí","Phải nộp tạm ứng và chịu án phí như người khởi kiện khác"],"a":2,"ref":"Khoản 4 Điều 14 NQ 205/2025/QH15"},{"id":"nq205_136","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 4 Điều 14 Nghị quyết số 205/2025/QH15, trường hợp Viện kiểm sát yêu cầu áp dụng biện pháp khẩn cấp tạm thời không đúng mà gây thiệt hại thì việc bồi thường thực hiện theo quy định nào?","o":["Không phải bồi thường vì Viện kiểm sát thực hiện công vụ","Kiểm sát viên tự bồi thường theo Bộ luật Tố tụng dân sự","Luật Trách nhiệm bồi thường của Nhà nước","Luật Cán bộ, công chức"],"a":2,"ref":"Khoản 4 Điều 14 NQ 205/2025/QH15"},{"id":"nq205_137","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo điểm b khoản 1 Điều 14 Nghị quyết số 205/2025/QH15, Viện kiểm sát xem xét, quyết định khởi kiện vụ án để bảo vệ quyền dân sự của chủ thể thuộc nhóm dễ bị tổn thương khi nào?","o":["Chỉ khi có văn bản đề nghị của Ủy ban nhân dân cấp xã hoặc tổ chức chính trị - xã hội nơi người bị xâm phạm cư trú","Trong mọi trường hợp quyền dân sự của họ bị xâm phạm, không cần có đề nghị của người bị xâm phạm hoặc người đại diện hợp pháp của họ","Khi người bị xâm phạm hoặc người đại diện hợp pháp của họ không thể tự mình khởi kiện và đề nghị Viện kiểm sát khởi kiện; trường hợp không đề nghị do bị lừa dối, đe dọa, cưỡng ép hoặc nhầm lẫn thì Viện kiểm sát xem xét, quyết định","Chỉ khi người bị xâm phạm đã tự nộp đơn khởi kiện nhưng bị Tòa án trả lại đơn khởi kiện vì không đủ điều kiện"],"a":2,"ref":"Điểm b khoản 1 Điều 14 NQ 205/2025/QH15"},{"id":"nq205_138","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 2 Điều 22 Thông tư liên tịch số 09/2025/TTLT, trường hợp Viện kiểm sát cấp trên phân công cho Viện kiểm sát cấp dưới khởi kiện thì Viện kiểm sát cấp trên gửi quyết định phân công và hồ sơ cho Viện kiểm sát cấp dưới trong thời hạn nào?","o":["02 tháng kể từ ngày có căn cứ khởi kiện","05 ngày làm việc kể từ ngày có căn cứ khởi kiện","30 ngày kể từ ngày có căn cứ khởi kiện","15 ngày kể từ ngày có căn cứ khởi kiện"],"a":3,"ref":"Khoản 2 Điều 22 TTLT 09/2025"},{"id":"nq205_139","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo điểm a khoản 5 Điều 22 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát khởi kiện vụ án dân sự công ích không có quyền tự thỏa thuận với tổ chức, cá nhân bị kiện về việc giải quyết vụ án, trừ trường hợp nào?","o":["Tổ chức, cá nhân bị kiện đồng ý thực hiện toàn bộ trách nhiệm theo yêu cầu khởi kiện của Viện kiểm sát và được Tòa án công nhận sự thỏa thuận","Người được bảo vệ đồng ý nhận mức bồi thường thấp hơn yêu cầu khởi kiện","Tổ chức, cá nhân bị kiện đồng ý thực hiện phần lớn yêu cầu khởi kiện và Viện kiểm sát chấp thuận","Viện trưởng Viện kiểm sát cấp trên đồng ý bằng văn bản về nội dung thỏa thuận"],"a":0,"ref":"Điểm a khoản 5 Điều 22 TTLT 09/2025"},{"id":"nq205_140","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo Hướng dẫn số 42/HD-VKSTC, ở Viện kiểm sát nhân dân khu vực, báo cáo đề xuất khởi kiện vụ án dân sự công ích phải có ý kiến của ai?","o":["Trưởng phòng 9 Viện kiểm sát cấp tỉnh","Ủy ban kiểm sát Viện kiểm sát cấp tỉnh","Phó Viện trưởng, Viện trưởng Viện kiểm sát nhân dân khu vực","Chỉ cần ý kiến của Kiểm sát viên giải quyết chính"],"a":2,"ref":"Tiểu mục 2.2 Mục 2 Phần IV.B HD 42/HD-VKSTC"},{"id":"nq205_141","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 1 Điều 23 Thông tư liên tịch số 09/2025/TTLT, trong thời hạn bao lâu kể từ ngày nhận được quyết định yêu cầu áp dụng biện pháp khẩn cấp tạm thời của Viện kiểm sát, Tòa án phải ban hành quyết định áp dụng hoặc thông báo không chấp nhận bằng văn bản?","o":["05 ngày làm việc","03 ngày làm việc","07 ngày","48 giờ"],"a":1,"ref":"Khoản 1 Điều 23 TTLT 09/2025"},{"id":"nq205_142","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 3 Điều 23 Thông tư liên tịch số 09/2025/TTLT, trường hợp nào sau đây Viện kiểm sát ban hành quyết định yêu cầu Tòa án hủy bỏ việc áp dụng biện pháp khẩn cấp tạm thời?","o":["Thay đổi Kiểm sát viên tham gia phiên tòa","Tòa án hoãn phiên tòa","Viện kiểm sát rút quyết định khởi kiện","Bị đơn kháng cáo bản án sơ thẩm"],"a":2,"ref":"Điểm c khoản 3 Điều 23 TTLT 09/2025"},{"id":"nq205_143","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 1 Điều 25 Thông tư liên tịch số 09/2025/TTLT, Tòa án xử lý quyết định khởi kiện của Viện kiểm sát và tài liệu, chứng cứ kèm theo trong thời hạn nào?","o":["08 ngày làm việc kể từ ngày nhận được","03 ngày làm việc kể từ ngày nhận được","15 ngày kể từ ngày nhận được","05 ngày làm việc kể từ ngày nhận được"],"a":3,"ref":"Khoản 1 Điều 25 TTLT 09/2025"},{"id":"nq205_144","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 2 Điều 25 Thông tư liên tịch số 09/2025/TTLT, trường hợp Viện kiểm sát và Tòa án không thống nhất được về thẩm quyền giải quyết vụ án dân sự công ích thì ai quyết định Tòa án có thẩm quyền?","o":["Viện trưởng Viện kiểm sát cấp trên quyết định sau khi trao đổi với Chánh án Tòa án đã nhận quyết định khởi kiện","Hội đồng Thẩm phán Tòa án nhân dân tối cao quyết định bằng nghị quyết hướng dẫn áp dụng pháp luật","Chánh án Tòa án cùng cấp với Viện kiểm sát cấp trên, sau khi Viện trưởng Viện kiểm sát cấp trên có ý kiến trong thời hạn 15 ngày","Chánh án Tòa án nhân dân tối cao quyết định trong mọi trường hợp, không phụ thuộc cấp của Tòa án"],"a":2,"ref":"Khoản 2 Điều 25 TTLT 09/2025"},{"id":"nq205_145","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 2 Điều 24 Thông tư liên tịch số 09/2025/TTLT, trường hợp nơi bị đơn cư trú, làm việc hoặc có trụ sở không thuộc tỉnh, thành phố thực hiện thí điểm nhưng nơi xảy ra hành vi vi phạm hoặc hậu quả thiệt hại thuộc tỉnh, thành phố thí điểm thì Tòa án nào có thẩm quyền?","o":["Vụ việc không thuộc phạm vi thí điểm nên không được khởi kiện","Tòa án nhân dân tối cao chỉ định","Tòa án khu vực nơi bị đơn cư trú","Tòa án khu vực nơi xảy ra hành vi vi phạm hoặc nơi xảy ra hậu quả thiệt hại đó"],"a":3,"ref":"Khoản 2 Điều 24 TTLT 09/2025"},{"id":"nq205_146","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 3 Điều 24 Thông tư liên tịch số 09/2025/TTLT, trường hợp có bất động sản thuộc tỉnh, thành phố thực hiện thí điểm và có bất động sản không thuộc tỉnh, thành phố thực hiện thí điểm thì Tòa án nào có thẩm quyền giải quyết sơ thẩm?","o":["Tòa án khu vực nơi có bất động sản thuộc tỉnh, thành phố thực hiện thí điểm","Tòa án nhân dân cấp tỉnh nơi có bất động sản thuộc tỉnh thí điểm","Tòa án khu vực nơi bị đơn cư trú","Tòa án khu vực nơi có bất động sản có giá trị lớn nhất"],"a":0,"ref":"Khoản 3 Điều 24 TTLT 09/2025"},{"id":"nq205_147","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 1 Điều 16 Nghị quyết số 205/2025/QH15, trường hợp Kiểm sát viên được phân công vắng mặt tại phiên tòa xét xử vụ án dân sự công ích thì Hội đồng xét xử xử lý thế nào?","o":["Tiếp tục xét xử vắng mặt Kiểm sát viên","Đình chỉ giải quyết vụ án","Tạm đình chỉ giải quyết vụ án","Hoãn phiên tòa"],"a":3,"ref":"Khoản 1 Điều 16 NQ 205/2025/QH15"},{"id":"nq205_148","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Nội dung nào sau đây KHÔNG thuộc nhiệm vụ, quyền hạn của Kiểm sát viên tại phiên tòa xét xử vụ án dân sự công ích theo khoản 2 Điều 16 Nghị quyết số 205/2025/QH15?","o":["Kiểm sát việc tuân theo pháp luật trong giải quyết vụ án","Quyết định tạm ngừng phiên tòa","Thay đổi, rút một phần hoặc toàn bộ yêu cầu khởi kiện","Công bố quyết định khởi kiện"],"a":1,"ref":"Khoản 2 Điều 16 NQ 205/2025/QH15"},{"id":"nq205_149","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 1 Điều 26 Thông tư liên tịch số 09/2025/TTLT, vụ án dân sự công ích do Viện kiểm sát khởi kiện thì Kiểm sát viên của Viện kiểm sát nào phải tham gia phiên tòa sơ thẩm?","o":["Bất kỳ Kiểm sát viên nào do Tòa án đề nghị","Kiểm sát viên Viện kiểm sát nhân dân tối cao","Kiểm sát viên Viện kiểm sát cấp tỉnh","Kiểm sát viên Viện kiểm sát cùng cấp với Tòa án xét xử sơ thẩm vụ án"],"a":3,"ref":"Khoản 1 Điều 26 TTLT 09/2025"},{"id":"nq205_150","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 3 Điều 26 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát gửi cho Tòa án quyết định phân công Kiểm sát viên tham gia phiên tòa sơ thẩm vụ án dân sự công ích trong thời hạn nào?","o":["05 ngày kể từ ngày nhận được văn bản thông báo về việc thụ lý vụ án của Tòa án","07 ngày kể từ ngày nhận được thông báo thụ lý","03 ngày làm việc kể từ ngày nhận được thông báo thụ lý","Trước ngày mở phiên tòa ít nhất 01 ngày"],"a":0,"ref":"Khoản 3 Điều 26 TTLT 09/2025"},{"id":"nq205_151","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo Hướng dẫn số 42/HD-VKSTC, tại phiên tòa, khi có căn cứ thay đổi, rút một phần hoặc toàn bộ yêu cầu khởi kiện mà không thể thực hiện được ngay tại phiên tòa thì Kiểm sát viên giải quyết chính làm gì?","o":["Đề nghị Hội đồng xét xử ra quyết định đình chỉ giải quyết vụ án theo Bộ luật Tố tụng dân sự","Đề nghị Hội đồng xét xử tạm ngừng phiên tòa theo điểm c khoản 1 Điều 259 Bộ luật Tố tụng dân sự","Tự ý rời phiên tòa để xin ý kiến lãnh đạo Viện kiểm sát, sau đó quay lại tiếp tục tham gia","Đề nghị Tòa án trả lại quyết định khởi kiện để Viện kiểm sát ban hành quyết định mới"],"a":1,"ref":"Điểm c tiểu mục 5.1 Mục 5 Phần IV.B HD 42/HD-VKSTC"},{"id":"nq205_152","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo Điều 17 Nghị quyết số 205/2025/QH15, ai chủ động ra quyết định thi hành đối với bản án, quyết định đã có hiệu lực pháp luật của Tòa án về vụ án dân sự bảo vệ lợi ích công?","o":["Chủ tịch Ủy ban nhân dân cấp tỉnh","Chánh án Tòa án đã xét xử sơ thẩm","Viện trưởng Viện kiểm sát đã khởi kiện","Thủ trưởng cơ quan thi hành án dân sự"],"a":3,"ref":"Điều 17 NQ 205/2025/QH15; khoản 1 Điều 28 TTLT 09/2025"},{"id":"nq205_153","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo khoản 2 Điều 28 Thông tư liên tịch số 09/2025/TTLT, khi có đề nghị của tổ chức, cá nhân phải thi hành bản án, quyết định về bảo vệ lợi ích công, Viện kiểm sát xử lý thế nào?","o":["Xem xét, thống nhất với tổ chức, cá nhân phải thi hành án về việc thi hành nhưng phải bảo đảm thực hiện đầy đủ nghĩa vụ trong bản án, quyết định","Không được trao đổi, thống nhất với người phải thi hành án dưới bất kỳ hình thức nào sau khi bản án có hiệu lực","Chuyển đề nghị cho Tòa án đã xét xử sơ thẩm để xem xét lại bản án, quyết định theo thủ tục đặc biệt","Được thỏa thuận miễn, giảm một phần nghĩa vụ cho người phải thi hành án nếu họ tự nguyện thi hành phần còn lại"],"a":0,"ref":"Khoản 2 Điều 28 TTLT 09/2025"},{"id":"nq205_154","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo Công văn số 5832/VKSTC-V9 ngày 09/10/2026, trong vụ án dân sự công ích do Viện kiểm sát khởi kiện, cách gọi thống nhất trong văn bản tố tụng, tại phiên tòa và trong bản án là gì?","o":["“Viện kiểm sát - nguyên đơn dân sự”","“Người đại diện lợi ích công”","“Viện kiểm sát - người khởi kiện”","“Nguyên đơn - Viện kiểm sát”"],"a":2,"ref":"Mục 2 CV 5832/VKSTC-V9 ngày 09/10/2026"},{"id":"nq205_155","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo Công văn số 5832/VKSTC-V9 ngày 09/10/2026, biển ghi chức danh của Kiểm sát viên tham gia phiên tòa xét xử vụ án dân sự công ích do Viện kiểm sát khởi kiện được thống nhất ghi là gì?","o":["“Đại diện Viện kiểm sát”","“Người khởi kiện”","“Nguyên đơn”","“Kiểm sát viên - Nguyên đơn”"],"a":0,"ref":"Mục 2 CV 5832/VKSTC-V9 ngày 09/10/2026"},{"id":"nq205_156","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo Công văn số 5832/VKSTC-V9 ngày 09/10/2026, chi phí tố tụng trong việc giải quyết vụ án dân sự công ích do Viện kiểm sát khởi kiện được thực hiện theo quy định nào?","o":["Viện kiểm sát được miễn toàn bộ chi phí tố tụng theo khoản 4 Điều 14 Nghị quyết số 205/2025/QH15","Mục 2 Chương IX Bộ luật Tố tụng dân sự và Pháp lệnh Chi phí tố tụng","Do ngân sách địa phương chi trả toàn bộ","Do bị đơn chịu toàn bộ trong mọi trường hợp"],"a":1,"ref":"Mục 3 CV 5832/VKSTC-V9 ngày 09/10/2026"},{"id":"nq205_157","cat":"nq205","topic":"7. Khởi kiện, thụ lý, phiên tòa, thi hành án","q":"Theo Công văn số 5832/VKSTC-V9 ngày 09/10/2026, sau khi kết thúc phần tranh luận tại phiên tòa xét xử vụ án dân sự công ích do Viện kiểm sát khởi kiện, Kiểm sát viên thực hiện việc gì?","o":["Đọc lại quyết định khởi kiện","Không phát biểu ý kiến vì đã là người khởi kiện","Phát biểu ý kiến về việc tuân theo pháp luật tố tụng và việc giải quyết vụ án","Chỉ phát biểu về việc rút yêu cầu khởi kiện"],"a":2,"ref":"Mục 2 CV 5832/VKSTC-V9 ngày 09/10/2026"},{"id":"nq205_158","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, vụ việc dân sự công ích thuộc trường hợp Viện kiểm sát xem xét khởi kiện phải có đầy đủ các yếu tố nào?","o":["Có đơn đề nghị của người dân bị ảnh hưởng; có kết luận thanh tra của cơ quan có thẩm quyền; có quyết định xử phạt vi phạm hành chính đối với chủ thể vi phạm","Có hành vi vi phạm; có dư luận xã hội quan tâm; có cơ quan báo chí phản ánh; có đề nghị của chính quyền địa phương và của Mặt trận Tổ quốc","Chủ thể, đối tượng được bảo vệ; hành vi vi phạm; chủ thể thực hiện hành vi vi phạm; thiệt hại hoặc nguy cơ thiệt hại trực tiếp, chắc chắn; mối quan hệ nhân quả; đồng thời thuộc trường hợp không có người khởi kiện","Có thiệt hại vật chất lớn; chủ thể vi phạm là cơ quan nhà nước; có kết luận kiểm toán xác định sai phạm và có kiến nghị xử lý của Kiểm toán nhà nước"],"a":2,"ref":"Mục I HD 20/HD-VKSTC"},{"id":"nq205_159","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, đối với vụ việc thuộc cơ chế hành chính, thanh tra, kiểm toán, quản lý thuế, xử phạt vi phạm hành chính, xử lý hình sự hoặc tố tụng hành chính thì Viện kiểm sát xử lý theo hướng nào?","o":["Ưu tiên khởi kiện vụ án dân sự công ích để giải quyết nhanh, không cần kiến nghị cơ quan có thẩm quyền","Ưu tiên kiến nghị, yêu cầu cơ quan có thẩm quyền xử lý theo quy định; chỉ xem xét khởi kiện khi có yêu cầu dân sự độc lập thuộc phạm vi Nghị quyết số 205/2025/QH15","Chuyển toàn bộ hồ sơ cho Tòa án quyết định cơ chế xử lý phù hợp","Không được xem xét khởi kiện trong mọi trường hợp vì đã có cơ chế xử lý khác"],"a":1,"ref":"Mục I HD 20/HD-VKSTC"},{"id":"nq205_160","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, đối với trẻ em, người có khó khăn trong nhận thức, làm chủ hành vi, người mất năng lực hành vi dân sự, Viện kiểm sát xem xét bảo vệ khi nào?","o":["Trong mọi trường hợp quyền dân sự bị xâm phạm, kể cả khi người đại diện theo pháp luật đã khởi kiện bảo vệ đầy đủ","Khi có căn cứ xác định quyền dân sự của họ bị xâm phạm và người đại diện theo pháp luật không có, không thể hoặc không thực hiện đầy đủ việc bảo vệ quyền dân sự của họ","Chỉ khi có đề nghị bằng văn bản của Hội Bảo vệ quyền trẻ em Việt Nam hoặc Hội có chức năng bảo vệ đối tượng đó","Chỉ khi người đại diện theo pháp luật của họ có văn bản đề nghị Viện kiểm sát khởi kiện để bảo vệ quyền dân sự"],"a":1,"ref":"Điểm b tiểu mục 1.1 Mục 1 Phần I HD 20/HD-VKSTC"},{"id":"nq205_161","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, đối với người cao tuổi, người khuyết tật, phụ nữ mang thai hoặc nuôi con dưới 36 tháng tuổi, người dân tộc thiểu số ở vùng đặc biệt khó khăn, Viện kiểm sát chỉ xem xét bảo vệ khi nào?","o":["Khi họ không thể tự mình khởi kiện và có đề nghị Viện kiểm sát khởi kiện (trường hợp không đề nghị do bị lừa dối, đe dọa, cưỡng ép hoặc nhầm lẫn thì Viện kiểm sát xem xét, quyết định)","Khi có đơn đề nghị của bất kỳ người thân thích nào của họ, không phụ thuộc vào ý chí của chính người bị xâm phạm","Trong mọi trường hợp quyền dân sự của họ bị xâm phạm, kể cả khi họ có đủ điều kiện và có thể tự mình khởi kiện","Khi Ủy ban nhân dân cấp xã hoặc Hội có chức năng bảo vệ đối tượng đó nơi người bị xâm phạm cư trú có văn bản đề nghị"],"a":0,"ref":"Điểm c tiểu mục 1.1 Mục 1 Phần I HD 20/HD-VKSTC"},{"id":"nq205_162","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, khó khăn về tài chính, trình độ, ngôn ngữ, đi lại, tiếp cận thông tin hoặc trợ giúp pháp lý của chủ thể thuộc nhóm dễ bị tổn thương được đánh giá như thế nào khi xác định họ “không thể tự mình khởi kiện”?","o":["Chỉ được xem xét khi có giấy xác nhận hoàn cảnh khó khăn của Ủy ban nhân dân cấp xã nơi cư trú","Không được xem xét khi đánh giá khả năng tự khởi kiện của chủ thể thuộc nhóm dễ bị tổn thương","Là căn cứ độc lập, đương nhiên để Viện kiểm sát xác định họ không thể tự mình khởi kiện và quyết định khởi kiện","Chỉ là yếu tố để đánh giá tổng thể, không phải căn cứ độc lập, đương nhiên để Viện kiểm sát khởi kiện"],"a":3,"ref":"Điểm d5 tiểu mục 1.1 Mục 1 Phần I HD 20/HD-VKSTC"},{"id":"nq205_163","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, trường hợp thiệt hại chưa xảy ra nhưng có căn cứ trực tiếp, chắc chắn và tất yếu sẽ xảy ra nếu hành vi vi phạm không được ngăn chặn thì Viện kiểm sát xử lý thế nào đối với vụ việc bảo vệ nhóm dễ bị tổn thương?","o":["Tạm dừng việc thụ lý, chờ thiệt hại thực tế xảy ra rồi mới tiến hành kiểm tra, xác minh và xem xét khởi kiện","Xem xét yêu cầu chấm dứt hành vi vi phạm, áp dụng biện pháp ngăn chặn, khắc phục hậu quả hoặc biện pháp khẩn cấp tạm thời; yêu cầu bồi thường chỉ đặt ra khi có đủ căn cứ xác định thiệt hại","Khởi kiện ngay yêu cầu Tòa án buộc bồi thường theo mức thiệt hại dự kiến do Kiểm sát viên ước tính","Không được xem xét vì Nghị quyết số 205/2025/QH15 chỉ bảo vệ khi thiệt hại thực tế đã xảy ra và tính được bằng tiền"],"a":1,"ref":"Điểm b tiểu mục 1.3 Mục 1 Phần I HD 20/HD-VKSTC"},{"id":"nq205_164","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, trường hợp cơ quan, tổ chức có hành vi vi phạm gây thiệt hại cho lợi ích công đồng thời là cơ quan, tổ chức quản lý, phụ trách ngành, lĩnh vực bị xâm phạm thì Viện kiểm sát xử lý thế nào?","o":["Vẫn kiến nghị chính cơ quan, tổ chức đó khởi kiện theo điểm b khoản 2 Điều 13 Nghị quyết","Đình chỉ việc kiểm tra, xác minh vì không có chủ thể nào có quyền khởi kiện","Khởi kiện ngay vụ án dân sự công ích mà không cần xác minh chủ thể có quyền khởi kiện khác","Không kiến nghị chính cơ quan, tổ chức đó khởi kiện; phải xác minh, rà soát chủ thể khác có quyền, trách nhiệm khởi kiện"],"a":3,"ref":"Điểm b tiểu mục 2.2 Mục 2 Phần I HD 20/HD-VKSTC"},{"id":"nq205_165","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, vụ việc dân sự công ích được xác định là “hoàn thành” khi nào?","o":["Khi yêu cầu, đề nghị, kiến nghị của Viện kiểm sát đã được thực hiện và đạt kết quả trên thực tế, mục tiêu bảo vệ quyền dân sự của nhóm dễ bị tổn thương hoặc lợi ích công đã thực hiện được","Khi Viện kiểm sát nhận được văn bản trả lời của cơ quan được kiến nghị, không phụ thuộc vào nội dung trả lời và kết quả thực hiện","Khi hết thời hạn 02 tháng xem xét, quyết định khởi kiện mà Viện kiểm sát không ban hành quyết định khởi kiện","Khi Viện kiểm sát đã ban hành kiến nghị khởi kiện cho cơ quan quản lý ngành, lĩnh vực và gửi cho cơ quan cấp trên trực tiếp"],"a":0,"ref":"Mục 2 Phần II HD 20/HD-VKSTC"},{"id":"nq205_166","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, trường hợp nào sau đây Viện kiểm sát KHÔNG được xác định vụ việc dân sự công ích là “hoàn thành” dù đã ban hành quyết định đình chỉ?","o":["Đình chỉ do hành vi vi phạm đã chấm dứt, hậu quả đã được khắc phục","Đình chỉ do vụ việc không thuộc phạm vi Nghị quyết số 205/2025/QH15 hoặc không đủ căn cứ khởi kiện","Chấm dứt do lợi ích cần bảo vệ không còn tồn tại theo quy định","Đình chỉ do quyền dân sự của chủ thể đã được bảo vệ trên thực tế"],"a":1,"ref":"Tiểu mục 2.2 Mục 2 Phần II HD 20/HD-VKSTC"},{"id":"nq205_167","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, sau khi vụ việc dân sự công ích kết thúc (do bên vi phạm cam kết khắc phục, cơ quan đồng ý thực hiện kiến nghị…) mà các chủ thể không thực hiện, thực hiện không đúng, không đầy đủ thì Viện kiểm sát xử lý thế nào?","o":["Đề nghị Tòa án ra quyết định cưỡng chế thực hiện cam kết","Không được xem xét lại vì vụ việc đã được xác định là kết thúc","Tiến hành các biện pháp tiếp theo của quy trình xem xét, khởi kiện vụ án dân sự công ích","Chuyển hồ sơ cho cơ quan thi hành án dân sự tổ chức thi hành"],"a":2,"ref":"Tiểu mục 1.3 Mục 1 Phần II HD 20/HD-VKSTC"},{"id":"nq205_168","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, sau khi phát hiện, tiếp nhận thông tin, nếu có đủ căn cứ xác định hành vi cấu thành tội phạm thì Viện kiểm sát xử lý thế nào đối với vấn đề dân sự công ích?","o":["Chỉ xử lý trách nhiệm hình sự, không xem xét vấn đề dân sự công ích","Khởi kiện vụ án dân sự công ích trước, sau đó mới xem xét xử lý trách nhiệm hình sự","Tách toàn bộ vấn đề dân sự để Viện kiểm sát khởi kiện bằng vụ án dân sự riêng ngay lập tức","Xử lý trách nhiệm hình sự theo quy định và ưu tiên giải quyết đồng thời vấn đề dân sự công ích trong vụ án hình sự"],"a":3,"ref":"Tiểu mục 1.1 Mục 1 Phần III HD 20/HD-VKSTC"},{"id":"nq205_169","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, trường hợp qua xác minh ban đầu xác định người vi phạm đã bị xử phạt vi phạm hành chính nhưng không thực hiện hoặc thực hiện không đầy đủ quyết định xử phạt, biện pháp khắc phục hậu quả thì Viện kiểm sát làm gì trước tiên?","o":["Khởi kiện ngay vụ án dân sự công ích yêu cầu Tòa án buộc người vi phạm thi hành quyết định xử phạt và biện pháp khắc phục hậu quả","Kháng nghị quyết định xử phạt vi phạm hành chính theo thủ tục giám đốc thẩm để cơ quan có thẩm quyền xem xét lại","Kiến nghị cơ quan đã xử phạt hoặc cơ quan có thẩm quyền áp dụng biện pháp cưỡng chế hành chính, biện pháp khắc phục hậu quả hoặc biện pháp cần thiết khác theo Luật Xử lý vi phạm hành chính","Đình chỉ việc kiểm tra, xác minh vì vụ việc đã được cơ quan có thẩm quyền xử lý bằng biện pháp hành chính"],"a":2,"ref":"Tiểu mục 1.2 Mục 1 Phần III HD 20/HD-VKSTC"},{"id":"nq205_170","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, Viện kiểm sát có được sử dụng cơ chế khởi kiện vụ án dân sự công ích để yêu cầu Tòa án thi hành thay quyết định hành chính, quyết định xử lý về thuế, kết luận thanh tra, quyết định xử phạt vi phạm hành chính hay không?","o":["Được, nếu cơ quan ban hành quyết định đồng ý","Được, trong mọi trường hợp","Được, nếu quyết định đã quá hạn thi hành","Không được"],"a":3,"ref":"Tiểu mục 1.5 Mục 1 Phần III HD 20/HD-VKSTC"},{"id":"nq205_171","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, đối với trường hợp người dễ bị tổn thương chưa được cấp giấy khai sinh, căn cước, mã định danh cá nhân, thẻ bảo hiểm y tế, Viện kiểm sát xử lý thế nào?","o":["Kiến nghị cơ quan có thẩm quyền thực hiện việc cấp; không khởi kiện vụ án dân sự công ích để buộc cơ quan thực hiện hành vi hành chính này","Trực tiếp cấp giấy xác nhận nhân thân thay thế cho đến khi được cấp giấy tờ","Khởi kiện vụ án dân sự công ích yêu cầu Tòa án buộc cơ quan có thẩm quyền cấp giấy tờ","Khởi kiện vụ án hành chính thay cho người dễ bị tổn thương"],"a":0,"ref":"Tiểu mục 2.1 Mục 2 Phần III HD 20/HD-VKSTC"},{"id":"nq205_172","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, đối với loại việc ô nhiễm môi trường do nhiều chủ thể gây ra, trách nhiệm bồi thường của từng đối tượng được xác định theo nguyên tắc nào?","o":["Chủ thể có quy mô sản xuất lớn nhất chịu toàn bộ trách nhiệm bồi thường, các chủ thể khác chỉ chịu trách nhiệm hành chính","Chia đều trách nhiệm bồi thường cho tất cả các chủ thể đã xác định được, không phụ thuộc loại chất ô nhiễm và lượng phát thải","Theo loại chất ô nhiễm, lượng phát thải và các yếu tố khác, tương ứng với tỷ lệ gây thiệt hại trong tổng thiệt hại về môi trường (khoản 3 Điều 130 Luật Bảo vệ môi trường năm 2020)","Theo thứ tự thời gian bắt đầu hoạt động; chủ thể hoạt động trước chịu trách nhiệm bồi thường chính đối với toàn bộ thiệt hại"],"a":2,"ref":"Tiểu mục 2.3 Mục 2 Phần III HD 20/HD-VKSTC"},{"id":"nq205_173","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, đối với loại việc hủy hoại rừng chưa xác định được chủ thể trực tiếp thực hiện hành vi vi phạm, Viện kiểm sát xác định chủ thể nào là chủ thể có hành vi vi phạm?","o":["Cơ quan kiểm lâm sở tại, vì có trách nhiệm kiểm tra, phát hiện và xử lý vi phạm pháp luật về lâm nghiệp trên địa bàn","Ủy ban nhân dân cấp xã nơi có rừng trong mọi trường hợp, không phụ thuộc vào việc rừng đã được Nhà nước giao, cho thuê cho chủ thể nào","Chủ rừng được Nhà nước giao rừng, cho thuê rừng mà không tổ chức thực hiện hoặc thực hiện không đầy đủ các hoạt động quản lý, bảo vệ rừng để xảy ra khai thác rừng trái pháp luật","Người dân sinh sống gần khu rừng bị hủy hoại, theo nguyên tắc suy đoán trách nhiệm của người có điều kiện tiếp cận rừng"],"a":2,"ref":"Tiểu mục 2.4 Mục 2 Phần III HD 20/HD-VKSTC"},{"id":"nq205_174","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC và Công văn số 5832/VKSTC-V9, khoản tiền bảo hiểm xã hội chậm đóng, trốn đóng đã được xác định theo quy định của pháp luật thuộc lĩnh vực lợi ích công nào theo khoản 2 Điều 3 Nghị quyết số 205/2025/QH15?","o":["“Đầu tư công” (điểm a khoản 2 Điều 3)","“Tài sản công khác” (điểm b khoản 2 Điều 3)","Không thuộc lĩnh vực lợi ích công","“Bảo vệ quyền lợi người tiêu dùng” (điểm e khoản 2 Điều 3)"],"a":1,"ref":"Tiểu mục 2.5 Mục 2 Phần III HD 20/HD-VKSTC; tiểu mục 1.1 Mục 1 CV 5832/VKSTC-V9"},{"id":"nq205_175","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, đối với vụ việc người sử dụng lao động chậm đóng, trốn đóng bảo hiểm xã hội xâm phạm quyền, lợi ích của người lao động, khi kiến nghị khởi kiện Viện kiểm sát kiến nghị chủ thể nào?","o":["Kiến nghị Tòa án nơi doanh nghiệp có trụ sở","Chỉ kiến nghị Ủy ban nhân dân cấp xã","Tổ chức công đoàn và cơ quan bảo hiểm xã hội","Chỉ kiến nghị cơ quan thuế"],"a":2,"ref":"Tiểu mục 2.5 Mục 2 Phần III HD 20/HD-VKSTC"},{"id":"nq205_176","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, trường hợp doanh nghiệp nợ tiền bảo hiểm xã hội đang thực hiện thủ tục giải thể hoặc phá sản thì Viện kiểm sát xử lý thế nào?","o":["Không thụ lý vụ việc (nếu chưa thụ lý) hoặc tạm dừng việc kiểm tra, xác minh (nếu đã thụ lý) để chờ kết quả giải quyết; đồng thời kiến nghị công đoàn, cơ quan bảo hiểm xã hội theo dõi, bảo vệ quyền lợi người lao động","Khởi kiện ngay vụ án dân sự công ích để khoản nợ bảo hiểm xã hội được ưu tiên thanh toán trước các chủ nợ khác trong quá trình giải thể, phá sản","Đình chỉ việc kiểm tra, xác minh vì doanh nghiệp không còn tồn tại và không có cơ quan, tổ chức, cá nhân nào kế thừa quyền, nghĩa vụ","Yêu cầu Tòa án đình chỉ thủ tục phá sản để giải quyết vụ án dân sự công ích về nợ bảo hiểm xã hội trước, sau đó mới tiếp tục phá sản"],"a":0,"ref":"Tiểu mục 2.5 Mục 2 Phần III HD 20/HD-VKSTC"},{"id":"nq205_177","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, đối với loại việc lấn chiếm, sử dụng trái phép đất công, việc Viện kiểm sát lấy ý kiến cơ quan nhà nước có thẩm quyền quản lý nhà, đất công trước khi kiến nghị khởi kiện được hiểu như thế nào?","o":["Không được coi là điều kiện bắt buộc làm cản trở việc áp dụng ngay biện pháp ngăn chặn, bảo toàn tài sản hoặc biện pháp khẩn cấp tạm thời khi có căn cứ","Chỉ lấy ý kiến khi Tòa án yêu cầu trong quá trình giải quyết vụ án","Viện kiểm sát không được lấy ý kiến cơ quan quản lý để bảo đảm tính độc lập","Là điều kiện bắt buộc phải hoàn thành trước khi áp dụng bất kỳ biện pháp ngăn chặn hay biện pháp khẩn cấp tạm thời nào"],"a":0,"ref":"Điểm đ tiểu mục 2.7 Mục 2 Phần III HD 20/HD-VKSTC"},{"id":"nq205_178","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, đối với hành vi ghi giá giao dịch trong hợp đồng thấp hơn giá thực tế nhằm giảm nghĩa vụ thuế, phí, lệ phí, Viện kiểm sát có khởi kiện vụ án dân sự công ích chỉ để yêu cầu Tòa án buộc người nộp thuế nộp thuế thay cơ quan thuế hay không?","o":["Không; Viện kiểm sát kiến nghị cơ quan thuế, cơ quan có thẩm quyền áp dụng biện pháp quản lý, truy thu, xử phạt, cưỡng chế hoặc chuyển xử lý hình sự","Có, nếu cơ quan thuế đồng ý ủy quyền cho Viện kiểm sát khởi kiện thay","Có, đây là yêu cầu khởi kiện chủ yếu nhằm thu đủ số thuế, phí, lệ phí bị thất thu cho ngân sách","Có, nếu số tiền thuế thất thu lớn và cơ quan thuế chưa ban hành quyết định truy thu"],"a":0,"ref":"Tiểu mục 2.2 Mục 2 Phần III HD 20/HD-VKSTC"},{"id":"nq205_179","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, đối với vi phạm an toàn thực phẩm, dược phẩm, hợp đồng mẫu xâm phạm quyền lợi người tiêu dùng, Viện kiểm sát có khởi kiện thay từng tranh chấp tiêu dùng nhỏ lẻ không?","o":["Có, nếu giá trị hàng hóa, dịch vụ nhỏ và người tiêu dùng không muốn tự mình khởi kiện ra Tòa án","Có; Viện kiểm sát khởi kiện thay đối với mọi tranh chấp tiêu dùng phát sinh trên địa bàn để bảo vệ quyền lợi người tiêu dùng","Không; chỉ xem xét khởi kiện khi hành vi có tính hệ thống, ảnh hưởng đến nhiều người tiêu dùng và chủ thể có quyền khởi kiện không thực hiện sau khi được thông báo, kiến nghị","Có, nếu người tiêu dùng có đơn đề nghị và cung cấp được hóa đơn, chứng từ mua hàng hóa, dịch vụ"],"a":2,"ref":"Điểm d tiểu mục 2.20 Mục 2 Phần III HD 20/HD-VKSTC"},{"id":"nq205_180","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, đối với loại việc không thực hiện kết luận thanh tra, kết luận, kiến nghị của Kiểm toán nhà nước, trước khi khởi kiện Viện kiểm sát phải làm gì?","o":["Khởi kiện ngay vụ án dân sự công ích mà không cần thông báo, kiến nghị vì nghĩa vụ đã được xác định trong kết luận thanh tra","Thông báo, kiến nghị cơ quan thanh tra, Kiểm toán nhà nước, cơ quan tài chính, cơ quan quản lý tài sản công, Ủy ban nhân dân có thẩm quyền hoặc chủ thể khác có quyền, trách nhiệm khởi kiện, thu hồi, xử lý","Kháng nghị kết luận thanh tra, kiến nghị của Kiểm toán nhà nước theo thủ tục tố tụng dân sự để Tòa án xem xét","Đề nghị Quốc hội, Hội đồng nhân dân giám sát việc thực hiện kết luận thanh tra, kiến nghị kiểm toán trước khi xem xét khởi kiện"],"a":1,"ref":"Điểm e tiểu mục 2.11 Mục 2 Phần III HD 20/HD-VKSTC"},{"id":"nq205_181","cat":"nq205","topic":"8. Nhận diện vụ việc, kết thúc/hoàn thành, loại việc cụ thể","q":"Theo Hướng dẫn số 20/HD-VKSTC, trường hợp Viện kiểm sát đã thụ lý vụ việc lấn chiếm đất công mà người vi phạm khởi kiện vụ án hành chính đối với quyết định hành chính về nhà, đất đó, nếu các vấn đề của vụ án dân sự công ích đã được Tòa án giải quyết trong vụ án hành chính thì Viện kiểm sát xử lý thế nào?","o":["Tạm dừng kiểm tra, xác minh vô thời hạn","Kháng nghị bản án hành chính","Đình chỉ việc kiểm tra, xác minh","Tiếp tục khởi kiện vụ án dân sự công ích"],"a":2,"ref":"Điểm g tiểu mục 2.7 Mục 2 Phần III HD 20/HD-VKSTC"},{"id":"nq205_182","cat":"nq205","topic":"9. Phối hợp và chỉ đạo của Ngành","q":"Quy chế phối hợp số 01/2025/QCPH về thực hiện thí điểm khởi kiện vụ án dân sự công ích được ký kết giữa Viện kiểm sát nhân dân tối cao và bao nhiêu Hội?","o":["06 Hội","07 Hội","08 Hội","05 Hội"],"a":1,"ref":"Phần đầu Quy chế phối hợp số 01/2025/QCPH ngày 03/11/2025"},{"id":"nq205_183","cat":"nq205","topic":"9. Phối hợp và chỉ đạo của Ngành","q":"Hội nào sau đây KHÔNG phải là bên ký kết Quy chế phối hợp số 01/2025/QCPH với Viện kiểm sát nhân dân tối cao?","o":["Hội Bảo trợ người khuyết tật và trẻ mồ côi Việt Nam","Hội Bảo vệ người tiêu dùng Việt Nam","Hội Bảo vệ Thiên nhiên và Môi trường Việt Nam","Hội Luật gia Việt Nam"],"a":3,"ref":"Phần đầu Quy chế phối hợp số 01/2025/QCPH ngày 03/11/2025"},{"id":"nq205_184","cat":"nq205","topic":"9. Phối hợp và chỉ đạo của Ngành","q":"Theo khoản 4 Điều 4 Quy chế phối hợp số 01/2025/QCPH, trong một vụ việc có nhiều Hội tham gia phối hợp thì ai giữ vai trò chủ trì, điều phối?","o":["Hội tiếp nhận thông tin đầu tiên","Hội Liên hiệp Phụ nữ Việt Nam","Viện kiểm sát","Hội có số hội viên đông nhất"],"a":2,"ref":"Khoản 4 Điều 4 QCPH 01/2025"},{"id":"nq205_185","cat":"nq205","topic":"9. Phối hợp và chỉ đạo của Ngành","q":"Theo khoản 3 Điều 16 Quy chế phối hợp số 01/2025/QCPH, trong vụ án dân sự công ích do Viện kiểm sát khởi kiện, Hội được Tòa án triệu tập hoặc mời đến phiên tòa phải thông báo cho Viện kiểm sát về người tham dự trước ngày mở phiên tòa ít nhất bao lâu?","o":["01 ngày","05 ngày","07 ngày","03 ngày"],"a":0,"ref":"Khoản 3 Điều 16 QCPH 01/2025"},{"id":"nq205_186","cat":"nq205","topic":"9. Phối hợp và chỉ đạo của Ngành","q":"Theo Điều 13 Quy chế phối hợp số 01/2025/QCPH, Hội nhận được văn bản thông báo khởi kiện do Viện kiểm sát gửi có trách nhiệm gì?","o":["Gặp gỡ, làm việc, trao đổi, động viên, hướng dẫn chủ thể thuộc nhóm dễ bị tổn thương hoặc người đại diện hợp pháp của họ khởi kiện","Khởi kiện thay cho chủ thể thuộc nhóm dễ bị tổn thương với tư cách nguyên đơn trong vụ án dân sự","Trả lời Viện kiểm sát trong thời hạn 15 ngày về việc Hội có khởi kiện thay chủ thể đó hay không","Đề nghị Viện kiểm sát đình chỉ việc kiểm tra, xác minh để Hội tự hòa giải với bên vi phạm"],"a":0,"ref":"Khoản 2 Điều 13 QCPH 01/2025"},{"id":"nq205_187","cat":"nq205","topic":"9. Phối hợp và chỉ đạo của Ngành","q":"Theo Quy chế phối hợp tạm thời ban hành kèm Quyết định số 327/QĐ-VKSTC, Quy chế có hiệu lực và thời gian thực hiện như thế nào?","o":["Có hiệu lực từ ngày 01/01/2026 và được thực hiện trong thời hạn 03 năm tại 06 tỉnh, thành phố thí điểm","Có hiệu lực sau 45 ngày kể từ ngày ký và được thực hiện cho đến khi có quy chế chính thức thay thế","Có hiệu lực kể từ ngày ký và được thực hiện trong thời gian Nghị quyết số 205/2025/QH15 có hiệu lực","Có hiệu lực kể từ ngày ký và được thực hiện đến hết ngày 31/12/2026"],"a":2,"ref":"Khoản 1 Điều 22 Quy chế ban hành kèm QĐ 327/QĐ-VKSTC; Điều 2 QĐ 327"},{"id":"nq205_188","cat":"nq205","topic":"9. Phối hợp và chỉ đạo của Ngành","q":"Theo khoản 4 Điều 4 Quy chế phối hợp tạm thời ban hành kèm Quyết định số 327/QĐ-VKSTC, việc phối hợp giữa các đơn vị trong ngành Kiểm sát có tác động thế nào đến thẩm quyền tố tụng?","o":["Thay thế quyết định phân công Kiểm sát viên của Viện trưởng khi có văn bản phối hợp","Làm phát sinh thẩm quyền tố tụng cho đơn vị, cá nhân tham gia phối hợp trong phạm vi được giao","Không thay thế quyết định phân công của Viện trưởng và không làm phát sinh thẩm quyền tố tụng cho đơn vị, người chưa được phân công","Cho phép Thủ trưởng đơn vị phối hợp ký văn bản tố tụng thay Viện trưởng"],"a":2,"ref":"Khoản 4 Điều 4 Quy chế ban hành kèm QĐ 327/QĐ-VKSTC"},{"id":"nq205_189","cat":"nq205","topic":"9. Phối hợp và chỉ đạo của Ngành","q":"Theo khoản 5 Điều 9 Quy chế phối hợp tạm thời ban hành kèm Quyết định số 327/QĐ-VKSTC, việc lấy ý kiến chuyên môn của đơn vị nghiệp vụ trong Ngành có thay thế giám định, định giá tài sản không?","o":["Không thay thế giám định, định giá tài sản hoặc biện pháp thu thập chứng cứ khác mà pháp luật quy định phải thực hiện theo trình tự, thủ tục riêng","Có thể thay thế giám định nếu đơn vị được lấy ý kiến có chuyên môn phù hợp với vấn đề cần làm rõ","Thay thế định giá tài sản khi tài sản có /* ================= TIỆN ÍCH ================= */
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\s+/g,' ').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hash=s=>{let h=5381;for(const c of String(s))h=((h<<5)+h+c.charCodeAt(0))|0;return 'h'+(h>>>0).toString(36)};
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
 set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){uiAlert('⚠ Không lưu được vào trình duyệt (bộ nhớ đầy hoặc bị chặn). Hãy mở file bằng Chrome/Edge trên máy.');return false}}};
const fmtT=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')};
const vnum=(x,d=2)=>(+x).toLocaleString('vi-VN',{maximumFractionDigits:d});
/* hộp thoại tự dựng (không dùng alert/confirm của trình duyệt) */
function modal(html,btns){return new Promise(res=>{
 const d=document.createElement('div');d.className='mback';
 d.innerHTML=`<div class="mbox enter">${html}<div class="mbtns">${btns.map((b,i)=>`<button class="btn ${b.c||''}" data-i="${i}">${b.t}</button>`).join('')}</div></div>`;
 document.body.appendChild(d);const inp=d.querySelector('input');
 const done=v=>{d.remove();res(v)};
 d.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const v=btns[+b.dataset.i].v;done(v==='@'?inp.value:v)};
 if(inp){setTimeout(()=>inp.focus(),60);inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value);if(e.key==='Escape')done(null)}}
 else setTimeout(()=>{const b=d.querySelector('.mbtns .btn:last-child');b&&b.focus()},60);
})}
const uiAlert=m=>modal(`<div class="mmsg">${m}</div>`,[{t:'Đóng',v:true,c:'gold'}]);
const uiConfirm=(m,ok='Đồng ý',cl='Hủy')=>modal(`<div class="mmsg">${m}</div>`,[{t:cl,v:false,c:'ghost'},{t:ok,v:true,c:'gold'}]);
const uiPrompt=(m,type='text',val='')=>modal(`<div class="mmsg">${m}</div><input class="inp" type="${type}" value="${esc(val)}">`,[{t:'Hủy',v:null,c:'ghost'},{t:'Đồng ý',v:'@',c:'gold'}]);

/* ================= ÂM THANH (tự tổng hợp) ================= */
const AU={ctx:null,vol:LS.get('dt_vol',.5),muted:LS.get('dt_mute',false),want:null,track:null,tg:null,step:0,next:0};
function auInit(){
 if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
 try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 const c=AU.ctx;AU.master=c.createGain();AU.master.gain.value=AU.muted?0:AU.vol;AU.master.connect(c.destination);
 AU.mus=c.createGain();AU.mus.gain.value=.5;AU.mus.connect(AU.master);AU.sfx=c.createGain();AU.sfx.gain.value=.9;AU.sfx.connect(AU.master);
 AU.dl=c.createDelay();AU.dl.delayTime.value=.36;const fb=c.createGain();fb.gain.value=.33;const wet=c.createGain();wet.gain.value=.4;AU.dl.connect(fb);fb.connect(AU.dl);AU.dl.connect(wet);wet.connect(AU.mus);
 const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;
 setInterval(auTick,25);const w=AU.want;AU.track='__';music(w);
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(dest,m,t,dur,o={}){const c=AU.ctx,{type='sine',vol=.1,att=.01,rel=.15,cut=0,send=0}=o;const osc=c.createOscillator(),g=c.createGain();osc.type=type;osc.frequency.setValueAtTime(mf(m),t);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.setValueAtTime(vol,t+Math.max(att,dur-rel));g.gain.linearRampToValueAtTime(0,t+dur);
 let n=osc;if(cut){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;osc.connect(f);n=f}n.connect(g);g.connect(dest);

/* ================= KẾT NỐI MÁY CHỦ (chế độ trực tuyến – tùy chọn) =================
   Có file config.js khai báo DT_CONFIG.api (URL ứng dụng web Google Apps Script) thì:
   - người thi tải bộ cuộc thi/câu hỏi đã công bố từ máy chủ và gửi kết quả về Google Sheet;
   - người thiết lập đăng nhập bằng khóa quản trị, sửa xong bấm “Công bố”.

const CFG=Object.assign({api:'',sheet:''},window.DT_CONFIG||{});
const API=/^https?:\/\/\S+$/.test(String(CFG.api||'').trim())?String(CFG.api).trim():'';

async function apiGet(ms=15000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
 try{const r=await fetch(API+(API.includes('?')?'&':'?')+'action=config&_='+Date.now(),{signal:c.signal});return await r.json()}finally{clearTimeout(t)}}
async function apiPost(body,ms=20000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
 try{const r=await fetch(API,{method:'POST',body:JSON.stringify(body),signal:c.signal});return await r.json()}finally{clearTimeout(t)}}
const PUBK=['unit','pass','showAns','shuffle','music','game'];

 if(Array.isArray(d.cats)&&d.cats.length)DB.cats=d.cats;if(Array.isArray(d.exams))DB.exams=d.exams;if(Array.isArray(d.bank))DB.bank=d.bank;

 ['cats','exams','bank','set'].forEach(k=>LS.set('dt_'+k,DB[k]));LS.set('dt_pubver',ver);LS.set('dt_dirty',false);NET.ver=ver;NET.dirty=false}

  if(j.ver&&j.data&&!NET.dirty&&(j.ver!==NET.ver||!LS.get('dt_bank',null)))applyPub(j.data,j.ver);return}}catch(e){}}

 if(!API||NET.busy)return;const q=outbox();if(!q.length)return;NET.busy=true;const left=[];
 try{for(const r of q){try{const j=await apiPost({action:'submit',r});if(!(j&&j.ok))left.push(r)}catch(e){left.push(r)}}}finally{NET.busy=false}
 const added=outbox().filter(r=>!q.some(x=>x.id===r.id));LS.set('dt_outbox',[...left,...added].slice(-300))}

 el.className='sync '+(NET.busy?'':n?'bad':'ok');
 el.innerHTML=NET.busy?'⏳ Đang gửi kết quả về máy chủ…':n?`⚠ Chưa gửi được kết quả về máy chủ (kiểm tra kết nối mạng). Kết quả đã lưu trên máy này và sẽ tự gửi lại khi có mạng. <button class="btn ghost sm" onclick="resend()">↻ Gửi lại ngay</button>`:'☁ Đã gửi kết quả về máy chủ.'}

 return `<div class="netst ${NET.ok===false?'off':''}" id="netst">${NET.ok===false?'⚠ Chưa kết nối được máy chủ – đang dùng dữ liệu đã lưu trên máy này':'🌐 Đang kết nối máy chủ thi trực tuyến'}${n?` · <span class="err-t">còn ${n} kết quả chưa gửi</span> <button class="btn ghost sm" onclick="resend()">↻ Gửi lại</button>`:''}</div>`}

 ${NET.srv&&NET.ver&&NET.srv!==NET.ver?`<div class="err-t">⚠ Máy chủ có bản khác bản máy này đang dùng (${f(NET.ver)}) – có thể đã công bố từ máy khác.</div>`:''}

async function publish(){
 if(!await uiConfirm(`Công bố bộ thiết lập hiện tại lên máy chủ?<br>• ${DB.exams.filter(e=>e.on).length} cuộc thi đang mở · ${DB.bank.length} câu hỏi · ${DB.cats.length} lĩnh vực<br>• Người thi mở (hoặc tải lại) trang sẽ nhận bản mới; bài đang làm dở không bị ảnh hưởng.`,'📡 Công bố','Hủy'))return;
 const done=busy('Đang công bố lên máy chủ…');let j;
 try{j=await apiPost({action:'publish',key:NET.key,data:{cats:DB.cats,exams:DB.exams,bank:DB.bank,set:pubSet()}},90000)}catch(e){j={ok:false,err:'Không kết nối được máy chủ.'}}finally{done()}

 LS.set('dt_pubver',j.ver);LS.set('dt_dirty',false);NET.ver=NET.srv=j.ver;NET.dirty=false;NET.ok=true;
 await uiAlert(`✔ Đã công bố lên máy chủ: ${j.q} câu hỏi.`);admin(ATAB)}
async function pull(){

 NET.ok=true;NET.srv=j.ver||0;if(!j.ver||!j.data){uiAlert('Máy chủ chưa có bản công bố nào.');admin(ATAB);return}

let EX=null,EXT=null;
async function exStart(){
 const p=me();if(!p)return;const e=DB.exams.find(x=>x.id===SEL);if(!e)return;
 const pool=poolFor(e),n=Math.min(e.n,pool.length);if(!n)return;
 const ok=await uiConfirm(`<div class="h2" style="font-size:20px">📋 ${esc(e.name)}</div>
 <b>Người thi:</b> ${esc(p.name)}${p.unit?' – '+esc(p.unit):''}<br><b>Số câu:</b> ${n} câu trắc nghiệm (mỗi câu 1 đáp án đúng)<br><b>Thời gian:</b> ${e.min} phút<br><br>
 • Có thể chọn câu bất kỳ trong danh sách để làm trước, đổi đáp án, đánh dấu ⚑ để xem lại.<br>• Trước khi nộp bài có màn hình kiểm tra lại.<br>• Hết giờ hệ thống tự động nộp bài.`,'▶ Bắt đầu','Để sau');
 if(!ok)return;
 const qs=shuf(pool).slice(0,n).map(q=>{const idx=DB.set.shuffle?shuf(q.o.map((_,i)=>i)):q.o.map((_,i)=>i);return{id:q.id,q:q.q,ref:q.ref||'',cat:q.cat,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}});
 const now=Date.now();
 EX={exam:{id:e.id,name:e.name,min:e.min},name:p.name,unit:p.unit,qs,ans:qs.map(()=>-1),fl:qs.map(()=>false),cur:0,start:now,end:now+e.min*60000,done:false,warned:false};
 exSave();BG.ts=.6;music(DB.set.music?'calm':null);exRender();
}
function exSave(){if(EX)LS.set('dt_cur',EX)}
function exResume(){EX=LS.get('dt_cur',null);if(!EX)return home();if(Date.now()>=EX.end){exSubmit(true);return}BG.ts=.6;music(DB.set.music?'calm':null);exRender()}
async function exDiscard(){if(await uiConfirm('Hủy bài thi đang làm dở? Kết quả sẽ không được ghi nhận.','Hủy bài','Không')){localStorage.removeItem('dt_cur');home()}}
function exTimer(){
 clearInterval(EXT);
 EXT=setInterval(()=>{if(!EX||EX.done){clearInterval(EXT);return}
  const left=(EX.end-Date.now())/1000,c=$('#clk');
  if(c){c.textContent=fmtT(left);c.classList.toggle('warn',left<=300)}
  if(left<=300&&!EX.warned){EX.warned=true;exSave();sfx('bell');uiAlert('⏰ Còn <b>5 phút</b> làm bài. Hãy kiểm tra lại các câu chưa trả lời.')}
  if(left<=0){clearInterval(EXT);exSubmit(true)}},500);
}
function exRender(){
 stopT();
 app.innerHTML=`<div class="exam">
 <section><div class="ex-head"><span class="badge">📋 ${esc(EX.exam.name)}</span><span class="badge">👤 ${esc(EX.name)}</span></div>
  <div id="qbox"></div>
  <div class="ex-nav"><button class="btn ghost" onclick="exGo(EX.cur-1)">◀ Câu trước</button><button class="btn orange" id="bfl" onclick="exFlag()">⚑ Đánh dấu xem lại</button><button class="btn blue" onclick="exGo(EX.cur+1)">Câu sau ▶</button></div>
  <div class="note" style="margin-top:8px">Phím tắt: 1–4 hoặc A–D chọn đáp án · ← → chuyển câu · F đánh dấu</div>
 </section>
 <aside class="panel ex-side">
  <div class="note center">⏱ THỜI GIAN CÒN LẠI</div><div class="clock" id="clk">${fmtT((EX.end-Date.now())/1000)}</div>
  <div class="prog"><i id="pgb"></i></div><div class="note center" id="cnt"></div>
  <div class="ngrid" id="ng"></div>
  <div class="legend"><span style="--c:#16a34a">Đã trả lời</span><span style="--c:rgba(255,255,255,.25)">Chưa trả lời</span><span style="--c:#f59e0b">Đánh dấu</span></div>
  <button class="btn gold big" style="margin-top:14px" onclick="exReview()">📤 NỘP BÀI</button>
 </aside></div>`;
 scrollTo({top:0});exQ();exGrid();exTimer();
 document.onkeydown=e=>{if(document.querySelector('.mback')||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const k='1234'.indexOf(e.key)>=0?'1234'.indexOf(e.key):'abcd'.indexOf(e.key.toLowerCase());
  if(k>=0&&k<EX.qs[EX.cur].o.length)exPick(k);else if(e.key==='ArrowRight')exGo(EX.cur+1);else if(e.key==='ArrowLeft')exGo(EX.cur-1);else if(e.key.toLowerCase()==='f')exFlag()};
}
function exQ(){
 const i=EX.cur,q=EX.qs[i];
 $('#qbox').innerHTML=`<div class="qpaper" key="${i}"><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="badge" style="background:#e0e3ff;color:#3730a3;border:0">Câu ${i+1} / ${EX.qs.length}</span>${EX.fl[i]?'<span class="badge fl" style="color:#92400e">⚑ Đã đánh dấu</span>':''}</div>
 <div class="qt">${esc(q.q)}</div>${q.o.map((o,k)=>`<button class="exo ${EX.ans[i]===k?'sel':''}" onclick="exPick(${k})"><span class="L">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
 $('#bfl').textContent=EX.fl[i]?'⚑ Bỏ đánh dấu':'⚑ Đánh dấu xem lại';
}
function exGrid(){
 const n=EX.qs.length,d=EX.ans.filter(a=>a>=0).length;
 $('#ng').innerHTML=EX.qs.map((_,i)=>`<button class="nb ${EX.ans[i]>=0?'done':''} ${i===EX.cur?'cur':''} ${EX.fl[i]?'fl':''}" onclick="exGo(${i})" title="Câu ${i+1}">${i+1}</button>`).join('');
 $('#cnt').innerHTML=`Đã trả lời <b>${d}/${n}</b>${EX.fl.some(x=>x)?` · Đánh dấu <b>${EX.fl.filter(x=>x).length}</b>`:''}`;$('#pgb').style.width=(d/n*100)+'%';
}
function exPick(k){EX.ans[EX.cur]=k;exSave();sfx('click');exQ();exGrid()}
function exGo(i){if(i<0||i>=EX.qs.length)return;EX.cur=i;exSave();exQ();exGrid();if(innerWidth<860)$('#qbox').scrollIntoView({behavior:'smooth'})}
function exFlag(){EX.fl[EX.cur]=!EX.fl[EX.cur];exSave();exQ();exGrid()}
function exReview(){
 stopT();const n=EX.qs.length,un=EX.ans.filter(a=>a<0).length;
 app.innerHTML=`<div class="enter"><div class="title3d sm">🔎 KIỂM TRA TRƯỚC KHI NỘP</div>
 <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
  <div class="chips" style="justify-content:flex-start"><span class="chip">✅ Đã trả lời ${n-un}/${n}</span>${un?`<span class="chip" style="color:#fca5a5">⚠ Chưa trả lời ${un}</span>`:''}${EX.fl.some(x=>x)?`<span class="chip" style="color:#fde68a">⚑ Đánh dấu ${EX.fl.filter(x=>x).length}</span>`:''}</div>
  <div class="center"><div class="note">Thời gian còn lại</div><div class="clock" id="clk" style="font-size:32px">${fmtT((EX.end-Date.now())/1000)}</div></div></div>
  <div class="note">Bấm vào từng câu để quay lại sửa đáp án.</div>
  ${EX.qs.map((q,i)=>`<div class="rv" onclick="EX.cur=${i};exRender()"><b>Câu ${i+1}${EX.fl[i]?' ⚑':''}</b><span style="font-size:14px">${esc(q.q.length>150?q.q.slice(0,150)+'…':q.q)}</span><span class="s ${EX.ans[i]<0?'err-t':'ok-t'}">${EX.ans[i]<0?'Chưa trả lời':'Đã chọn: '+'ABCD'[EX.ans[i]]}</span></div>`).join('')}
  <div class="center" style="margin-top:14px"><button class="btn ghost" onclick="exRender()">← Quay lại làm bài</button><button class="btn gold" onclick="exConfirm()">📤 NỘP BÀI</button></div></div></div>`;
 scrollTo({top:0});exTimer();
}
async function exConfirm(){
 const un=EX.ans.filter(a=>a<0).length;
 const ok=await uiConfirm(un?`⚠ Còn <b>${un} câu chưa trả lời</b>.<br>Bạn chắc chắn muốn nộp bài?`:'Xác nhận <b>nộp bài</b>? Sau khi nộp sẽ không sửa được đáp án.','📤 Nộp bài','Làm tiếp');
 if(ok&&EX&&!EX.done)exSubmit(false);
}
function exSubmit(auto){
 clearInterval(EXT);if(!EX||EX.done)return;EX.done=true;localStorage.removeItem('dt_cur');
 const n=EX.qs.length,ok=EX.qs.filter((q,i)=>EX.ans[i]===q.a).length,score=Math.round(ok/n*1000)/100,dur=Math.min(EX.exam.min*60,(Date.now()-EX.start)/1000),pass=score>=DB.set.pass;
 const rec={id:uid(),t:new Date().toISOString(),name:EX.name,unit:EX.unit,exam:EX.exam.name,ok,n,score,dur:Math.round(dur),auto:!!auto,pass};
 const res=LS.get('dt_results',[]);res.unshift(rec);LS.set('dt_results',res.slice(0,3000));
 if(API){const q=outbox();q.push(rec);LS.set('dt_outbox',q.slice(-300))}
 exResult({ok,n,score,dur,pass,auto});
 if(API){const p=flush();syncUI();p.then(syncUI)}
}
function exResult(r){
 stopT();music(null);BG.ts=2;
 const pct=r.ok/r.n,tier=pct>=.9?'top':pct>=.7?'good':pct>=.5?'mid':'low',icon={top:'🏆',good:'🥇',mid:'🥈',low:'🎯'}[tier];
 app.innerHTML=`<div class="enter center">
 <div class="trophy">${icon}</div>
 <div class="title3d" style="font-size:clamp(24px,4.6vw,44px)">${r.pass?'CHÚC MỪNG':'HOÀN THÀNH BÀI THI'}<br>${esc(EX.name.toUpperCase())}!</div>
 <div class="sub">${esc(EX.exam.name)}${EX.unit?' · '+esc(EX.unit):''}</div>
 <div class="score" id="fs">0</div>
 <div><span class="pass ${r.pass?'y':'n'}">${r.pass?'✔ ĐẠT':'CHƯA ĐẠT'}</span></div>
 <div class="chips" style="margin-top:12px"><span class="chip">✅ Đúng ${r.ok}/${r.n} câu</span><span class="chip">⏱ ${fmtT(r.dur)}</span>${r.auto?'<span class="chip" style="color:#fca5a5">Hết giờ – tự động nộp</span>':''}</div>
 ${API?'<div class="sync noprint" id="sync"></div>':''}
 <div class="quote">💬 ${esc(pick(QUOTES[tier]))}</div>
 <div class="noprint"><button class="btn gold" onclick="home()">🏠 Về trang đầu</button><button class="btn blue" onclick="print()">🖨 In kết quả</button></div>
 ${DB.set.showAns?`<div class="panel" style="text-align:left"><div class="h3">📖 Đáp án chi tiết</div>${EX.qs.map((q,i)=>{const a=EX.ans[i];return`<div class="qpaper" style="margin:14px 0;animation:none"><b>Câu ${i+1}.</b> ${a===q.a?'<span class="ok-t" style="color:#16a34a">✔ Đúng</span>':a<0?'<span style="color:#b45309">Chưa trả lời</span>':'<span style="color:#dc2626">✘ Sai</span>'}<div class="qt" style="font-size:17px;margin:6px 0 8px">${esc(q.q)}</div>${q.o.map((o,k)=>`<div class="exo ${k===q.a?'right':k===a?'wrong':''}" style="cursor:default;font-size:15px"><span class="L">${'ABCD'[k]}</span><span>${esc(o)}</span></div>`).join('')}${q.ref?`<div class="ref">📘 Căn cứ: ${esc(q.ref)}</div>`:''}</div>`}).join('')}</div>`:''}
 </div>`;scrollTo({top:0});
 sfx('win');confetti(r.pass?220:90);if(r.pass)setTimeout(()=>confetti(160),900);setTimeout(()=>{if($('#fs'))music('calm')},3500);
 const el=$('#fs'),t0=performance.now();(function cnt(now){const p=Math.min(1,(now-t0)/1600);el.textContent=vnum(r.score*(1-Math.pow(1-p,3)))+' điểm';if(p<1)requestAnimationFrame(cnt);else el.textContent=vnum(r.score)+' điểm'})(t0);
}

/* ================= LUYỆN TẬP DẠNG TRÒ CHƠI ================= */
let S={};
async function gameStart(){
 const p=me();if(!p)return;const e=DB.exams.find(x=>x.id===SEL);if(!e)return;const pool=poolFor(e);if(pool.length<2)return;
 const n=Math.min(e.n,pool.length,20);
 S={name:p.name,n,T:20,score:0,streak:0,maxStreak:0,ok:0,qi:0,step:0,dbl:false,pu:{f:1,x:1,t:1},wrong:[],pool,
  qs:shuf(pool).slice(0,n).map(q=>{const idx=shuf(q.o.map((_,i)=>i));return{q:q.q,ref:q.ref||'',o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}})};
 S.seq=[];const g=shuf(['box','memo','tf']);let gi=0;for(let k=0;k<n;k++){S.seq.push('q');if((k+1)%3===0&&k<n-1)S.seq.push(g[gi++%3])}
 BG.ts=6;music(null);await splash('BẮT ĐẦU!','Chúc '+esc(p.name)+' thi tốt');BG.ts=1.2;gNext();
}
function gNext(){stopT();if(S.step>=S.seq.length)return gEnd();const s=S.seq[S.step++];if(s==='q')return gQ();
 BG.ts=9;music('fun');splash('🎉 TRÒ CHƠI THƯỞNG',{box:'Hộp quà bí mật',memo:'Lật thẻ ghép đôi',tf:'Đúng hay Sai?'}[s]).then(()=>{BG.ts=3;({box:gBox,memo:gMemo,tf:gTF})[s]()})}
function hud(extra=''){const m=Math.min(2,1+.1*S.streak).toFixed(1);return`<div class="hud"><div class="chips"><span class="chip">👤 ${esc(S.name)}</span><span class="chip gold" id="sc">⭐ ${S.score.toLocaleString('vi-VN')}</span><span class="chip fire">🔥 ${S.streak} · ×${m}</span>${S.dbl?'<span class="chip gold">✨ ×2</span>':''}</div>${extra}</div><div class="prog"><i style="width:${S.qi/S.n*100}%;background:linear-gradient(90deg,#f7c948,#ff8a00)"></i></div>`}
const RING=2*Math.PI*34;
function gQ(){BG.ts=1.2;music('calm');const q=S.qs[S.qi];S.locked=false;S.extra=0;const T=S.T,longO=q.o.some(o=>o.length>60);
 view(`${hud(`<div class="ring" id="rg"><svg width="80" height="80"><circle cx="40" cy="40" r="34" stroke="rgba(0,0,0,.35)" stroke-width="8" fill="none"/><circle id="rc" cx="40" cy="40" r="34" stroke="#f7c948" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${RING}" stroke-dashoffset="0"/></svg><div class="t" id="tt">${T}</div></div>`)}
 <div style="text-align:center;margin-top:14px;font-weight:800;color:var(--muted)">CÂU ${S.qi+1} / ${S.n}</div>
 <div class="qcard ${q.q.length>180?'long':''}">${esc(q.q)}</div>
 <div class="opts">${q.o.map((o,i)=>`<button class="opt o${i%4} ${longO?'small':''}" id="o${i}" onclick="gAns(${i})"><span class="ic">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
 <div class="fb" id="fb"></div>
 <div class="pus"><button class="btn purple sm" id="pf" onclick="gPu('f')" ${S.pu.f?'':'disabled'}>✂ 50:50 (${S.pu.f})</button><button class="btn purple sm" id="px" onclick="gPu('x')" ${S.pu.x?'':'disabled'}>✨ Nhân đôi (${S.pu.x})</button><button class="btn purple sm" id="pt" onclick="gPu('t')" ${S.pu.t?'':'disabled'}>⏱ +10 giây (${S.pu.t})</button></div>`);
 const t0=Date.now();let last=T;
 TM=setInterval(()=>{S.tl=Math.max(0,T+S.extra-(Date.now()-t0)/1000);const sec=Math.ceil(S.tl);$('#tt').textContent=sec;$('#rc').style.strokeDashoffset=RING*(1-Math.min(1,S.tl/T));
  if(sec<=5){$('#rg').classList.add('hot');$('#rc').style.stroke='#ff6b6b';if(sec<last&&sec>0)sfx('tick')}else{$('#rg').classList.remove('hot');$('#rc').style.stroke='#f7c948'}last=sec;if(S.tl<=0)gAns(-1)},100);

function readXlsx(u8){

 try{const wb=P('xl/workbook.xml'),rel=P('xl/_rels/workbook.xml.rels'),sh=T(wb,'sheet')[0],rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');

   if(t==='s')val=ss[+(v&&v.textContent)]||'';else if(t==='inlineStr')val=[...T(c,'t')].map(x=>x.textContent).join('');else val=v?v.textContent:'';arr[i]=val}rows.push(arr)}

}
function readCsv(text){text=text.replace(/^﻿/,'');const sep=(text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':(text.split('\n')[0].includes('\t')?'\t':',');
 const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===sep){row.push(f);f=''}else if(c==='\n'){row.push(f.replace(/\r$/,''));rows.push(row);row=[];f=''}else f+=c}

function rowsToQs(rows,defCat,report){
 let h=-1;for(let i=0;i<Math.min(rows.length,15);i++){if((rows[i]||[]).some(c=>norm(c).includes('cau hoi'))){h=i;break}}
 if(h<0)throw new Error('Không tìm thấy dòng tiêu đề có cột “Câu hỏi”. Hãy dùng file mẫu.');
 const H=rows[h].map(norm),find=re=>H.findIndex(x=>re.test(x));
 const c={cat:find(/linh vuc/),topic:find(/chu de/),q:find(/cau hoi/),a:find(/dap an dung|dap an chinh xac|^dung$/),ref:find(/can cu/)};
 const opt=['a','b','c','d'].map(L=>H.findIndex(x=>new RegExp('^(dap an |phuong an |)'+L+'$').test(x)));
 if(opt.some(i=>i<0)||c.a<0)throw new Error('Thiếu cột Đáp án A/B/C/D hoặc cột “Đáp án đúng”.');
 const out=[];
 for(let r=h+1;r<rows.length;r++){const R=rows[r]||[],g=i=>i>=0?String(R[i]??'').trim():'';const q=g(c.q);if(!q)continue;
  const o=opt.map(g);const last=o.length-[...o].reverse().findIndex(x=>x);const oo=o.slice(0,last);
  const av=g(c.a).toUpperCase();let a='ABCD'.indexOf(av[0]);if(a<0&&/^[1-4]$/.test(av))a=+av-1;
  if(oo.length<2||oo.some(x=>!x)||a<0||a>=oo.length){report.bad.push(r+1);continue}
  let cat=defCat;const cv=g(c.cat);
  if(cv){const nc=norm(cv),hit=DB.cats.find(x=>norm(x.name)===nc||x.id===cv||norm(x.grp+' '+x.name)===nc||norm(x.name).includes(nc)&&nc.length>5);
   if(hit)cat=hit.id;else{const id='c'+uid();DB.cats.push({id,name:cv,grp:'Khác'});report.newCats.push(cv);cat=id}}
  out.push({id:uid(),cat,topic:g(c.topic),q,o:oo,a,ref:g(c.ref)})}
 return out;
}

 else if(ext==='csv'||ext==='txt'){const t=new TextDecoder('utf-8').decode(buf);if(ext==='txt'&&t.includes('|')&&!/câu hỏi/i.test(t.split('\n')[0]))qs=rowsToQs([['Câu hỏi','A','B','C','D','Đáp án đúng','Căn cứ'],...t.split(/\r?\n/).map(l=>l.split('|').map(x=>x.trim()))],defCat,report);else qs=rowsToQs(readCsv(t),defCat,report)}
 else if(ext==='json'){const j=JSON.parse(new TextDecoder('utf-8').decode(buf));const arr=Array.isArray(j)?j:(j.questions||[]);
  if(Array.isArray(j.cats))j.cats.forEach(c=>{if(c&&c.id&&!DB.cats.some(x=>x.id===c.id)){DB.cats.push({id:c.id,name:c.name||c.id,grp:c.grp||'Khác'});report.newCats.push(c.name||c.id)}});
  arr.forEach((x,i)=>{if(x&&x.q&&Array.isArray(x.o)&&x.o.length>=2&&x.a>=0&&x.a<x.o.length)qs.push({id:x.id||uid(),cat:x.cat&&DB.cats.some(c=>c.id===x.cat)?x.cat:defCat,topic:x.topic||'',q:String(x.q),o:x.o.map(String),a:x.a|0,ref:x.ref||''});else report.bad.push(i+1)})}
 else throw new Error('Chỉ nhận file .xlsx, .csv, .json hoặc .txt');
 if(!qs.length)throw new Error('Không có câu hỏi hợp lệ trong file.');
 let added=0,dup=0;
 if(mode==='all')DB.bank=[];
 if(mode==='cats'){const cs=new Set(qs.map(q=>q.cat));DB.bank=DB.bank.filter(q=>!cs.has(q.cat))}
 const seen=new Set(DB.bank.map(q=>q.cat+'|'+norm(q.q)+'|'+norm(q.o[q.a])));
 for(const q of qs){const k=q.cat+'|'+norm(q.q)+'|'+norm(q.o[q.a]);if(seen.has(k)){dup++;continue}seen.add(k);DB.bank.push(q);added++}
 save('bank');save('cats');
 return {added,dup,bad:report.bad,newCats:report.newCats,total:qs.length};
}
