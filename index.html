function aRes(){
 const res=LS.get('dt_results',[]),el=$('#at');
 el.innerHTML=(API?'<div class="panel" id="srv"></div>':'')+`<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div class="h3">📊 ${res.length} lượt thi lưu trên máy này</div>
 <div><button class="btn blue sm" id="xr" ${res.length?'':'disabled'}>⬇ Xuất Excel</button><button class="btn red sm" id="cr" ${res.length?'':'disabled'}>🗑 Xóa kết quả</button></div></div>
 ${res.length?`<div style="overflow:auto"><table class="tb"><tr><th>Thời gian</th><th>Họ tên</th><th>Đơn vị</th><th>Cuộc thi</th><th>Đúng</th><th>Điểm</th><th>Kết quả</th><th>Làm bài</th></tr>${res.slice(0,300).map(r=>`<tr><td>${new Date(r.t).toLocaleString('vi-VN')}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.unit||'')}</td><td>${esc(r.exam)}</td><td>${r.ok}/${r.n}</td><td style="color:var(--gold);font-weight:800">${vnum(r.score)}</td><td>${isPass(r)?'<span class="ok-t">Đạt</span>':'<span class="err-t">Chưa đạt</span>'}</td><td>${fmtT(r.dur)}${r.auto?' ⌛':''}</td></tr>`).join('')}</table></div>${res.length>300?'<div class="note">Hiển thị 300 lượt gần nhất – xuất Excel để xem đủ.</div>':''}`:'<p class="note">Chưa có lượt thi nào.</p>'}
 <div class="note" style="margin-top:8px">${API?'Đây là các lượt thi làm trên chính trình duyệt này (bản lưu dự phòng). Kết quả của mọi người thi xem ở bảng tổng hợp phía trên.':'Kết quả chỉ lưu trên trình duyệt của máy này. Khi tổ chức thi trên nhiều máy, xuất Excel ở từng máy rồi tổng hợp – hoặc triển khai chế độ trực tuyến (Hướng dẫn mục IV).'}</div></div>`;
 if(res.length){$('#xr').onclick=()=>resXlsx(res,'ket-qua-thi-'+today());
  $('#cr').onclick=async()=>{if(await uiConfirm('Xóa toàn bộ kết quả thi trên máy này? Nên xuất Excel trước.')){LS.set('dt_results',[]);aRes()}}}
 if(API)srvRes(1);
}
function aSet(){
 const s=DB.set,el=$('#at');
 el.innerHTML=`<div class="panel"><div class="h3">⚙ Thiết lập chung</div><div class="row">
  <div><label class="lb">Tên đơn vị (hiện trên trang thi)</label><input class="inp" id="su" value="${esc(s.unit)}" placeholder="VD: Viện kiểm sát nhân dân khu vực …"></div>
  <div><label class="lb">Điểm đạt (thang điểm 10)</label><input class="inp" id="sp" type="number" step="0.5" min="0" max="10" value="${s.pass}"></div></div>
  <div style="margin-top:10px"><label class="chk"><input type="checkbox" id="sa" ${s.showAns?'checked':''}> Hiện đáp án chi tiết sau khi nộp bài</label><br>
  <label class="chk"><input type="checkbox" id="ss" ${s.shuffle?'checked':''}> Xáo trộn thứ tự đáp án A–D</label><br>
  <label class="chk"><input type="checkbox" id="sm" ${s.music?'checked':''}> Nhạc nền nhẹ khi làm bài</label><br>
  <label class="chk"><input type="checkbox" id="sg" ${s.game?'checked':''}> Cho phép “Luyện tập vui” dạng trò chơi</label></div>
  <button class="btn gold" id="sv">💾 Lưu thiết lập</button></div>
 <div class="panel"><div class="h3">🗂️ Lĩnh vực thi</div><div class="note">Có thể đổi tên hoặc thêm lĩnh vực mới. Chỉ xóa được lĩnh vực chưa có câu hỏi.</div>
  ${DB.cats.map((c,i)=>`<div class="row" style="grid-template-columns:1fr 2fr auto;align-items:end"><div><label class="lb">Nhóm</label><input class="inp" data-c="${i}" data-k="grp" value="${esc(c.grp)}"></div><div><label class="lb">Tên lĩnh vực (${DB.bank.filter(q=>q.cat===c.id).length} câu)</label><input class="inp" data-c="${i}" data-k="name" value="${esc(c.name)}"></div><button class="btn red sm" data-dc="${i}" ${DB.bank.some(q=>q.cat===c.id)?'disabled':''}>🗑</button></div>`).join('')}
  <button class="btn blue sm" id="ac" style="margin-top:10px">➕ Thêm lĩnh vực</button></div>
 <div class="panel"><div class="h3">🔐 Bảo mật & dữ liệu</div>
  ${API?'':'<button class="btn purple sm" id="pin">Đổi mã PIN</button>'}<button class="btn ghost sm" id="rb">↺ Nạp lại các bộ câu hỏi gốc (${BUILTIN.length} câu)</button><button class="btn red sm" id="rs">⚠ Xóa toàn bộ dữ liệu trên máy này</button>
  <div class="note" style="margin-top:8px">${API?`Chế độ trực tuyến: đăng nhập bằng <b>khóa quản trị</b> lưu trên máy chủ (đổi khóa: sửa KHOA_QUAN_TRI trong Code.gs rồi triển khai phiên bản mới). Máy chủ: <span style="word-break:break-all">${esc(API)}</span><br>Lưu ý: bộ câu hỏi kèm đáp án được tải về trình duyệt người thi – người rành kỹ thuật có thể xem được; không đưa nội dung mật, nội dung chưa công khai lên.`:'Mã PIN chỉ ngăn người thi vô tình mở phần thiết lập; dữ liệu nằm trên trình duyệt của máy, không phải biện pháp bảo mật tuyệt đối. Không đưa tài liệu mật vào ngân hàng câu hỏi.'}</div></div>`;
 $('#sv').onclick=()=>{Object.assign(s,{unit:$('#su').value.trim(),pass:Math.min(10,Math.max(0,+$('#sp').value||0)),showAns:$('#sa').checked,shuffle:$('#ss').checked,music:$('#sm').checked,game:$('#sg').checked});save('set');uiAlert('✔ Đã lưu thiết lập.')};
 el.onchange=e=>{const t=e.target;if(t.dataset.c===undefined)return;DB.cats[+t.dataset.c][t.dataset.k]=t.value.trim();save('cats')};
 el.onclick=async e=>{const t=e.target;
  if(t.dataset.dc!==undefined){const c=DB.cats[+t.dataset.dc];if(await uiConfirm('Xóa lĩnh vực “'+esc(c.name)+'”?')){DB.cats.splice(+t.dataset.dc,1);DB.exams.forEach(x=>x.cats=x.cats.filter(y=>y!==c.id));save('cats');save('exams');aSet()}}
  if(t.id==='ac'){const n=await uiPrompt('Tên lĩnh vực mới');if(n&&n.trim()){DB.cats.push({id:'c'+uid(),name:n.trim(),grp:'Khác'});save('cats');aSet()}}
  if(t.id==='pin'){const a=await uiPrompt('Mã PIN mới (ít nhất 4 ký tự)','password');if(a===null)return;if(a.length<4){uiAlert('Mã PIN quá ngắn.');return}const b=await uiPrompt('Nhập lại mã PIN mới','password');if(a!==b){uiAlert('Hai lần nhập không khớp.');return}s.pin=hash(a);s.pinDefault=false;save('set');uiAlert('✔ Đã đổi mã PIN.')}
  if(t.id==='rb'){if(await uiConfirm(`Bổ sung lại các bộ câu hỏi gốc (${BUILTIN.length} câu: Thi hành án dân sự; Kiểm sát vụ án dân sự liên quan đến đất đai; NQ 205/2025/QH15) cùng lĩnh vực, cuộc thi mặc định còn thiếu?<br>Câu hỏi, cuộc thi đang có được giữ nguyên.`)){const n=addBuiltin([...new Set(BUILTIN.map(q=>q.cat))]);save('cats');save('exams');save('bank');await uiAlert('✔ Đã thêm '+n+' câu.');aSet()}}
  if(t.id==='rs'){if(await uiConfirm('⚠ Xóa <b>toàn bộ</b> ngân hàng câu hỏi, cuộc thi, kết quả, thiết lập trên máy này? Nên sao lưu trước.','Xóa hết','Hủy')){['dt_bank','dt_cats','dt_exams','dt_set','dt_results','dt_cur','dt_lb','dt_dirty','dt_pubver','dt_seed'].forEach(k=>localStorage.removeItem(k));location.reload()}}};
}

(async function boot(){
 if(API){view(`<div class="enter center" style="margin-top:18vh"><div class="coin"><span>⚖️</span><span class="bk">⚖️</span></div><div class="spin" style="margin-top:22px"></div><p class="note">Đang kết nối máy chủ thi trực tuyến…</p></div>`,null);
  await netLoad();if(outbox().length)resend()}
 home();
})();
</script>
</body>
</html>
