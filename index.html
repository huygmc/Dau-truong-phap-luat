n dân cấp xã phải tổ chức hòa giải lại từ đầu","Chủ tịch Hội đồng, các thành viên ký, đóng dấu UBND cấp xã và gửi cho các bên"],"a":3,"ref":"Điểm đ khoản 2 Điều 235 Luật Đất đai 2024: “Trường hợp hòa giải không thành mà một hoặc các bên tranh chấp không ký vào biên bản thì Chủ tịch Hội đồng, các thành viên tham gia hòa giải phải ký vào biên bản, đóng dấu của Ủy ban nhân dân cấp xã và gửi cho các bên tranh chấp”"},{"id":"ksdd159","cat":"ksdd","topic":"Luật Đất đai: hòa giải, thẩm quyền giải quyết tranh chấp, chuyển tiếp","q":"Theo Luật Đất đai 2024, tranh chấp đất đai mà một trong các bên tranh chấp có Giấy chứng nhận hoặc có một trong các loại giấy tờ quy định tại Điều 137 thì do cơ quan nào giải quyết?","o":["Các bên được lựa chọn Ủy ban nhân dân hoặc Tòa án","Chủ tịch Ủy ban nhân dân cấp có thẩm quyền","Tòa án","Hội đồng hòa giải cấp xã"],"a":2,"ref":"Khoản 1 Điều 236 Luật Đất đai 2024: “hoặc có một trong các loại giấy tờ quy định tại Điều 137 của Luật này và tranh chấp về tài sản gắn liền với đất thì do Tòa án giải quyết”"},{"id":"ksdd160","cat":"ksdd","topic":"Luật Đất đai: hòa giải, thẩm quyền giải quyết tranh chấp, chuyển tiếp","q":"Theo Luật Đất đai 2024, tranh chấp đất đai mà các bên tranh chấp không có Giấy chứng nhận hoặc không có giấy tờ quy định tại Điều 137 thì được giải quyết theo cách nào?","o":["Bắt buộc khởi kiện tại Tòa án, không được yêu cầu Ủy ban nhân dân giải quyết","Các bên được lựa chọn nộp đơn tại Ủy ban nhân dân cấp có thẩm quyền hoặc khởi kiện tại Tòa án có thẩm quyền","Bắt buộc nộp đơn tại Ủy ban nhân dân cấp có thẩm quyền, không được khởi kiện tại Tòa án","Chỉ được giải quyết bằng Trọng tài thương mại Việt Nam"],"a":1,"ref":"Khoản 2 Điều 236 Luật Đất đai 2024: “thì các bên tranh chấp được lựa chọn một trong hai hình thức giải quyết tranh chấp đất đai theo quy định sau đây” … “Nộp đơn yêu cầu giải quyết tranh chấp tại Ủy ban nhân dân cấp có thẩm quyền” … “Khởi kiện tại Tòa án có thẩm quyền theo quy định của pháp luật về tố tụng dân sự”"},{"id":"ksdd161","cat":"ksdd","topic":"Luật Đất đai: hòa giải, thẩm quyền giải quyết tranh chấp, chuyển tiếp","q":"Theo Luật Đất đai 2024, khi Tòa án yêu cầu cung cấp hồ sơ, tài liệu liên quan đến quản lý, sử dụng đất để làm căn cứ giải quyết tranh chấp, trách nhiệm cung cấp thuộc về ai?","o":["Chỉ Ủy ban nhân dân cấp tỉnh","Đương sự đang quản lý đất","Viện kiểm sát cùng cấp","Ủy ban nhân dân các cấp"],"a":3,"ref":"Khoản 6 Điều 236 Luật Đất đai 2024: “Ủy ban nhân dân các cấp có trách nhiệm cung cấp hồ sơ, tài liệu có liên quan đến việc quản lý, sử dụng đất đai khi được Tòa án, Trọng tài thương mại Việt Nam yêu cầu”"},{"id":"ksdd162","cat":"ksdd","topic":"Luật Đất đai: hòa giải, thẩm quyền giải quyết tranh chấp, chuyển tiếp","q":"Theo Luật Đất đai 2024, Giấy chứng nhận đã được cấp theo quy định của pháp luật trước ngày Luật này có hiệu lực thi hành có giá trị như thế nào?","o":["Chỉ có giá trị pháp lý đến hết ngày 31/12/2025","Vẫn có giá trị pháp lý và không phải cấp đổi; nếu có nhu cầu thì được cấp đổi","Hết giá trị pháp lý và bắt buộc phải cấp đổi sang mẫu Giấy chứng nhận mới","Chỉ có giá trị khi được cơ quan có thẩm quyền đính chính lại"],"a":1,"ref":"Khoản 3 Điều 256 Luật Đất đai 2024: “trước ngày Luật này có hiệu lực thi hành vẫn có giá trị pháp lý và không phải cấp đổi sang Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất” … “trường hợp có nhu cầu thì được cấp đổi”"},{"id":"ksdd163","cat":"ksdd","topic":"Luật Đất đai: hòa giải, thẩm quyền giải quyết tranh chấp, chuyển tiếp","q":"Theo Luật Đất đai 2024, hồ sơ cấp Giấy chứng nhận đã được cơ quan có thẩm quyền tiếp nhận nhưng đến ngày Luật này có hiệu lực mà chưa được cấp thì thủ tục được giải quyết theo quy định nào (trừ khi người sử dụng đất đề nghị áp dụng Luật mới)?","o":["Theo Luật Đất đai số 45/2013/QH13 và các văn bản hướng dẫn; thẩm quyền cấp theo Luật Đất đai 2024","Theo Luật Đất đai 2024 trong mọi trường hợp, kể cả về trình tự, thủ tục","Theo quyết định riêng của Ủy ban nhân dân cấp tỉnh đối với từng hồ sơ","Theo Luật Đất đai năm 2003 và các nghị định hướng dẫn thi hành"],"a":0,"ref":"Khoản 2 Điều 256 Luật Đất đai 2024: “thì tiếp tục giải quyết thủ tục theo quy định của Luật Đất đai số 45/2013/QH13” … “thẩm quyền cấp Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất thực hiện theo quy định của Luật này”"},{"id":"ksdd164","cat":"ksdd","topic":"Luật Đất đai: hòa giải, thẩm quyền giải quyết tranh chấp, chuyển tiếp","q":"Luật Đất đai số 31/2024/QH15 có hiệu lực thi hành từ ngày nào (trừ một số điều, khoản có quy định riêng)?","o":["18/01/2024","01/7/2024","01/8/2024","01/01/2025"],"a":2,"ref":"Khoản 1 Điều 252 Luật Đất đai 2024 (hiệu lực đã được sửa đổi theo Luật số 43/2024/QH15): “Luật này có hiệu lực thi hành từ ngày 01 tháng 8 năm 2024”"},{"id":"ksdd165","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, điều kiện nào sau đây là một trong các điều kiện có hiệu lực của giao dịch dân sự?","o":["Giao dịch phải có người làm chứng","Chủ thể tham gia giao dịch dân sự hoàn toàn tự nguyện","Giá giao dịch phải tương xứng với giá thị trường","Giao dịch phải được công chứng trong mọi trường hợp"],"a":1,"ref":"Khoản 1 Điều 117 BLDS 2015: “Chủ thể tham gia giao dịch dân sự hoàn toàn tự nguyện”"},{"id":"ksdd166","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, khi các bên xác lập giao dịch một cách giả tạo nhằm che giấu một giao dịch khác (ví dụ lập hợp đồng chuyển nhượng QSDĐ để che giấu hợp đồng vay) thì hậu quả pháp lý là gì?","o":["Giao dịch giả tạo có hiệu lực, còn giao dịch bị che giấu vô hiệu","Giao dịch giả tạo vô hiệu, còn giao dịch bị che giấu vẫn có hiệu lực, trừ trường hợp giao dịch đó cũng vô hiệu theo quy định","Cả hai giao dịch đều vô hiệu trong mọi trường hợp, các bên hoàn trả cho nhau những gì đã nhận","Cả hai giao dịch đều có hiệu lực nếu đã được công chứng"],"a":1,"ref":"Khoản 1 Điều 124 BLDS 2015: “thì giao dịch dân sự giả tạo vô hiệu, còn giao dịch dân sự bị che giấu vẫn có hiệu lực, trừ trường hợp giao dịch đó cũng vô hiệu theo quy định của Bộ luật này hoặc luật khác có liên quan”"},{"id":"ksdd167","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, giao dịch đã xác lập bằng văn bản nhưng vi phạm quy định bắt buộc về công chứng, chứng thực mà một bên hoặc các bên đã thực hiện ít nhất bao nhiêu nghĩa vụ thì theo yêu cầu, Tòa án ra quyết định công nhận hiệu lực của giao dịch?","o":["Toàn bộ nghĩa vụ","Ít nhất một nửa nghĩa vụ","Ít nhất hai phần ba nghĩa vụ","Ít nhất một phần ba nghĩa vụ"],"a":2,"ref":"Khoản 2 Điều 129 BLDS 2015: “vi phạm quy định bắt buộc về công chứng, chứng thực mà một bên hoặc các bên đã thực hiện ít nhất hai phần ba nghĩa vụ trong giao dịch”"},{"id":"ksdd168","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, khi Tòa án ra quyết định công nhận hiệu lực của giao dịch vi phạm quy định bắt buộc về công chứng, chứng thực (đã thực hiện ít nhất 2/3 nghĩa vụ) thì các bên có phải công chứng, chứng thực lại không?","o":["Phải công chứng trong 30 ngày","Phải chứng thực tại Ủy ban nhân dân cấp xã","Không phải thực hiện việc công chứng, chứng thực","Phải công chứng nếu bên nhận chuyển nhượng yêu cầu"],"a":2,"ref":"Khoản 2 Điều 129 BLDS 2015: “Trong trường hợp này, các bên không phải thực hiện việc công chứng, chứng thực”"},{"id":"ksdd169","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, khi giao dịch dân sự vô hiệu thì các bên giải quyết hậu quả như thế nào?","o":["Khôi phục tình trạng ban đầu, hoàn trả những gì đã nhận; không trả được bằng hiện vật thì trả bằng tiền","Các bên tự thỏa thuận việc hoàn trả, Tòa án không giải quyết hậu quả","Bên nhận tài sản được giữ lại tài sản, chỉ phải trả cho bên kia tiền lãi chậm thanh toán","Nhà nước tịch thu toàn bộ tài sản là đối tượng của giao dịch sung công quỹ"],"a":0,"ref":"Khoản 2 Điều 131 BLDS 2015: “Khi giao dịch dân sự vô hiệu thì các bên khôi phục lại tình trạng ban đầu, hoàn trả cho nhau những gì đã nhận” … “Trường hợp không thể hoàn trả được bằng hiện vật thì trị giá thành tiền để hoàn trả”"},{"id":"ksdd170","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, khi giao dịch dân sự vô hiệu, vấn đề bồi thường thiệt hại được giải quyết theo nguyên tắc nào?","o":["Không đặt ra vấn đề bồi thường","Các bên luôn chịu thiệt hại ngang nhau","Bên nhận tài sản luôn phải bồi thường","Bên có lỗi gây thiệt hại thì phải bồi thường"],"a":3,"ref":"Khoản 4 Điều 131 BLDS 2015: “Bên có lỗi gây thiệt hại thì phải bồi thường”"},{"id":"ksdd171","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, thời hiệu yêu cầu Tòa án tuyên bố giao dịch dân sự vô hiệu do không tuân thủ quy định về hình thức (Điều 129) là bao lâu?","o":["03 năm","01 năm","02 năm","Không bị hạn chế"],"a":2,"ref":"Khoản 1 Điều 132 BLDS 2015: “Thời hiệu yêu cầu Tòa án tuyên bố giao dịch dân sự vô hiệu quy định tại các điều 125, 126, 127, 128 và 129 của Bộ luật này là 02 năm”"},{"id":"ksdd172","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, thời hiệu yêu cầu Tòa án tuyên bố giao dịch dân sự vô hiệu do vi phạm điều cấm của luật, trái đạo đức xã hội hoặc do giả tạo được quy định thế nào?","o":["10 năm, kể từ ngày giao dịch được xác lập","Không bị hạn chế","02 năm, kể từ ngày giao dịch được xác lập","03 năm, kể từ ngày biết giao dịch vô hiệu"],"a":1,"ref":"Khoản 3 Điều 132 BLDS 2015: “Đối với giao dịch dân sự quy định tại Điều 123 và Điều 124 của Bộ luật này thì thời hiệu yêu cầu Tòa án tuyên bố giao dịch dân sự vô hiệu không bị hạn chế”"},{"id":"ksdd173","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, giao dịch dân sự vô hiệu nhưng tài sản đã được đăng ký tại cơ quan có thẩm quyền, sau đó được chuyển giao bằng giao dịch khác cho người thứ ba ngay tình và người này căn cứ vào việc đăng ký đó mà xác lập giao dịch thì giao dịch với người thứ ba có hiệu lực không?","o":["Giao dịch đó không bị vô hiệu","Giao dịch đó có hiệu lực một phần","Giao dịch đó chỉ có hiệu lực nếu chủ sở hữu ban đầu đồng ý","Giao dịch đó đương nhiên vô hiệu"],"a":0,"ref":"Khoản 2 Điều 133 BLDS 2015: “sau đó được chuyển giao bằng một giao dịch dân sự khác cho người thứ ba ngay tình và người này căn cứ vào việc đăng ký đó mà xác lập, thực hiện giao dịch thì giao dịch đó không bị vô hiệu”"},{"id":"ksdd174","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, trường hợp nào sau đây KHÔNG áp dụng thời hiệu khởi kiện?","o":["Yêu cầu tuyên bố giao dịch dân sự vô hiệu do bị lừa dối","Tranh chấp về quyền sử dụng đất theo quy định của Luật đất đai","Yêu cầu người thừa kế thực hiện nghĩa vụ về tài sản của người chết để lại","Yêu cầu giải quyết tranh chấp hợp đồng đặt cọc"],"a":1,"ref":"Khoản 3 Điều 155 BLDS 2015: “Tranh chấp về quyền sử dụng đất theo quy định của Luật đất đai”"},{"id":"ksdd175","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, thời hiệu khởi kiện để yêu cầu Tòa án giải quyết tranh chấp hợp đồng là bao lâu?","o":["10 năm, kể từ ngày giao kết hợp đồng đối với hợp đồng có đối tượng là bất động sản","03 năm, kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền và lợi ích hợp pháp của mình bị xâm phạm","02 năm, kể từ ngày các bên giao kết hợp đồng, không phụ thuộc thời điểm biết quyền lợi bị xâm phạm","05 năm, kể từ ngày hợp đồng hết hạn hoặc chấm dứt theo thỏa thuận của các bên"],"a":1,"ref":"Điều 429 BLDS 2015: “Thời hiệu khởi kiện để yêu cầu Tòa án giải quyết tranh chấp hợp đồng là 03 năm” … “kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền và lợi ích hợp pháp của mình bị xâm phạm”"},{"id":"ksdd176","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, việc chuyển quyền sử dụng đất có hiệu lực kể từ thời điểm nào?","o":["Thời điểm bên nhận chuyển nhượng trả đủ tiền","Thời điểm đăng ký theo quy định của Luật đất đai","Thời điểm các bên ký hợp đồng chuyển nhượng","Thời điểm hợp đồng được công chứng, chứng thực"],"a":1,"ref":"Điều 503 BLDS 2015: “Việc chuyển quyền sử dụng đất có hiệu lực kể từ thời điểm đăng ký theo quy định của Luật đất đai”"},{"id":"ksdd177","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, thời hiệu để người thừa kế yêu cầu chia di sản là bất động sản là bao lâu?","o":["03 năm, kể từ thời điểm mở thừa kế","10 năm, kể từ thời điểm mở thừa kế","20 năm, kể từ ngày người thừa kế biết quyền lợi bị xâm phạm","30 năm, kể từ thời điểm mở thừa kế"],"a":3,"ref":"Khoản 1 Điều 623 BLDS 2015: “Thời hiệu để người thừa kế yêu cầu chia di sản là 30 năm đối với bất động sản, 10 năm đối với động sản, kể từ thời điểm mở thừa kế”"},{"id":"ksdd178","cat":"ksdd","topic":"Bộ luật Dân sự 2015 (giao dịch, thời hiệu, hợp đồng về QSDĐ)","q":"Theo Bộ luật Dân sự 2015, hết thời hiệu yêu cầu chia di sản thì di sản thuộc về ai?","o":["Nhà nước","Người thừa kế đang quản lý di sản đó","Người thừa kế lớn tuổi nhất","Chia đều cho tất cả người thừa kế"],"a":1,"ref":"Khoản 1 Điều 623 BLDS 2015: “Hết thời hạn này thì di sản thuộc về người thừa kế đang quản lý di sản đó”"},{"id":"ksdd179","cat":"ksdd","topic":"Án lệ về đất đai","q":"Theo Án lệ số 04/2016/AL, nhà đất là tài sản chung của vợ chồng nhưng chỉ một người ký hợp đồng chuyển nhượng; người còn lại biết, cùng sử dụng tiền chuyển nhượng, bên nhận đã quản lý, sử dụng công khai mà người đó không phản đối thì được xác định thế nào?","o":["Hợp đồng chỉ có hiệu lực khi người không ký ký bổ sung","Hợp đồng vô hiệu một nửa tương ứng phần của người không ký","Hợp đồng vô hiệu toàn bộ vì thiếu chữ ký","Người không ký được xác định là đồng ý với việc chuyển nhượng"],"a":3,"ref":"Án lệ số 04/2016/AL: “người không ký tên trong hợp đồng biết mà không có ý kiến phản đối gì thì phải xác định là người đó đồng ý với việc chuyển nhượng nhà đất”"},{"id":"ksdd180","cat":"ksdd","topic":"Án lệ về đất đai","q":"Theo Án lệ số 05/2016/AL, đương sự có công sức quản lý, tôn tạo di sản nhưng phản đối chia thừa kế và không có yêu cầu cụ thể về công sức; nếu Tòa án quyết định chia thừa kế thì phải xử lý thế nào?","o":["Phải xem xét công sức đóng góp của họ vì yêu cầu không chia thừa kế lớn hơn yêu cầu xem xét về công sức","Tách yêu cầu về công sức để giải quyết bằng một vụ án khác khi đương sự khởi kiện","Chỉ xem xét công sức nếu Viện kiểm sát có đề nghị tại phiên tòa","Không xem xét vì đương sự không có yêu cầu cụ thể, Tòa án chỉ giải quyết trong phạm vi yêu cầu"],"a":0,"ref":"Án lệ số 05/2016/AL: “nếu Tòa án quyết định việc chia thừa kế cho các thừa kế thì phải xem xét về công sức đóng góp của họ vì yêu cầu không chia thừa kế đối với di sản thừa kế lớn hơn yêu cầu xem xét về công sức”"},{"id":"ksdd181","cat":"ksdd","topic":"Án lệ về đất đai","q":"Theo Án lệ số 15/2017/AL, các đương sự tự nguyện thỏa thuận miệng chuyển đổi quyền sử dụng đất nông nghiệp trước ngày 15/10/1993, đã đăng ký, kê khai, được ghi nhận tại Sổ địa chính và canh tác ổn định, liên tục, lâu dài thì Tòa án giải quyết thế nào?","o":["Tuyên bố giao dịch chuyển đổi vô hiệu do không được lập thành văn bản","Đình chỉ giải quyết vụ án vì đã hết thời hiệu khởi kiện","Buộc các bên trả lại đất cho nhau và thanh toán công sức tôn tạo","Công nhận thỏa thuận miệng; các bên có quyền sử dụng phần đất đã đổi"],"a":3,"ref":"Án lệ số 15/2017/AL: “Tòa án phải công nhận thỏa thuận miệng của các đương sự về việc chuyển đổi quyền sử dụng đất nông nghiệp đó để xác định các đương sự có quyền sử dụng diện tích đất đã đổi”"},{"id":"ksdd182","cat":"ksdd","topic":"Án lệ về đất đai","q":"Theo Án lệ số 16/2017/AL, di sản là bất động sản đã được một đồng thừa kế chuyển nhượng, các đồng thừa kế khác biết và không phản đối, tiền chuyển nhượng dùng lo cuộc sống của các đồng thừa kế, bên nhận đã được cấp Giấy chứng nhận thì giải quyết thế nào?","o":["Buộc bên nhận chuyển nhượng trả lại đất","Tuyên hợp đồng vô hiệu và đưa diện tích đó vào khối di sản","Chia giá trị diện tích đã chuyển nhượng cho các đồng thừa kế khác","Công nhận hợp đồng; diện tích đã chuyển nhượng không còn trong khối di sản"],"a":3,"ref":"Án lệ số 16/2017/AL: “Tòa án phải công nhận hợp đồng chuyển nhượng quyền sử dụng đất là hợp pháp và diện tích đất đã chuyển nhượng không còn trong khối di sản để chia thừa kế mà thuộc quyền sử dụng của bên nhận chuyển nhượng”"},{"id":"ksdd183","cat":"ksdd","topic":"Án lệ về đất đai","q":"Theo Án lệ số 32/2020/AL, đất do cá nhân khai phá nhưng sau đó xuất cảnh định cư ở nước ngoài; người khác đã quản lý, sử dụng ổn định, lâu dài, tôn tạo, xây nhà, đăng ký kê khai và được cấp Giấy chứng nhận thì yêu cầu đòi lại đất của người khai phá được giải quyết thế nào?","o":["Buộc người đang sử dụng thanh toán giá trị đất cho người khai phá","Chấp nhận trả lại đất cho người khai phá","Không có cơ sở chấp nhận vì người khai phá không còn quyền sử dụng đất hợp pháp","Chia đôi diện tích đất cho hai bên"],"a":2,"ref":"Án lệ số 32/2020/AL: “phải xác định cá nhân khai phá đất không còn quyền sử dụng đất hợp pháp nên việc yêu cầu đòi lại quyền sử dụng đất là không có cơ sở để chấp nhận”"},{"id":"ksdd184","cat":"ksdd","topic":"Án lệ về đất đai","q":"Theo Án lệ số 38/2020/AL, nhà, đất đã được phân chia bằng bản án có hiệu lực pháp luật, sau đó người khác (không phải đương sự trong vụ án đó) khởi kiện đòi nhà, đất đó thì Tòa án xử lý thế nào?","o":["Thụ lý rồi tạm đình chỉ giải quyết vụ án để chờ kết quả kháng nghị giám đốc thẩm","Thụ lý và giải quyết như một vụ án mới vì người khởi kiện không phải là đương sự trong vụ án trước","Không thụ lý vụ án mới; người có yêu cầu thông báo bằng văn bản đề nghị xem xét lại theo giám đốc thẩm, tái thẩm","Chuyển đơn cho Ủy ban nhân dân cấp xã nơi có đất tổ chức hòa giải trước khi thụ lý"],"a":2,"ref":"Án lệ số 38/2020/AL: “Tòa án không thụ lý vụ án mới. Người có yêu cầu đòi quyền sở hữu nhà và quyền sử dụng đất thông báo bằng văn bản cho người có thẩm quyền xem xét lại bản án, quyết định đã có hiệu lực pháp luật của Tòa án theo thủ tục giám đốc thẩm hoặc tái thẩm”"},{"id":"ksdd185","cat":"ksdd","topic":"Án lệ về đất đai","q":"Theo Án lệ số 52/2021/AL, hợp đồng tặng cho quyền sử dụng đất bằng văn bản đã được công chứng, chứng thực; bên được tặng cho chưa đăng ký quyền sử dụng đất do trở ngại khách quan thì bên tặng cho chết. Hợp đồng tặng cho được xác định thế nào?","o":["Hợp đồng vô hiệu vì chưa đăng ký","Hợp đồng tặng cho quyền sử dụng đất có hiệu lực pháp luật","Hợp đồng chấm dứt khi bên tặng cho chết","Quyền sử dụng đất trở thành di sản của bên tặng cho"],"a":1,"ref":"Án lệ số 52/2021/AL: “phải xác định hợp đồng tặng cho quyền sử dụng đất có hiệu lực pháp luật”"},{"id":"ksdd186","cat":"ksdd","topic":"Án lệ về đất đai","q":"Theo Án lệ số 55/2022/AL, hợp đồng chuyển nhượng quyền sử dụng đất được xác lập trước ngày 01/01/2017, chưa được công chứng, chứng thực nhưng bên nhận chuyển nhượng đã thực hiện 2/3 nghĩa vụ thì Tòa án giải quyết thế nào?","o":["Công nhận hiệu lực của hợp đồng","Buộc các bên công chứng lại hợp đồng trong 30 ngày","Hủy hợp đồng và buộc hoàn trả cho nhau","Tuyên hợp đồng vô hiệu do vi phạm hình thức"],"a":0,"ref":"Án lệ số 55/2022/AL: “Hợp đồng chuyển nhượng quyền sử dụng đất được xác lập trước ngày 01/01/2017 chưa được công chứng/chứng thực nhưng bên nhận chuyển nhượng đã thực hiện 2/3 nghĩa vụ của mình” … “Trường hợp này, Tòa án công nhận hiệu lực của hợp đồng”"},{"id":"ksdd187","cat":"ksdd","topic":"Án lệ về đất đai","q":"Theo Án lệ số 71/2024/AL, tranh chấp quyền sử dụng đất đã được giải quyết bằng quyết định có hiệu lực của cơ quan nhà nước có thẩm quyền; nguyên đơn (không đứng tên trên Giấy chứng nhận) tiếp tục khởi kiện dân sự và yêu cầu hủy quyết định đó thì Tòa án giải quyết thế nào?","o":["Tạm đình chỉ giải quyết vụ án để chờ cơ quan nhà nước có thẩm quyền xem xét lại quyết định","Thụ lý giải quyết và hủy quyết định của cơ quan nhà nước nếu xét thấy quyết định đó trái pháp luật","Đình chỉ vì sự việc đã được giải quyết bằng quyết định có hiệu lực và không thuộc thẩm quyền Tòa án","Chuyển vụ án sang giải quyết theo thủ tục tố tụng hành chính tại Tòa án nhân dân cấp tỉnh"],"a":2,"ref":"Án lệ số 71/2024/AL: “Tòa án phải đình chỉ giải quyết vụ án với lý do sự việc đã được giải quyết bằng quyết định có hiệu lực của cơ quan nhà nước có thẩm quyền và không thuộc thẩm quyền giải quyết của Tòa án”"},{"id":"ksdd188","cat":"ksdd","topic":"Án lệ về đất đai","q":"Theo Án lệ số 72/2024/AL, di sản là quyền sử dụng đất được định đoạt theo di chúc hợp pháp, di chúc xác định tứ cận nhưng không thể hiện diện tích cụ thể và không có tranh chấp về tứ cận thì di sản được xác định thế nào?","o":["Theo diện tích ghi trên Giấy chứng nhận đã cấp cho người để lại di sản","Di chúc vô hiệu đối với phần định đoạt quyền sử dụng đất","Theo diện tích đo đạc thực tế trong phạm vi tứ cận ghi trong di chúc","Theo diện tích trung bình giữa các lần đo đạc trong hồ sơ địa chính"],"a":2,"ref":"Án lệ số 72/2024/AL: “Tòa án phải xác định di sản thừa kế là quyền sử dụng đất được xác định theo diện tích đất đo đạc thực tế theo tứ cận thể hiện trong di chúc”"},{"id":"ksdd189","cat":"ksdd","topic":"Biểu mẫu nghiệp vụ (QĐ 195/QĐ-VKSTC)","q":"Theo hệ thống biểu mẫu ban hành kèm Quyết định số 195/QĐ-VKSTC, văn bản \"Yêu cầu xác minh, thu thập tài liệu, chứng cứ\" là mẫu nào?","o":["Mẫu số 50/DS","Mẫu số 05/DS","Mẫu số 26/DS","Mẫu số 15/DS"],"a":2,"ref":"Mẫu số 26/DS, QĐ 195/QĐ-VKSTC – Danh mục biểu mẫu: Yêu cầu xác minh, thu thập tài liệu, chứng cứ"},{"id":"ksdd190","cat":"ksdd","topic":"Biểu mẫu nghiệp vụ (QĐ 195/QĐ-VKSTC)","q":"Theo hệ thống biểu mẫu ban nh, Huế, Cần Thơ, Quảng Ninh và Lâm Đồng","Hà Nội, Thành phố Hồ Chí Minh, Đà Nẵng, Cần Thơ, Quảng Ninh và Đắk Lắk","Hà Nội, Thành phố Hồ Chí Minh, Đà Nẵng, Cần Thơ, Hải Phòng và Đắk Lắk","Hà Nội, Thành phố Hồ Chí Minh, Đà Nẵng, Hải Phòng, Quảng Ninh và Gia Lai"],"a":1,"ref":"Khoản 1 Điều 19 NQ 205/2025/QH15"},{"id":"nq205_005","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo khoản 1 Điều 1 Nghị quyết số 205/2025/QH15, “vụ án dân sự công ích” là gì?","o":["Mọi vụ án dân sự có Kiểm sát viên tham gia phiên tòa để bảo vệ lợi ích công","Vụ án dân sự do Viện kiểm sát khởi kiện để bảo vệ quyền dân sự của các chủ thể là nhóm dễ bị tổn thương hoặc bảo vệ lợi ích công khi không có người khởi kiện","Vụ án dân sự do cơ quan, tổ chức khởi kiện để bảo vệ lợi ích công cộng thuộc lĩnh vực mình phụ trách","Vụ án hành chính do Viện kiểm sát khởi kiện đối với quyết định hành chính xâm phạm lợi ích công"],"a":1,"ref":"Khoản 1 Điều 1 NQ 205/2025/QH15"},{"id":"nq205_006","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo khoản 1 Điều 2 Nghị quyết số 205/2025/QH15, việc khởi kiện và giải quyết vụ án dân sự công ích được áp dụng pháp luật như thế nào?","o":["Thực hiện theo Luật Tố tụng hành chính và Nghị quyết số 205/2025/QH15","Chỉ thực hiện theo Thông tư liên tịch số 09/2025/TTLT, không áp dụng Bộ luật Tố tụng dân sự","Thực hiện theo Bộ luật Tố tụng dân sự; trường hợp Bộ luật không quy định thì áp dụng Nghị quyết số 205/2025/QH15","Thực hiện theo Nghị quyết số 205/2025/QH15; trường hợp Nghị quyết không quy định thì áp dụng Bộ luật Tố tụng dân sự và quy định khác của pháp luật có liên quan"],"a":3,"ref":"Khoản 1 Điều 2 NQ 205/2025/QH15"},{"id":"nq205_007","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo nguyên tắc tại khoản 2 Điều 2 Nghị quyết số 205/2025/QH15, Viện kiểm sát chỉ khởi kiện vụ án dân sự công ích khi nào?","o":["Khi nhận được đơn đề nghị khởi kiện của bất kỳ cơ quan, tổ chức, cá nhân nào, không phụ thuộc việc đã có người khởi kiện hay chưa","Khi cơ quan quản lý nhà nước đã xử phạt vi phạm hành chính nhưng người vi phạm chưa nộp tiền phạt","Khi đã thông báo, kiến nghị cơ quan, tổ chức, cá nhân thực hiện quyền, trách nhiệm khởi kiện theo quy định của pháp luật nhưng không có người khởi kiện","Khi Tòa án có văn bản yêu cầu Viện kiểm sát khởi kiện để bảo vệ lợi ích công trong vụ án đang giải quyết"],"a":2,"ref":"Khoản 2 Điều 2 NQ 205/2025/QH15; khoản 2 Điều 3 TTLT 09/2025"},{"id":"nq205_008","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo khoản 3 Điều 2 Nghị quyết số 205/2025/QH15, vụ án dân sự do Viện kiểm sát khởi kiện để bảo vệ lợi ích công có đặc thù gì?","o":["Không được hòa giải nhưng bị đơn được đưa ra yêu cầu phản tố","Được hòa giải nhưng bị đơn không được đưa ra yêu cầu phản tố","Được hòa giải và bị đơn được phản tố như vụ án dân sự thông thường","Không được hòa giải và bị đơn không được đưa ra yêu cầu phản tố"],"a":3,"ref":"Khoản 3 Điều 2 NQ 205/2025/QH15"},{"id":"nq205_009","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Quy định “không được hòa giải và bị đơn không được đưa ra yêu cầu phản tố” tại khoản 3 Điều 2 Nghị quyết số 205/2025/QH15 áp dụng đối với vụ án nào?","o":["Mọi vụ án dân sự công ích, kể cả vụ án bảo vệ quyền dân sự của chủ thể thuộc nhóm dễ bị tổn thương","Vụ án do cơ quan quản lý ngành, lĩnh vực khởi kiện theo kiến nghị của Viện kiểm sát","Vụ án do chủ thể thuộc nhóm dễ bị tổn thương tự khởi kiện theo thông báo của Viện kiểm sát","Vụ án dân sự do Viện kiểm sát khởi kiện để bảo vệ lợi ích công"],"a":3,"ref":"Khoản 3 Điều 2 NQ 205/2025/QH15"},{"id":"nq205_010","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo khoản 1 Điều 3 Nghị quyết số 205/2025/QH15, nhóm dễ bị tổn thương gồm bao nhiêu nhóm đối tượng?","o":["06 nhóm","04 nhóm","05 nhóm","07 nhóm"],"a":0,"ref":"Khoản 1 Điều 3 NQ 205/2025/QH15 (các điểm a, b, c, d, đ, e)"},{"id":"nq205_011","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Đối tượng nào sau đây KHÔNG thuộc nhóm dễ bị tổn thương theo khoản 1 Điều 3 Nghị quyết số 205/2025/QH15?","o":["Người khuyết tật theo quy định của Luật Người khuyết tật","Phụ nữ đang mang thai","Người thuộc hộ nghèo theo chuẩn nghèo quốc gia","Người cao tuổi theo quy định của Luật Người cao tuổi"],"a":2,"ref":"Khoản 1 Điều 3 NQ 205/2025/QH15"},{"id":"nq205_012","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo điểm d khoản 1 Điều 3 Nghị quyết số 205/2025/QH15, phụ nữ thuộc nhóm dễ bị tổn thương là phụ nữ đang mang thai hoặc đang nuôi con dưới bao nhiêu tháng tuổi?","o":["Dưới 24 tháng tuổi","Dưới 36 tháng tuổi","Dưới 72 tháng tuổi","Dưới 12 tháng tuổi"],"a":1,"ref":"Điểm d khoản 1 Điều 3 NQ 205/2025/QH15"},{"id":"nq205_013","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo điểm e khoản 1 Điều 3 Nghị quyết số 205/2025/QH15, người dân tộc thiểu số thuộc nhóm dễ bị tổn thương là người như thế nào?","o":["Tất cả người dân tộc thiểu số, không phân biệt nơi cư trú và hoàn cảnh kinh tế","Người dân tộc thiểu số cư trú tại khu vực biên giới, hải đảo theo quy định của pháp luật","Người dân tộc thiểu số cư trú tại vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn theo quy định của pháp luật","Người dân tộc thiểu số có thu nhập dưới mức lương tối thiểu vùng"],"a":2,"ref":"Điểm e khoản 1 Điều 3 NQ 205/2025/QH15"},{"id":"nq205_014","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo khoản 1 Điều 4 Thông tư liên tịch số 09/2025/TTLT, “người dân tộc thiểu số cư trú tại vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn” là người thuộc đối tượng nào?","o":["Người được cấp thẻ bảo hiểm y tế miễn phí","Người thuộc đối tượng được trợ giúp pháp lý theo quy định của Luật Trợ giúp pháp lý","Người thuộc hộ nghèo, hộ cận nghèo theo chuẩn nghèo đa chiều","Người có tên trong danh sách hưởng chính sách dân tộc do UBND cấp xã lập"],"a":1,"ref":"Khoản 1 Điều 4 TTLT 09/2025"},{"id":"nq205_015","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo khoản 2 Điều 3 Nghị quyết số 205/2025/QH15, lợi ích công thuộc các lĩnh vực nào?","o":["Đầu tư công; đất đai, tài nguyên, tài sản công khác; môi trường, hệ sinh thái; di sản văn hóa; an toàn thực phẩm, dược phẩm; bảo vệ quyền lợi người tiêu dùng","Đất đai; môi trường; giao thông; di sản văn hóa; an toàn thực phẩm; bảo hiểm thương mại","Đầu tư công; đất đai, tài nguyên; quốc phòng, an ninh; giáo dục; y tế; bảo vệ quyền lợi người tiêu dùng","Đầu tư công; tài sản công; môi trường; ngân hàng, tín dụng; dược phẩm; lao động"],"a":0,"ref":"Khoản 2 Điều 3 NQ 205/2025/QH15"},{"id":"nq205_016","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Lĩnh vực nào sau đây KHÔNG được liệt kê là lĩnh vực lợi ích công theo khoản 2 Điều 3 Nghị quyết số 205/2025/QH15?","o":["Quốc phòng, an ninh","Bảo vệ quyền lợi người tiêu dùng","Đầu tư công","Di sản văn hóa"],"a":0,"ref":"Khoản 2 Điều 3 NQ 205/2025/QH15"},{"id":"nq205_017","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo khoản 3 Điều 3 Nghị quyết số 205/2025/QH15, “trường hợp không có người khởi kiện” gồm những trường hợp nào?","o":["Trường hợp chủ thể bị xâm phạm đã chết hoặc bị Tòa án tuyên bố mất tích, không còn người thừa kế","Chỉ trường hợp pháp luật chưa quy định cơ quan, tổ chức, cá nhân nào có quyền, trách nhiệm khởi kiện","Trường hợp Tòa án đã trả lại đơn khởi kiện của đương sự hoặc đình chỉ giải quyết vụ án","Pháp luật chưa quy định cơ quan, tổ chức, cá nhân nào có quyền, trách nhiệm khởi kiện; hoặc pháp luật đã quy định nhưng cơ quan, tổ chức, cá nhân đó không khởi kiện"],"a":3,"ref":"Khoản 3 Điều 3 NQ 205/2025/QH15"},{"id":"nq205_018","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo khoản 4 Điều 3 Nghị quyết số 205/2025/QH15, quyền dân sự của nhóm dễ bị tổn thương được bảo vệ gồm những quyền nào?","o":["Quyền nhân thân và quyền tài sản","Chỉ quyền tài sản","Chỉ quyền nhân thân","Quyền nhân thân, quyền tài sản và quyền bầu cử, ứng cử"],"a":0,"ref":"Khoản 4 Điều 3 NQ 205/2025/QH15"},{"id":"nq205_019","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo khoản 3 Điều 4 Thông tư liên tịch số 09/2025/TTLT, “tài sản công” được hiểu là gì?","o":["Tài sản của doanh nghiệp có vốn nhà nước dưới 50% vốn điều lệ","Tài sản do tổ chức chính trị - xã hội tự huy động từ đóng góp của hội viên","Tài sản thuộc sở hữu chung của cộng đồng dân cư thôn, tổ dân phố do cộng đồng tự quản lý","Tài sản thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu và thống nhất quản lý theo quy định của Luật Quản lý, sử dụng tài sản công"],"a":3,"ref":"Khoản 3 Điều 4 TTLT 09/2025"},{"id":"nq205_020","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo khoản 4 Điều 4 Thông tư liên tịch số 09/2025/TTLT, “bảo vệ lợi ích công trong lĩnh vực đất đai” là gì?","o":["Giải quyết tranh chấp ranh giới, mốc giới thửa đất giữa các hộ gia đình, cá nhân liền kề","Bảo vệ quyền sử dụng đất hợp pháp của hộ gia đình, cá nhân theo quy định của Luật Đất đai","Bảo vệ quyền, lợi ích của người thuê đất trong các khu công nghiệp, cụm công nghiệp","Bảo vệ chế độ sở hữu, chế độ quản lý và chế độ sử dụng đất công theo quy định của Luật Đất đai"],"a":3,"ref":"Khoản 4 Điều 4 TTLT 09/2025"},{"id":"nq205_021","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo khoản 5 Điều 4 Thông tư liên tịch số 09/2025/TTLT, đối tượng nào sau đây được liệt kê là “tài nguyên”?","o":["Phổ tần số vô tuyến điện","Thương hiệu của doanh nghiệp nhà nước","Quyền tác giả của cá nhân","Cổ phiếu niêm yết trên sàn chứng khoán"],"a":0,"ref":"Khoản 5 Điều 4 TTLT 09/2025"},{"id":"nq205_022","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Theo khoản 2 Điều 19 Nghị quyết số 205/2025/QH15, tại thời điểm Nghị quyết hết hiệu lực mà vụ án dân sự công ích chưa kết thúc thì xử lý thế nào?","o":["Viện kiểm sát phải rút quyết định khởi kiện","Tiếp tục thực hiện theo Nghị quyết cho đến khi bản án, quyết định của Tòa án được thi hành xong","Chuyển cho cơ quan quản lý ngành, lĩnh vực khởi kiện lại từ đầu","Tòa án đình chỉ giải quyết vụ án"],"a":1,"ref":"Khoản 2 Điều 19 NQ 205/2025/QH15"},{"id":"nq205_023","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Thông tư liên tịch số 09/2025/TTLT hướng dẫn thi hành Nghị quyết số 205/2025/QH15 được ban hành ngày nào?","o":["Ngày 01/01/2026","Ngày 28/11/2025","Ngày 03/11/2025","Ngày 24/6/2025"],"a":2,"ref":"Phần đầu TTLT 09/2025 (ngày 03/11/2025)"},{"id":"nq205_024","cat":"nq205","topic":"1. Quy định chung, phạm vi, giải thích từ ngữ","q":"Thông tư liên tịch số 09/2025/TTLT hướng dẫn thi hành Nghị quyết số 205/2025/QH15 do bao nhiêu cơ quan liên tịch ban hành?","o":["10 cơ quan","11 cơ quan","12 cơ quan","13 cơ quan"],"a":3,"ref":"Phần đầu TTLT 09/2025 (VKSNDTC, TANDTC, KTNN, TTCP, BCA, BTP, BTC, BCT, BXD, BYT, BNNMT, BVHTTDL, BDTTG)"},{"id":"nq205_025","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Theo khoản 1 Điều 5 Nghị quyết số 205/2025/QH15, Tòa án nào có thẩm quyền giải quyết theo thủ tục sơ thẩm vụ án dân sự công ích?","o":["Tòa án nhân dân cấp cao","Tòa án nhân dân tối cao","Tòa án nhân dân cấp tỉnh","Tòa án nhân dân khu vực"],"a":3,"ref":"Khoản 1 Điều 5 NQ 205/2025/QH15"},{"id":"nq205_026","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Theo khoản 1 Điều 5 Nghị quyết số 205/2025/QH15, thẩm quyền của Tòa án khu vực giải quyết vụ án dân sự công ích được xác định theo thứ tự nào?","o":["Nơi xảy ra hậu quả thiệt hại → nơi xảy ra hành vi vi phạm → nơi bị đơn cư trú, làm việc hoặc có trụ sở","Nơi xảy ra hành vi vi phạm → nơi bị đơn cư trú, làm việc hoặc có trụ sở → nơi xảy ra hậu quả thiệt hại","Nơi Viện kiểm sát khởi kiện có trụ sở → nơi bị đơn cư trú → nơi xảy ra hành vi vi phạm","Nơi bị đơn cư trú, làm việc hoặc có trụ sở → nơi xảy ra hành vi vi phạm → nơi xảy ra hậu quả thiệt hại"],"a":3,"ref":"Khoản 1 Điều 5 NQ 205/2025/QH15"},{"id":"nq205_027","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Theo khoản 2 Điều 5 Nghị quyết số 205/2025/QH15, trường hợp đối tượng bị thiệt hại là bất động sản thì Tòa án nào có thẩm quyền giải quyết theo thủ tục sơ thẩm?","o":["Tòa án khu vực nơi Viện kiểm sát khởi kiện có trụ sở","Tòa án khu vực nơi bị đơn cư trú","Chỉ Tòa án khu vực nơi có bất động sản","Tòa án nhân dân cấp tỉnh nơi có bất động sản"],"a":2,"ref":"Khoản 2 Điều 5 NQ 205/2025/QH15"},{"id":"nq205_028","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Theo khoản 2 Điều 5 Nghị quyết số 205/2025/QH15, nếu bất động sản bị thiệt hại có ở nhiều nơi khác nhau thì Tòa án nào có thẩm quyền giải quyết theo thủ tục sơ thẩm?","o":["Tòa án khu vực nơi có một trong các bất động sản đó","Tòa án nhân dân cấp tỉnh nơi có nhiều bất động sản nhất","Tòa án khu vực nơi bị đơn có trụ sở","Tòa án khu vực nơi có bất động sản có giá trị lớn nhất"],"a":0,"ref":"Khoản 2 Điều 5 NQ 205/2025/QH15"},{"id":"nq205_029","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Vụ án dân sự công ích do Viện kiểm sát khởi kiện qua giải quyết vụ án, vụ việc khác (khoản 3 Điều 10 Nghị quyết số 205/2025/QH15) mà vụ án, vụ việc đó do Tòa án khu vực đã hoặc đang giải quyết thì Tòa án nào có thẩm quyền sơ thẩm?","o":["Tòa án khu vực đã hoặc đang giải quyết vụ án, vụ việc đó","Tòa án nhân dân cấp tỉnh","Tòa án khu vực nơi xảy ra hậu quả thiệt hại","Tòa án khu vực nơi bị đơn cư trú"],"a":0,"ref":"Khoản 3 Điều 5 NQ 205/2025/QH15"},{"id":"nq205_030","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Theo khoản 1 Điều 6 Nghị quyết số 205/2025/QH15, Viện kiểm sát nào có quyền khởi kiện vụ án dân sự công ích?","o":["Viện kiểm sát khu vực tương ứng với Tòa án khu vực có thẩm quyền giải quyết theo thủ tục sơ thẩm vụ án","Viện kiểm sát khu vực nơi người cung cấp thông tin cư trú hoặc làm việc","Viện kiểm sát cấp tỉnh nơi bị đơn cư trú, làm việc hoặc có trụ sở","Viện kiểm sát nhân dân tối cao trong mọi trường hợp"],"a":0,"ref":"Khoản 1 Điều 6 NQ 205/2025/QH15"},{"id":"nq205_031","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Theo khoản 2 Điều 6 Nghị quyết số 205/2025/QH15, Viện kiểm sát cấp tỉnh có thể khởi kiện hoặc tiến hành kiểm tra, xác minh rồi phân công cho Viện kiểm sát khu vực khởi kiện trong trường hợp nào?","o":["Chỉ khi vụ án có yếu tố nước ngoài và Viện kiểm sát khu vực có văn bản đề nghị chuyển vụ việc lên cấp tỉnh","Vụ án phức tạp, giá trị thiệt hại lớn hoặc xảy ra trên địa bàn nhiều khu vực hoặc có yếu tố nước ngoài hoặc khi xét thấy cần thiết","Chỉ khi Tòa án nhân dân cấp tỉnh có văn bản yêu cầu Viện kiểm sát cấp tỉnh trực tiếp khởi kiện vụ án","Chỉ khi Viện kiểm sát nhân dân tối cao có quyết định phân công bằng văn bản cho Viện kiểm sát cấp tỉnh"],"a":1,"ref":"Khoản 2 Điều 6 NQ 205/2025/QH15"},{"id":"nq205_032","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Theo khoản 3 Điều 6 Nghị quyết số 205/2025/QH15, Viện kiểm sát nhân dân tối cao có thể khởi kiện vụ án dân sự công ích trong trường hợp nào?","o":["Chỉ khi Viện kiểm sát cấp tỉnh đã kiến nghị khởi kiện nhưng cơ quan có thẩm quyền không trả lời","Chỉ khi Quốc hội hoặc Ủy ban Thường vụ Quốc hội có văn bản yêu cầu khởi kiện đối với vụ án cụ thể","Vụ án rất phức tạp, giá trị thiệt hại rất lớn hoặc xảy ra trên địa bàn nhiều tỉnh, thành phố hoặc có ảnh hưởng đến an ninh, đối ngoại hoặc khi xét thấy cần thiết","Chỉ khi vụ án xảy ra trên địa bàn nhiều khu vực trong cùng một tỉnh và có giá trị thiệt hại lớn"],"a":2,"ref":"Khoản 3 Điều 6 NQ 205/2025/QH15"},{"id":"nq205_033","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Nội dung nào sau đây KHÔNG thuộc nhiệm vụ, quyền hạn của Viện kiểm sát theo Điều 7 Nghị quyết số 205/2025/QH15?","o":["Tự mình ra quyết định áp dụng biện pháp khẩn cấp tạm thời","Yêu cầu cơ quan, tổ chức, cá nhân chấm dứt vi phạm và áp dụng biện pháp để ngăn chặn, khắc phục hậu quả","Thông báo, kiến nghị với cơ quan, tổ chức, cá nhân có quyền, trách nhiệm khởi kiện; hỗ trợ việc khởi kiện","Đình chỉ, phục hồi việc kiểm tra, xác minh"],"a":0,"ref":"Điều 7 NQ 205/2025/QH15 (khoản 3: Viện kiểm sát yêu cầu Tòa án áp dụng biện pháp khẩn cấp tạm thời)"},{"id":"nq205_034","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Biện pháp nào sau đây là biện pháp kiểm tra, xác minh, thu thập thông tin, tài liệu, chứng cứ của Viện kiểm sát theo Điều 8 Nghị quyết số 205/2025/QH15?","o":["Thu giữ thư tín, điện thoại của người vi phạm","Khám xét chỗ ở của người vi phạm","Tạm giữ người có hành vi vi phạm","Kiểm tra, đánh giá hiện trường để phát hiện dấu vết của vi phạm"],"a":3,"ref":"Khoản 6 Điều 8 NQ 205/2025/QH15"},{"id":"nq205_035","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Biện pháp nào sau đây KHÔNG thuộc các biện pháp kiểm tra, xác minh, thu thập thông tin, tài liệu, chứng cứ quy định tại Điều 8 Nghị quyết số 205/2025/QH15?","o":["Kê biên tài sản của bên vi phạm","Lấy lời khai; đối chất","Xem xét, thẩm định tại chỗ","Trưng cầu giám định; định giá tài sản"],"a":0,"ref":"Điều 8 NQ 205/2025/QH15"},{"id":"nq205_036","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Theo khoản 2 Điều 9 Nghị quyết số 205/2025/QH15, cơ quan, tổ chức, cá nhân đang lưu giữ, quản lý thông tin, tài liệu, chứng cứ phải cung cấp theo yêu cầu của Viện kiểm sát trong thời hạn bao lâu?","o":["30 ngày kể từ ngày nhận được yêu cầu","15 ngày kể từ ngày nhận được yêu cầu","07 ngày kể từ ngày nhận được yêu cầu","10 ngày làm việc kể từ ngày nhận được yêu cầu"],"a":1,"ref":"Khoản 2 Điều 9 NQ 205/2025/QH15"},{"id":"nq205_037","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Theo khoản 2 Điều 9 Nghị quyết số 205/2025/QH15, trường hợp cơ quan, tổ chức, cá nhân không cung cấp được thông tin, tài liệu, chứng cứ theo yêu cầu của Viện kiểm sát thì phải làm gì?","o":["Thông báo bằng điện thoại cho Kiểm sát viên","Trả lời bằng văn bản, nêu rõ lý do","Không phải trả lời","Chuyển yêu cầu cho cơ quan cấp trên giải quyết"],"a":1,"ref":"Khoản 2 Điều 9 NQ 205/2025/QH15"},{"id":"nq205_038","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Theo khoản 1 Điều 9 Nghị quyết số 205/2025/QH15, cơ quan, tổ chức, cá nhân khi phát hiện hành vi xâm phạm quyền dân sự của chủ thể thuộc nhóm dễ bị tổn thương hoặc lợi ích công có trách nhiệm gì?","o":["Thông báo cho Tòa án khu vực nơi xảy ra hành vi vi phạm","Tự mình khởi kiện vụ án dân sự ra Tòa án có thẩm quyền","Thông báo ngay cho cơ quan, tổ chức, cá nhân có quyền, trách nhiệm khởi kiện hoặc Viện kiểm sát","Chỉ thông báo cho Ủy ban nhân dân cấp xã nơi xảy ra vi phạm"],"a":2,"ref":"Khoản 1 Điều 9 NQ 205/2025/QH15"},{"id":"nq205_039","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Theo khoản 2 Điều 9 Thông tư liên tịch số 09/2025/TTLT, cơ quan, tổ chức, cá nhân không thực hiện yêu cầu cung cấp tài liệu, chứng cứ của Viện kiểm sát mà không có lý do chính đáng thì bị xử lý thế nào?","o":["Bị xử phạt hành chính; sau khi đã nộp phạt thì được miễn trách nhiệm cung cấp thông tin, tài liệu, chứng cứ","Tùy tính chất, mức độ có thể bị xử phạt hành chính hoặc truy cứu trách nhiệm hình sự; việc xử lý không loại trừ trách nhiệm cung cấp thông tin, tài liệu, chứng cứ","Viện kiểm sát phải khởi kiện ra Tòa án để buộc cơ quan, tổ chức, cá nhân đó cung cấp tài liệu","Chỉ bị xử lý kỷ luật nếu là cán bộ, công chức; tổ chức, cá nhân khác không bị xử lý"],"a":1,"ref":"Khoản 2 Điều 9 TTLT 09/2025"},{"id":"nq205_040","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Theo điểm a khoản 4 Điều 7 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát đang thực hành quyền công tố, kiểm sát việc giải quyết vụ án, vụ việc khác mà phát hiện thông tin vụ án dân sự công ích và Viện kiểm sát đó có thẩm quyền khởi kiện thì xử lý thế nào?","o":["Phải chuyển thông tin cho Viện kiểm sát cấp trên trực tiếp để thực hiện các biện pháp kiểm tra, xác minh","Phải chuyển thông tin cho cơ quan điều tra cùng cấp để xác minh trước khi Viện kiểm sát xem xét","Cùng với việc xác minh, thu thập chứng cứ của vụ án, vụ việc đang giải quyết, có quyền thực hiện các biện pháp kiểm tra, xác minh, thu thập chứng cứ về vụ án dân sự công ích","Phải chờ vụ án, vụ việc đang giải quyết kết thúc bằng bản án có hiệu lực mới được tiến hành xác minh"],"a":2,"ref":"Điểm a khoản 4 Điều 7 TTLT 09/2025"},{"id":"nq205_041","cat":"nq205","topic":"2. Thẩm quyền, nhiệm vụ, quyền hạn","q":"Theo điểm b khoản 4 Điều 7 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát đang kiểm sát vụ án khác phát hiện thông tin vụ án dân sự công ích nhưng KHÔNG có thẩm quyền khởi kiện thì xử lý thế nào?","o":["Lưu thông tin vào hồ sơ vụ án đang giải quyết, chỉ xử lý khi có người cung cấp thông tin mới","Tự mình thực hiện các biện pháp kiểm tra, xác minh rồi chuyển kết quả cho Viện kiểm sát có thẩm quyền","Chuyển thông tin cho Tòa án đang giải quyết vụ án để Tòa án giải quyết trong cùng vụ án","Chuyển thông tin của vụ án dân sự công ích đến Viện kiểm sát có thẩm quyền khởi kiện để thực hiện các biện pháp kiểm tra, xác minh"],"a":3,"ref":"Điểm b khoản 4 Điều 7 TTLT 09/2025"},{"id":"nq205_042","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo khoản 3 Điều 5 Thông tư liên tịch số 09/2025/TTLT, cơ quan, tổ chức, cá nhân có bao nhiêu hình thức cung cấp thông tin về vụ án dân sự công ích cho Viện kiểm sát?","o":["04 hình thức","08 hình thức","05 hình thức","06 hình thức"],"a":3,"ref":"Khoản 3 Điều 5 TTLT 09/2025 (các điểm a, b, c, d, đ, e)"},{"id":"nq205_043","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Hình thức nào sau đây là hình thức cung cấp thông tin về vụ án dân sự công ích cho Viện kiểm sát theo khoản 3 Điều 5 Thông tư liên tịch số 09/2025/TTLT?","o":["Qua đường dây nóng của Tòa án nhân dân","Qua ứng dụng định danh quốc gia (VNeID)","Qua tin nhắn điện thoại cá nhân của lãnh đạo Viện kiểm sát","Qua tài khoản mạng xã hội cá nhân của Kiểm sát viên"],"a":1,"ref":"Điểm đ khoản 3 Điều 5 TTLT 09/2025"},{"id":"nq205_044","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Nội dung nào sau đây KHÔNG thuộc các nội dung chính của thông tin được cung cấp cho Viện kiểm sát theo khoản 4 Điều 5 Thông tư liên tịch số 09/2025/TTLT?","o":["Việc xử lý, giải quyết của cơ quan, tổ chức, cá nhân có trách nhiệm (nếu có)","Hành vi vi phạm","Quyền dân sự của chủ thể là nhóm dễ bị tổn thương hoặc lợi ích công bị xâm phạm và thiệt hại","Mức án phí dự kiến Viện kiểm sát phải nộp"],"a":3,"ref":"Khoản 4 Điều 5 TTLT 09/2025"},{"id":"nq205_045","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo khoản 2 Điều 5 Thông tư liên tịch số 09/2025/TTLT, trường hợp kết luận thanh tra, kết quả kiểm toán, kết quả kiểm tra đã đưa ra biện pháp xử lý, khắc phục nhưng cơ quan có trách nhiệm không thực hiện hoặc thực hiện không đầy đủ và không có biện pháp xử lý khác thì cơ quan thanh tra, kiểm toán nhà nước, kiểm tra chuyên ngành phải làm gì?","o":["Tự mình khởi kiện vụ án dân sự công ích","Thông báo ngay cho Viện kiểm sát để xem xét, thực hiện việc khởi kiện","Chuyển hồ sơ cho Tòa án giải quyết","Báo cáo Chính phủ để chỉ định cơ quan khởi kiện"],"a":1,"ref":"Khoản 2 Điều 5 TTLT 09/2025"},{"id":"nq205_046","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo Điều 10 Nghị quyết số 205/2025/QH15, nguồn thông tin về vụ án dân sự công ích gồm bao nhiêu loại?","o":["04 loại","05 loại","03 loại","06 loại"],"a":0,"ref":"Điều 10 NQ 205/2025/QH15"},{"id":"nq205_047","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo khoản 2 Điều 6 Thông tư liên tịch số 09/2025/TTLT, khi cơ quan, tổ chức, cá nhân trình bày, nộp tài liệu trực tiếp tại Viện kiểm sát, Viện kiểm sát phải làm gì?","o":["Lập thông báo tiếp nhận theo Mẫu số 02/DSCI","Lập biên bản làm việc theo Mẫu số 10/DSCI","Lập biên bản tiếp nhận thông tin theo Mẫu số 01/DSCI","Lập biên bản giao, nhận tài liệu, chứng cứ theo Mẫu số 17/DSCI"],"a":2,"ref":"Khoản 2 Điều 6 TTLT 09/2025"},{"id":"nq205_048","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo khoản 3 Điều 6 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát tiếp nhận thông tin qua bưu chính, thư điện tử, đường dây nóng, VNeID, ứng dụng số và thông tin được cung cấp đúng quy định thì phải thông báo việc tiếp nhận cho người cung cấp trong thời hạn nào?","o":["03 ngày làm việc kể từ ngày ghi vào Sổ Tiếp nhận thông tin","02 ngày làm việc kể từ ngày nhận được thông tin","07 ngày kể từ ngày nhận được thông tin","05 ngày làm việc kể từ ngày ghi vào Sổ Tiếp nhận thông tin"],"a":0,"ref":"Khoản 3 Điều 6 TTLT 09/2025"},{"id":"nq205_049","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo khoản 4 Điều 6 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát tiếp nhận thông tin về vụ án dân sự công ích không thuộc thẩm quyền giải quyết của mình thì phải chuyển thông tin đến Viện kiểm sát có thẩm quyền trong thời hạn nào?","o":["07 ngày kể từ ngày tiếp nhận thông tin, không phải thông báo cho người cung cấp thông tin","02 ngày làm việc kể từ ngày tiếp nhận thông tin, đồng thời thông báo cho người cung cấp thông tin","03 ngày làm việc kể từ ngày tiếp nhận thông tin, đồng thời thông báo cho người cung cấp thông tin","05 ngày làm việc kể từ ngày tiếp nhận thông tin, đồng thời báo cáo Viện kiểm sát cấp trên"],"a":1,"ref":"Khoản 4 Điều 6 TTLT 09/2025"},{"id":"nq205_050","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo khoản 5 Điều 6 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát có thẩm quyền kiểm tra tính xác thực của sự việc, xem xét tài liệu, chứng cứ đã tiếp nhận trong thời hạn bao lâu kể từ ngày tiếp nhận thông tin?","o":["15 ngày","60 ngày","20 ngày","30 ngày"],"a":3,"ref":"Khoản 5 Điều 6 TTLT 09/2025; tiểu mục 3.6 Mục 3 Phần I.B HD 42/HD-VKSTC"},{"id":"nq205_051","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo H m a tiểu mục 2.1 Mục 2 Phần I.B HD 42/HD-VKSTC"},{"id":"nq205_055","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo Quy chế phối hợp tạm thời ban hành kèm Quyết định số 327/QĐ-VKSTC, trường hợp thông tin do đơn vị nghiệp vụ cùng cấp chuyển đến chưa có đủ nội dung cần thiết thì đơn vị kiểm sát án dân sự yêu cầu bổ sung trong thời hạn bao lâu?","o":["02 ngày làm việc kể từ ngày nhận được yêu cầu","10 ngày kể từ ngày nhận được yêu cầu","05 ngày làm việc kể từ ngày nhận được yêu cầu","07 ngày kể từ ngày nhận được yêu cầu"],"a":2,"ref":"Điểm a khoản 3 Điều 6 Quy chế ban hành kèm QĐ 327/QĐ-VKSTC"},{"id":"nq205_056","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo Hướng dẫn số 42/HD-VKSTC, trong thời hạn bao lâu kể từ ngày nhận được báo cáo đề xuất thụ lý vụ việc dân sự công ích của Kiểm sát viên, Viện trưởng Viện kiểm sát nhân dân khu vực phải cho ý kiến?","o":["02 ngày làm việc","01 ngày làm việc","03 ngày làm việc","05 ngày làm việc"],"a":0,"ref":"Tiểu mục 3.1 Mục 3 Phần I.B HD 42/HD-VKSTC"},{"id":"nq205_057","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo Hướng dẫn số 42/HD-VKSTC, trường hợp người có thẩm quyền không đồng ý thụ lý vụ việc dân sự công ích thì ghi vào Sổ Tiếp nhận thông tin nội dung gì?","o":["“Chấm dứt xử lý thông tin do không có căn cứ” và thông báo cho người đã cung cấp thông tin","“Đình chỉ việc kiểm tra, xác minh” và gửi quyết định cho người đã cung cấp thông tin","“Chuyển cơ quan điều tra xử lý” và báo cáo Viện kiểm sát cấp trên","“Tạm dừng kiểm tra, xác minh” và cập nhật vào Nền tảng quản lý án công ích"],"a":0,"ref":"Tiểu mục 3.1 Mục 3 Phần I.B HD 42/HD-VKSTC"},{"id":"nq205_058","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo tiểu mục 3.3 Mục 3 Phần I.B Hướng dẫn số 42/HD-VKSTC, nội dung nào sau đây là một trong các vấn đề Kiểm sát viên phải làm rõ và ghi trong báo cáo đề xuất để xác định tính xác thực của sự việc?","o":["Yêu cầu phản tố dự kiến của bị đơn","Tính khả thi của việc khởi kiện vụ án dân sự công ích","Ý kiến của Tòa án về việc thụ lý vụ án","Mức án phí Viện kiểm sát phải tạm ứng"],"a":1,"ref":"Điểm c tiểu mục 3.3 Mục 3 Phần I.B HD 42/HD-VKSTC"},{"id":"nq205_059","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo Hướng dẫn số 42/HD-VKSTC, trường hợp thành lập “Tổ kiểm tra thông tin” để kiểm tra tính xác thực của sự việc thì ai là Tổ trưởng?","o":["Trưởng phòng 9 Viện kiểm sát nhân dân cấp tỉnh","Kiểm sát viên được phân công xử lý thông tin","Chánh Văn phòng Viện kiểm sát","Phó Viện trưởng phụ trách công tác kiểm sát án dân sự"],"a":1,"ref":"Tiểu mục 3.4 Mục 3 Phần I.B HD 42/HD-VKSTC"},{"id":"nq205_060","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo Hướng dẫn số 20/HD-VKSTC (bổ sung điểm c tiểu mục 3.1 Mục 3 Phần I.B Hướng dẫn số 42/HD-VKSTC), trường hợp qua kiểm tra, xác minh ban đầu mà bên vi phạm tự nguyện chấm dứt toàn bộ hành vi vi phạm, hoàn thành bồi thường, khắc phục hậu quả và người có thẩm quyền đồng ý đề xuất không thụ lý thì ghi vào Sổ tiếp nhận thông tin nội dung gì?","o":["“Đình chỉ việc kiểm tra, xác minh”","“Tạm dừng kiểm tra, xác minh”","“Thụ lý lại vụ việc”","“Chấm dứt xử lý thông tin do vụ việc đã hoàn thành”"],"a":3,"ref":"Khoản 1 Mục IV HD 20/HD-VKSTC"},{"id":"nq205_061","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo Hướng dẫn số 20/HD-VKSTC, Viện kiểm sát nhập hai hoặc nhiều thông tin, vụ việc dân sự công ích thành một vụ việc để giải quyết khi nào?","o":["Khi Kiểm sát viên được phân công đề xuất nhằm giảm số lượng vụ việc phải thống kê, báo cáo và rút ngắn thời hạn giải quyết","Khi các thông tin do cùng một cơ quan, tổ chức, cá nhân cung cấp, không phụ thuộc vào nội dung, chủ thể vi phạm hay quyền, lợi ích cần bảo vệ","Khi các vụ việc xảy ra trên cùng địa bàn một xã, phường và được tiếp nhận trong cùng một tháng, kể cả khi do các chủ thể khác nhau vi phạm","Khi các thông tin, vụ việc có cùng hoặc có liên quan chặt chẽ về chủ thể vi phạm, hành vi vi phạm, thiệt hại, quyền hoặc lợi ích cần bảo vệ và việc nhập bảo đảm giải quyết đầy đủ, toàn diện, không làm sai thẩm quyền, không kéo dài bất hợp lý thời hạn"],"a":3,"ref":"Tiểu mục 1a.1 (bổ sung vào HD 42) theo khoản 2 Mục IV HD 20/HD-VKSTC"},{"id":"nq205_062","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo Quy chế phối hợp tạm thời ban hành kèm Quyết định số 327/QĐ-VKSTC, việc chuyển thông tin về vụ việc dân sự công ích giữa các Viện kiểm sát được thực hiện bằng hình thức nào?","o":["Bằng thư điện tử cá nhân của Kiểm sát viên","Bằng văn bản của Viện kiểm sát","Bằng điện thoại giữa các Kiểm sát viên","Bằng Phiếu chuyển thông tin Mẫu số 01/QCPH-DSCI"],"a":1,"ref":"Khoản 1 Điều 6 Quy chế ban hành kèm QĐ 327/QĐ-VKSTC"},{"id":"nq205_063","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo Quy chế phối hợp tạm thời ban hành kèm Quyết định số 327/QĐ-VKSTC, Viện kiểm sát ngoài 06 địa phương thí điểm khi phát hiện hoặc tiếp nhận thông tin về vụ án dân sự công ích phải làm gì?","o":["Chuyển ngay cho Viện kiểm sát có thẩm quyền tại địa phương thí điểm hoặc Viện kiểm sát nhân dân tối cao; lập sổ theo dõi riêng","Chuyển thông tin cho Tòa án nơi xảy ra vi phạm và thông báo cho người cung cấp thông tin","Tự thụ lý, xác minh và khởi kiện vụ án tại Tòa án khu vực nơi xảy ra hành vi vi phạm","Lưu hồ sơ tại đơn vị, chờ Nghị quyết được áp dụng trên toàn quốc mới xử lý"],"a":0,"ref":"Khoản 2 Điều 19 Quy chế ban hành kèm QĐ 327/QĐ-VKSTC"},{"id":"nq205_064","cat":"nq205","topic":"3. Tiếp nhận, xử lý thông tin, thụ lý","q":"Theo Quy chế phối hợp tạm thời ban hành kèm Quyết định số 327/QĐ-VKSTC, công chức đơn vị nghiệp vụ phát hiện thông tin có dấu hiệu thuộc phạm vi Nghị quyết số 205/2025/QH15 trong quá trình thực hiện nhiệm vụ thì xử lý theo trình tự nào?","o":["Chuyển bản chính hồ sơ vụ án đang kiểm sát cho đơn vị kiểm sát án dân sự để thụ lý ngay","Tự liên hệ với người vi phạm để yêu cầu khắc phục, sau đó mới báo cáo Lãnh đạo đơn vị","Báo cáo Lãnh đạo đơn vị; sau khi được chấp thuận, đơn vị lập Phiếu chuyển thông tin gửi kèm bản sao tài liệu, chứng cứ cho đơn vị kiểm sát án dân sự cùng cấp","Trực tiếp ban hành quyết định yêu cầu cơ quan, tổ chức, cá nhân vi phạm chấm dứt hành vi và khắc phục hậu quả"],"a":2,"ref":"Khoản 1 Điều 6 Quy chế ban hành kèm QĐ 327/QĐ-VKSTC"},{"id":"nq205_065","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo khoản 2 Điều 8 Thông tư liên tịch số 09/2025/TTLT, khi Viện kiểm sát tự thu thập tài liệu thông qua việc sao chụp tài liệu trong hồ sơ vụ án, vụ việc khác mà Viện kiểm sát đã hoặc đang kiểm sát, giải quyết thì phải bảo đảm yêu cầu gì?","o":["Ghi rõ nguồn gốc tài liệu, chứng cứ, thời gian, địa điểm và người thực hiện","Chỉ được sao chụp hồ sơ vụ án đã có bản án có hiệu lực","Phải được công chứng bản sao trước khi sử dụng","Phải có văn bản đồng ý của Chánh án Tòa án"],"a":0,"ref":"Khoản 2 Điều 8 TTLT 09/2025"},{"id":"nq205_066","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo khoản 3 Điều 8 Thông tư liên tịch số 09/2025/TTLT, tài liệu, chứng cứ được thu thập hợp pháp trong quá trình giải quyết vụ án, vụ việc khác được sử dụng như thế nào trong vụ án dân sự công ích?","o":["Chỉ được sử dụng khi được Tòa án đồng ý trước","Chỉ được dùng để tham khảo","Không được sử dụng làm chứng cứ","Có thể được sử dụng làm chứng cứ trong vụ án dân sự công ích"],"a":3,"ref":"Khoản 3 Điều 8 TTLT 09/2025"},{"id":"nq205_067","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, hết thời hạn mà Viện kiểm sát không nhận được tài liệu, chứng cứ theo yêu cầu và cơ quan được yêu cầu không có văn bản nêu rõ lý do thì Kiểm sát viên xử lý thế nào?","o":["Ban hành ngay quyết định khởi kiện vì cơ quan lưu giữ tài liệu không hợp tác với Viện kiểm sát","Đình chỉ việc kiểm tra, xác minh do không thu thập được tài liệu, chứng cứ cần thiết","Chuyển ngay hồ sơ cho cơ quan điều tra để khởi tố về hành vi không cung cấp tài liệu","Trao đổi để nắm rõ tình hình, báo cáo người có thẩm quyền ban hành văn bản đôn đốc hoặc đề xuất xác minh trực tiếp tại nơi lưu giữ tài liệu, nếu cần thiết"],"a":3,"ref":"Điểm b tiểu mục 4.3 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_068","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo khoản 3 Điều 10 Thông tư liên tịch số 09/2025/TTLT, trường hợp kết luận giám định chưa đầy đủ, chưa rõ ràng thì trước khi quyết định trưng cầu giám định bổ sung hoặc giám định lại, Viện kiểm sát làm gì?","o":["Bác bỏ kết luận giám định và sử dụng ý kiến của Kiểm sát viên được phân công","Tự điều chỉnh nội dung kết luận giám định cho phù hợp với tài liệu, chứng cứ đã thu thập","Yêu cầu Tòa án có thẩm quyền ra quyết định trưng cầu giám định lại","Yêu cầu người giám định giải thích kết luận giám định bằng văn bản hoặc trực tiếp nghe người giám định trình bày"],"a":3,"ref":"Khoản 3 Điều 10 TTLT 09/2025"},{"id":"nq205_069","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo khoản 1 Điều 11 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát quyết định định giá tài sản bằng cách nào?","o":["Đề nghị Tòa án có thẩm quyền thành lập Hội đồng định giá trước khi khởi kiện","Kiểm sát viên được phân công tự xác định giá tài sản theo giá thị trường","Thành lập Hội đồng định giá hoặc yêu cầu cơ quan, tổ chức, cá nhân có thẩm quyền xác định giá tài sản","Chỉ bằng cách thành lập Hội đồng định giá do Viện trưởng Viện kiểm sát làm Chủ tịch Hội đồng"],"a":2,"ref":"Khoản 1 Điều 11 TTLT 09/2025"},{"id":"nq205_070","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo khoản 3 Điều 12 Thông tư liên tịch số 09/2025/TTLT, việc trưng cầu ý kiến chuyên môn bằng hình thức trao đổi trực tiếp phải được thực hiện như thế nào?","o":["Không cần lập biên bản; chỉ cần ghi âm toàn bộ buổi trao đổi và lưu vào hồ sơ vụ việc","Lập biên bản trao đổi, ghi rõ ý kiến và có chữ ký của người đại diện cơ quan, tổ chức hoặc cá nhân có chuyên môn; có thể ghi âm hoặc ghi hình có âm thanh","Phải có Thẩm phán Tòa án khu vực tham dự và ký vào biên bản trao đổi","Chỉ cần Kiểm sát viên ghi chép vào sổ tay công tác, không cần chữ ký của người được trưng cầu"],"a":1,"ref":"Khoản 3 Điều 12 TTLT 09/2025"},{"id":"nq205_071","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, trường hợp Viện kiểm sát trưng cầu ý kiến của nhiều cơ quan, tổ chức, cá nhân có chuyên môn về cùng một vấn đề mà các ý kiến không thống nhất hoặc mâu thuẫn nhau thì Kiểm sát viên xử lý thế nào?","o":["Sử dụng ý kiến của cơ quan có cấp hành chính cao hơn làm chứng cứ và loại bỏ các ý kiến của cơ quan cấp dưới","Có thể yêu cầu các bên trình bày trực tiếp hoặc bằng văn bản về cơ sở, phương pháp đưa ra ý kiến để so sánh, kết hợp với tài liệu, chứng cứ khác xác định ý kiến nào là chứng cứ","Loại bỏ toàn bộ các ý kiến chuyên môn đã có và bắt buộc chuyển sang trưng cầu giám định tư pháp theo Luật Giám định tư pháp","Sử dụng ý kiến của đa số cơ quan, tổ chức, cá nhân được trưng cầu làm chứng cứ, các ý kiến thiểu số chỉ để tham khảo"],"a":1,"ref":"Điểm đ tiểu mục 4.6 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_072","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo khoản 2 Điều 13 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát có thể tiến hành đối chất khi nào?","o":["Bắt buộc phải tổ chức đối chất trong mọi vụ việc trước khi ban hành quyết định khởi kiện","Khi Tòa án có văn bản yêu cầu Viện kiểm sát đối chất trước khi thụ lý vụ án","Khi bên có hành vi vi phạm có văn bản yêu cầu Viện kiểm sát tổ chức đối chất","Khi xét thấy có mâu thuẫn trong lời khai của các chủ thể đã được lấy lời khai"],"a":3,"ref":"Khoản 2 Điều 13 TTLT 09/2025"},{"id":"nq205_073","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, kế hoạch lấy lời khai cần dự kiến thành phần thực hiện việc lấy lời khai như thế nào?","o":["Phải có ít nhất 03 người, trong đó có lãnh đạo Viện","Phải có đại diện Tòa án tham gia","Nên có ít nhất 02 người","Chỉ cần 01 Kiểm sát viên"],"a":2,"ref":"Điểm a tiểu mục 4.7 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_074","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, việc lấy lời khai trong vụ việc dân sự công ích được tiến hành như thế nào?","o":["Tiến hành tập trung với tất cả người làm chứng","Chỉ lấy lời khai của người đại diện theo pháp luật","Tiến hành độc lập với từng người","Tiến hành đồng thời với tất cả những người có liên quan"],"a":2,"ref":"Điểm d tiểu mục 4.7 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_075","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, việc lấy lời khai của người dưới 18 tuổi, người bị hạn chế năng lực hành vi dân sự, người có khó khăn trong nhận thức, làm chủ hành vi phải bảo đảm yêu cầu gì?","o":["Có mặt người đại diện hợp pháp hoặc người đang quản lý, trông nom họ; nếu không có hoặc không xác định được thì phải có người chứng kiến","Phải có mặt đại diện cơ quan Công an và đại diện nhà trường nơi người đó học tập","Phải có mặt đại diện Tòa án nhân dân khu vực nơi người được lấy lời khai cư trú","Chỉ cần có mặt Kiểm sát viên và người ghi biên bản; không cần người đại diện hoặc người chứng kiến"],"a":0,"ref":"Điểm e tiểu mục 4.7 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_076","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, việc lấy lời khai của người không biết tiếng Việt (chỉ biết tiếng dân tộc thiểu số hoặc tiếng nước ngoài) phải có ai tham gia?","o":["Người phiên dịch theo quy định của Bộ luật Tố tụng dân sự","Luật sư của người được lấy lời khai","Đại diện Ủy ban nhân dân cấp xã","Người đại diện theo ủy quyền"],"a":0,"ref":"Điểm e tiểu mục 4.7 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_077","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, trường hợp lấy lời khai ngoài trụ sở Viện kiểm sát thì phải đáp ứng yêu cầu gì?","o":["Lập biên bản ngay tại nơi lấy lời khai, có người làm chứng hoặc xác nhận của UBND cấp xã hoặc Công an cấp xã hoặc cơ quan, tổ chức nơi lấy lời khai","Chỉ cần ghi âm, ghi hình toàn bộ buổi lấy lời khai; không cần lập biên bản tại chỗ","Phải có Thẩm phán chứng kiến và ký xác nhận vào biên bản ghi lời khai","Phải có quyết định của Viện trưởng Viện kiểm sát cấp trên cho phép lấy lời khai ngoài trụ sở"],"a":0,"ref":"Điểm g tiểu mục 4.7 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_078","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, biên bản ghi lời khai được ghi thành nhiều trang thì phải thực hiện thế nào?","o":["Chỉ ký vào trang cuối","Chỉ đóng dấu vào trang đầu","Ký vào từng trang và đóng dấu giáp lai","Đánh số trang, không cần ký"],"a":2,"ref":"Điểm đ tiểu mục 4.7 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_079","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo khoản 1 Điều 14 Thông tư liên tịch số 09/2025/TTLT, khi quyết định xem xét, thẩm định tại chỗ, Viện kiểm sát phải làm gì?","o":["Giữ bí mật, không thông báo cho người có liên quan","Chỉ thông báo sau khi đã tiến hành xong","Đề nghị Tòa án ra quyết định xem xét, thẩm định","Báo trước việc xem xét, thẩm định tại chỗ để người có liên quan biết và chứng kiến"],"a":3,"ref":"Khoản 1 Điều 14 TTLT 09/2025"},{"id":"nq205_080","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, trường hợp cần đề nghị UBND cấp xã, Công an cấp xã hỗ trợ, ngăn chặn hành vi cản trở việc xem xét, thẩm định tại chỗ thì Viện kiểm sát gửi công văn đề nghị trước ngày tiến hành ít nhất bao nhiêu ngày?","o":["01 ngày","07 ngày","03 ngày","05 ngày"],"a":3,"ref":"Điểm e tiểu mục 4.9 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_081","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo khoản 1 Điều 15 Thông tư liên tịch số 09/2025/TTLT, khi kiểm tra, đánh giá hiện trường, Viện kiểm sát có thể thực hiện hoạt động nào sau đây?","o":["Phong tỏa tài khoản và kê biên tài sản của người vi phạm để bảo đảm thi hành án","Tạm giữ người có hành vi vi phạm tại hiện trường để lấy lời khai","Khám xét người, chỗ ở, phương tiện của người có hành vi vi phạm để thu giữ vật chứng","Dựng lại hiện trường, tổ chức diễn lại hành vi, tình huống và tiến hành các hoạt động thực nghiệm cần thiết"],"a":3,"ref":"Khoản 1 Điều 15 TTLT 09/2025"},{"id":"nq205_082","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, trường hợp cần thu thập chứng cứ bằng hình thức chụp ảnh toàn cảnh từ trên cao khi kiểm tra, đánh giá hiện trường thì Viện kiểm sát có thể sử dụng phương tiện nào?","o":["Chỉ được sử dụng máy ảnh cầm tay, không được chụp từ trên cao","Phải thuê đơn vị đo đạc bản đồ thực hiện","Thiết bị bay không người lái","Phải đề nghị Tòa án thực hiện"],"a":2,"ref":"Điểm d tiểu mục 4.10 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_083","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, trường hợp cần thiết, việc đề nghị UBND cấp xã, Công an cấp xã hỗ trợ ngăn chặn hành vi cản trở việc kiểm tra, đánh giá hiện trường có thể được thực hiện trong khoảng thời gian nào?","o":["Trong vòng 24 giờ trước khi tiến hành kiểm tra, đánh giá hiện trường","Phải trước ít nhất 10 ngày","Phải trước ít nhất 15 ngày","Chỉ được thực hiện sau khi kết thúc kiểm tra"],"a":0,"ref":"Điểm e tiểu mục 4.10 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_084","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, Viện kiểm sát được ủy thác phải hoàn thành việc kiểm tra, xác minh, thu thập tài liệu, chứng cứ được ủy thác trong thời hạn bao lâu?","o":["15 ngày kể từ ngày nhận được quyết định ủy thác","02 tháng kể từ ngày nhận được quyết định ủy thác","01 tháng kể từ ngày nhận được quyết định ủy thác","30 ngày làm việc kể từ ngày nhận được quyết định ủy thác"],"a":2,"ref":"Điểm c tiểu mục 4.11 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_085","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, Viện kiểm sát được ủy thác kiểm tra, xác minh, thu thập tài liệu, chứng cứ có bắt buộc phải là Viện kiểm sát ở tỉnh, thành phố thực hiện thí điểm hay không?","o":["Bắt buộc phải là Viện kiểm sát ở tỉnh, thành phố thí điểm","Chỉ được ủy thác cho Viện kiểm sát cấp trên","Không bắt buộc","Chỉ được ủy thác cho Viện kiểm sát cùng tỉnh"],"a":2,"ref":"Điểm a tiểu mục 4.11 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_086","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Điều 16 Thông tư liên tịch số 09/2025/TTLT, trường hợp việc xác minh, thu thập thông tin, tài liệu, chứng cứ phải tiến hành ở nước ngoài thì Viện kiểm sát thực hiện thế nào?","o":["Không được thu thập chứng cứ ở nước ngoài","Yêu cầu tương trợ tư pháp về dân sự theo quy định của pháp luật về tương trợ tư pháp dân sự","Cử Kiểm sát viên trực tiếp sang nước ngoài xác minh","Ủy thác cho cơ quan đại diện của Việt Nam ở nước ngoài tự quyết định"],"a":1,"ref":"Điều 16 TTLT 09/2025"},{"id":"nq205_087","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, tài liệu, chứng cứ bằng tiếng dân tộc thiểu số, tiếng nước ngoài được Viện kiểm sát tiếp nhận khi nào?","o":["Tiếp nhận ngay, Viện kiểm sát tự dịch sau","Khi có kèm theo bản dịch sang tiếng Việt được công chứng hoặc chứng thực hợp pháp","Không tiếp nhận trong mọi trường hợp","Chỉ tiếp nhận nếu người nộp có mặt giải thích nội dung"],"a":1,"ref":"Điểm b tiểu mục 4.2 Mục 4 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_088","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, nội dung nào sau đây là một trong các vấn đề cơ bản cần làm rõ khi xác minh, thu thập tài liệu, chứng cứ của vụ việc dân sự công ích?","o":["Ý kiến của Hội đồng xét xử về yêu cầu khởi kiện","Mức án phí sơ thẩm dự kiến","Quan điểm của luật sư bảo vệ bị đơn","Quan hệ nhân quả giữa hành vi vi phạm và thực tế tình trạng thiệt hại"],"a":3,"ref":"Mục 3 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_089","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Hướng dẫn số 42/HD-VKSTC, trường hợp Viện kiểm sát có thẩm quyền khởi kiện phân công Viện kiểm sát cấp dưới xác minh, thu thập tài liệu, chứng cứ thì quyết định phân công được ban hành trong thời hạn nào?","o":["02 ngày làm việc kể từ ngày nhận được báo cáo đề xuất của Kiểm sát viên","15 ngày kể từ ngày thụ lý vụ việc dân sự công ích","05 ngày làm việc kể từ ngày ghi vào Sổ Tiếp nhận thông tin","03 ngày làm việc kể từ ngày thụ lý vụ việc dân sự công ích"],"a":3,"ref":"Điểm a tiểu mục 1.4 Mục 1 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_090","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo Quy chế phối hợp tạm thời ban hành kèm Quyết định số 327/QĐ-VKSTC, các biện pháp kiểm tra, xác minh, thu thập tài liệu, chứng cứ do chủ thể nào thực hiện?","o":["Công chức được cử phối hợp tự quyết định thực hiện","Bất kỳ đơn vị nghiệp vụ nào phát hiện thông tin","Các Hội đã ký quy chế phối hợp với Viện kiểm sát","Chỉ do Viện kiểm sát, Kiểm sát viên được phân công thực hiện theo đúng thẩm quyền"],"a":3,"ref":"Khoản 2 Điều 8 Quy chế ban hành kèm QĐ 327/QĐ-VKSTC"},{"id":"nq205_091","cat":"nq205","topic":"4. Kiểm tra, xác minh, thu thập tài liệu, chứng cứ","q":"Theo khoản 6 Điều 17 Thông tư liên tịch số 09/2025/TTLT, tài liệu, chứng cứ Viện kiểm sát đã thu thập trước khi đình chỉ việc kiểm tra, xác minh được xử lý thế nào sau khi phục hồi việc kiểm tra, xác minh?","o":["Tiếp tục được sử dụng sau khi Viện kiểm sát phục hồi việc kiểm tra, xác minh","Phải trả lại cho cơ quan, tổ chức, cá nhân đã cung cấp trước khi phục hồi","Không còn giá trị chứng minh, phải thu thập lại từ đầu sau khi phục hồi","Chỉ được sử dụng khi Tòa án đồng ý bằng văn bản"],"a":0,"ref":"Khoản 6 Điều 17 TTLT 09/2025"},{"id":"nq205_092","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Trường hợp nào sau đây KHÔNG phải là căn cứ để Viện kiểm sát đình chỉ việc kiểm tra, xác minh theo khoản 1 Điều 12 Nghị quyết số 205/2025/QH15?","o":["Đã có người khởi kiện vụ án","Hành vi xâm phạm đã chấm dứt và hậu quả đã được khắc phục","Bên có hành vi vi phạm có văn bản đề nghị Viện kiểm sát không khởi kiện","Không có hành vi xâm phạm quyền dân sự của chủ thể thuộc nhóm dễ bị tổn thương hoặc lợi ích công"],"a":2,"ref":"Khoản 1 Điều 12 NQ 205/2025/QH15"},{"id":"nq205_093","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Theo điểm d khoản 1 Điều 12 Nghị quyết số 205/2025/QH15, Viện kiểm sát đình chỉ việc kiểm tra, xác minh khi nào?","o":["Chủ thể thuộc nhóm dễ bị tổn thương bị xâm phạm quyền dân sự hoặc người đại diện hợp pháp của họ đề nghị không khởi kiện","Người đã cung cấp thông tin cho Viện kiểm sát có văn bản rút lại toàn bộ thông tin đã cung cấp","Cơ quan quản lý ngành, lĩnh vực có văn bản đề nghị gia hạn thời hạn trả lời kiến nghị khởi kiện","Bên vi phạm có văn bản cam kết bồi thường thiệt hại nhưng chưa thực hiện việc bồi thường trên thực tế"],"a":0,"ref":"Điểm d khoản 1 Điều 12 NQ 205/2025/QH15"},{"id":"nq205_094","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Theo điểm đ khoản 1 Điều 12 Nghị quyết số 205/2025/QH15, trường hợp cá nhân vi phạm đã chết thì Viện kiểm sát đình chỉ việc kiểm tra, xác minh khi nào?","o":["Khi không có người thừa kế quyền, nghĩa vụ của họ","Trong mọi trường hợp cá nhân vi phạm đã chết","Khi người thừa kế đang cư trú ở nước ngoài","Khi người thừa kế chưa đủ 18 tuổi"],"a":0,"ref":"Điểm đ khoản 1 Điều 12 NQ 205/2025/QH15"},{"id":"nq205_095","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Theo khoản 2 Điều 12 Nghị quyết số 205/2025/QH15, Viện kiểm sát gửi quyết định đình chỉ việc kiểm tra, xác minh cho cơ quan, tổ chức, cá nhân có liên quan trong thời hạn nào?","o":["05 ngày làm việc kể từ ngày ra quyết định","02 ngày làm việc kể từ ngày ra quyết định","07 ngày kể từ ngày ra quyết định","03 ngày làm việc kể từ ngày ra quyết định"],"a":3,"ref":"Khoản 2 Điều 12 NQ 205/2025/QH15"},{"id":"nq205_096","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Theo khoản 3 Điều 12 Nghị quyết số 205/2025/QH15, Viện kiểm sát quyết định phục hồi việc kiểm tra, xác minh trong trường hợp nào?","o":["Đã đình chỉ do cá nhân vi phạm chết mà không có người thừa kế, sau đó phát hiện người chết còn để lại tài sản chưa được xác lập quyền sở hữu","Đã đình chỉ do chủ thể thuộc nhóm dễ bị tổn thương hoặc người đại diện hợp pháp đề nghị không khởi kiện, nhưng sau đó có căn cứ xác định việc đó là do bị lừa dối, đe dọa, cưỡng ép hoặc nhầm lẫn","Bên vi phạm có văn bản đề nghị Viện kiểm sát xem xét lại để vụ việc được giải quyết bằng thủ tục khởi kiện tại Tòa án","Đã đình chỉ do không có hành vi xâm phạm, nhưng người cung cấp thông tin tiếp tục khiếu nại quyết định đình chỉ lên Viện kiểm sát cấp trên"],"a":1,"ref":"Khoản 3 Điều 12 NQ 205/2025/QH15"},{"id":"nq205_097","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Theo khoản 2 Điều 17 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát chỉ đình chỉ việc kiểm tra, xác minh với lý do “đã có người khởi kiện vụ án” khi nào?","o":["Khi người khởi kiện đã nộp đơn, chưa cần Tòa án thụ lý","Khi người khởi kiện đã nộp đơn khởi kiện và được Tòa án thụ lý vụ án","Khi người khởi kiện có văn bản cam kết sẽ khởi kiện","Khi cơ quan được kiến nghị trả lời đồng ý khởi kiện"],"a":1,"ref":"Khoản 2 Điều 17 TTLT 09/2025"},{"id":"nq205_098","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Theo khoản 3 Điều 17 Thông tư liên tịch số 09/2025/TTLT, sau khi đã đình chỉ việc kiểm tra, xác minh vì đã có người khởi kiện, trường hợp nào sau đây Viện kiểm sát thụ lý lại vụ việc?","o":["Chủ thể đã khởi kiện vụ án để bảo vệ lợi ích công rút đơn khởi kiện khi lợi ích công chưa được bảo vệ","Người khởi kiện yêu cầu thay đổi Thẩm phán và đề nghị Viện kiểm sát hỗ trợ","Tòa án đã xét xử sơ thẩm vụ án do chủ thể khác khởi kiện và có đương sự kháng cáo","Bị đơn trong vụ án do chủ thể khác khởi kiện yêu cầu Viện kiểm sát tham gia tố tụng"],"a":0,"ref":"Điểm a khoản 3 Điều 17 TTLT 09/2025"},{"id":"nq205_099","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Theo Hướng dẫn số 42/HD-VKSTC, vụ việc dân sự công ích được thụ lý lại theo khoản 3 Điều 17 Thông tư liên tịch số 09/2025/TTLT được tính như thế nào?","o":["Được tính là vụ việc phục hồi","Được tính là vụ việc mới","Được tính chung với vụ việc đã đình chỉ","Không được thống kê"],"a":1,"ref":"Tiểu mục 5.2 Mục 5 Phần II.B HD 42/HD-VKSTC"},{"id":"nq205_100","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Theo khoản 5 Điều 17 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát ban hành quyết định chấm dứt việc kiểm tra, xác minh khi nào?","o":["Khi đã có người khởi kiện vụ án và được Tòa án thụ lý vụ án","Khi chủ thể thuộc nhóm dễ bị tổn thương là đối tượng được bảo vệ chết hoặc lợi ích công được bảo vệ không còn tồn tại","Khi hết thời hạn 30 ngày kiểm tra, xác minh mà chưa xác định được bên vi phạm","Khi bên vi phạm đã chấm dứt hành vi vi phạm và khắc phục xong hậu quả thiệt hại"],"a":1,"ref":"Khoản 5 Điều 17 TTLT 09/2025"},{"id":"nq205_101","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Theo khoản 4 Điều 17 Thông tư liên tịch số 09/2025/TTLT, trường hợp cơ quan, tổ chức được kiến nghị khởi kiện đề nghị áp dụng biện pháp xử lý khác và được Viện kiểm sát đồng ý, nhưng biện pháp đó không được thực hiện đúng hoặc không hiệu quả thì Viện kiểm sát xử lý thế nào?","o":["Chấm dứt việc kiểm tra, xác minh","Tiếp tục tiến hành việc kiểm tra, xác minh","Chuyển hồ sơ cho Tòa án giải quyết","Đình chỉ việc kiểm tra, xác minh"],"a":1,"ref":"Khoản 4 Điều 17 TTLT 09/2025"},{"id":"nq205_102","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Theo Hướng dẫn số 20/HD-VKSTC (bổ sung tiểu mục 5.6 Hướng dẫn số 42/HD-VKSTC), Viện kiểm sát có thể tạm dừng việc kiểm tra, xác minh vụ việc dân sự công ích trong trường hợp nào?","o":["Kiểm sát viên được phân công nghỉ phép, đi học hoặc được điều động làm nhiệm vụ khác mà chưa có Kiểm sát viên thay thế","Đã thụ lý vụ việc nhưng cần chờ kết quả giải quyết vụ án, vụ việc khác có liên quan trực tiếp làm căn cứ xác định hành vi vi phạm, thiệt hại, chủ thể chịu trách nhiệm dân sự hoặc điều kiện khởi kiện","Chưa thụ lý vụ việc nhưng thông tin tiếp nhận chưa có đủ các nội dung cần thiết và người cung cấp chưa bổ sung","Bên vi phạm có văn bản đề nghị tạm dừng để thương lượng, hòa giải với chủ thể bị xâm phạm về mức bồi thường thiệt hại"],"a":1,"ref":"Khoản 3 Mục IV HD 20/HD-VKSTC"},{"id":"nq205_103","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Theo Hướng dẫn số 20/HD-VKSTC, tính chất của việc tạm dừng kiểm tra, xác minh vụ việc dân sự công ích là gì?","o":["Là quyết định tố tụng phải gửi cho Tòa án và các đương sự trong thời hạn 03 ngày làm việc","Là biện pháp quản lý nghiệp vụ, không làm chấm dứt việc xử lý thông tin, không thay thế các căn cứ đình chỉ hoặc chấm dứt kiểm tra, xác minh","Làm chấm dứt việc xử lý thông tin và phải thụ lý lại khi có căn cứ tiếp tục","Là một căn cứ đình chỉ việc kiểm tra, xác minh, phải ban hành quyết định theo mẫu"],"a":1,"ref":"Khoản 3 Mục IV HD 20/HD-VKSTC"},{"id":"nq205_104","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Theo Hướng dẫn số 20/HD-VKSTC, trường hợp người có thẩm quyền đồng ý tạm dừng kiểm tra, xác minh thì công chức thực hiện việc gì?","o":["Ghi vào Sổ thụ lý vụ việc dân sự công ích và cập nhật vào Nền tảng quản lý án công ích","Ban hành quyết định đình chỉ theo Mẫu số 20/DSCI","Thông báo cho Tòa án tạm đình chỉ vụ án","Ghi vào Sổ Tiếp nhận thông tin là “chấm dứt xử lý thông tin”"],"a":0,"ref":"Khoản 3 Mục IV HD 20/HD-VKSTC"},{"id":"nq205_105","cat":"nq205","topic":"5. Đình chỉ, chấm dứt, phục hồi, tạm dừng","q":"Theo Hướng dẫn số 20/HD-VKSTC, khi căn cứ tạm dừng kiểm tra, xác minh không còn mà các vấn đề của vụ việc dân sự công ích chưa được giải quyết đầy đủ thì Viện kiểm sát xử lý thế nào?","o":["Đình chỉ việc kiểm tra, xác minh vì đã hết căn cứ tạm dừng","Kết thúc vụ việc, lưu hồ sơ và chuyển kết quả cho cơ quan đã giải quyết vụ án liên quan","Tiếp tục kiểm tra, xác minh và thực hiện các bước tiếp theo của quy trình dân sự công ích","Chấm dứt việc kiểm tra, xác minh và thông báo cho người cung cấp thông tin"],"a":2,"ref":"Khoản 3 Mục IV HD 20/HD-VKSTC"},{"id":"nq205_106","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 1 Điều 18 Thông tư liên tịch số 09/2025/TTLT, Viện kiểm sát ban hành quyết định yêu cầu chấm dứt hành vi vi phạm, áp dụng biện pháp để ngăn chặn, khắc phục hậu quả vào thời điểm nào?","o":["Sau khi bản án có hiệu lực pháp luật","Sau khi Tòa án thụ lý vụ án","Sau khi thụ lý vụ việc dân sự công ích","Trước khi tiếp nhận thông tin"],"a":2,"ref":"Khoản 1 Điều 18 TTLT 09/2025"},{"id":"nq205_107","cat":"nq205","topic":"6. Yêu cầu chấm dứt vi phạm; thông báo, kiến nghị, hỗ trợ khởi kiện","q":"Theo khoản 2 Điều 18 Thông tư liên tịch số 09/2025/TTLT, cơ quan, tổ chức, cá nhân có hành vi vi phạm phải trả lời bằng văn bản về những vấn đề Viện kiểm sát yêu cầu trong quyết định yêu cầu chấm dứt hành vi vi phạm trong thời hạn nào?","o":["10 ngày làm việc kể từ ngày nhận được quyết định","07 ngày kể từ ngày nhận được quyết định","30 ngày kể từ ngày nhận được quyết định","15 ngày kể từ ngày nhận được quyết định"],"a":3,"ref":"Khoản 2 Điều 18 TTLT 09/2025"},{"i
