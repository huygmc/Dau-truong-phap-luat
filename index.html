ề dân sự (Điều 26)","Tranh chấp về hôn nhân và gia đình (Điều 28)","Tranh chấp về lao động (Điều 32)"],"a":1,"ref":"Khoản 9 Điều 26 BLTTDS: “Những tranh chấp về dân sự thuộc thẩm quyền giải quyết của Tòa án” … “Tranh chấp đất đai theo quy định của pháp luật về đất đai”"},{"id":"ksdd038","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS (sửa đổi, bổ sung năm 2025), Tòa án nào có thẩm quyền giải quyết theo thủ tục sơ thẩm các tranh chấp về dân sự quy định tại Điều 26?","o":["Tòa án nhân dân cấp huyện","Tòa án nhân dân cấp tỉnh","Tòa án nhân dân khu vực","Tòa án nhân dân cấp cao"],"a":2,"ref":"Điều 35 BLTTDS (sửa đổi theo Luật số 85/2025/QH15): “Tòa án nhân dân khu vực có thẩm quyền giải quyết theo thủ tục sơ thẩm những tranh chấp quy định tại các điều 26, 28, 30 và 32”"},{"id":"ksdd039","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, bản án sơ thẩm chưa có hiệu lực pháp luật của Tòa án nhân dân khu vực bị kháng cáo, kháng nghị thì Tòa án nào giải quyết theo thủ tục phúc thẩm?","o":["Tòa án nhân dân cấp tỉnh","Chính Tòa án nhân dân khu vực đó với Hội đồng xét xử khác","Tòa án nhân dân tối cao","Tòa án nhân dân cấp cao"],"a":0,"ref":"Khoản 1 Điều 37 BLTTDS: “Tòa án nhân dân cấp tỉnh có thẩm quyền giải quyết theo thủ tục phúc thẩm những vụ việc mà bản án, quyết định chưa có hiệu lực pháp luật của Tòa án nhân dân khu vực bị kháng cáo, kháng nghị”"},{"id":"ksdd040","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, đối tượng tranh chấp là bất động sản thì Tòa án nào có thẩm quyền giải quyết theo lãnh thổ?","o":["Chỉ Tòa án nơi có bất động sản","Tòa án nơi bị đơn cư trú, làm việc","Tòa án nơi nguyên đơn cư trú nếu các bên thỏa thuận bằng văn bản","Tòa án do nguyên đơn tự lựa chọn"],"a":0,"ref":"Điểm c khoản 1 Điều 39 BLTTDS: “Đối tượng tranh chấp là bất động sản thì chỉ Tòa án nơi có bất động sản có thẩm quyền giải quyết”"},{"id":"ksdd041","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, nếu tranh chấp bất động sản mà bất động sản có ở nhiều địa phương khác nhau thì nguyên đơn có quyền yêu cầu Tòa án nào giải quyết?","o":["Tòa án nơi có bất động sản có giá trị lớn nhất","Tòa án nơi có bất động sản có diện tích lớn nhất","Tòa án nhân dân cấp tỉnh nơi nguyên đơn cư trú","Tòa án nơi có một trong các bất động sản"],"a":3,"ref":"Điểm i khoản 1 Điều 40 BLTTDS: “Nếu tranh chấp bất động sản mà bất động sản có ở nhiều địa phương khác nhau thì nguyên đơn có thể yêu cầu Tòa án nơi có một trong các bất động sản giải quyết”"},{"id":"ksdd042","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, khi giải quyết vụ việc dân sự, Tòa án có quyền hủy loại văn bản nào sau đây?","o":["Mọi văn bản hành chính có liên quan đến thửa đất tranh chấp","Quyết định cá biệt chỉ khi cơ quan ban hành đồng ý cho hủy","Văn bản quy phạm pháp luật của Ủy ban nhân dân cấp tỉnh trái pháp luật","Quyết định cá biệt trái pháp luật xâm phạm quyền, lợi ích hợp pháp của đương sự"],"a":3,"ref":"Khoản 1 Điều 34 BLTTDS: “Tòa án có quyền hủy quyết định cá biệt trái pháp luật của cơ quan, tổ chức, người có thẩm quyền xâm phạm quyền, lợi ích hợp pháp của đương sự”"},{"id":"ksdd043","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, \"quyết định cá biệt\" mà Tòa án có quyền hủy khi giải quyết vụ việc dân sự được hiểu là gì?","o":["Quyết định đã được ban hành về một vấn đề cụ thể và được áp dụng một lần đối với một hoặc một số đối tượng cụ thể","Quyết định chỉ đạo, điều hành nội bộ của cơ quan hành chính nhà nước","Quyết định chứa quy tắc xử sự chung, được áp dụng nhiều lần đối với nhiều đối tượng","Văn bản hướng dẫn nghiệp vụ của cơ quan quản lý đất đai cấp trên"],"a":0,"ref":"Khoản 2 Điều 34 BLTTDS: “quyết định đã được ban hành về một vấn đề cụ thể và được áp dụng một lần đối với một hoặc một số đối tượng cụ thể”"},{"id":"ksdd044","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, trường hợp vụ việc dân sự có liên quan đến quyết định cá biệt (ví dụ Giấy chứng nhận quyền sử dụng đất) thì quyết định đó được xem xét như thế nào?","o":["Tòa án trả lại đơn để đương sự khởi kiện vụ án hành chính riêng","Tòa án tách thành một vụ án hành chính độc lập","Phải được Tòa án xem xét trong cùng một vụ việc dân sự đó","Tòa án phải tạm đình chỉ chờ cơ quan hành chính tự xem xét"],"a":2,"ref":"Khoản 2 Điều 34 BLTTDS: “Trường hợp vụ việc dân sự có liên quan đến quyết định này thì phải được Tòa án xem xét trong cùng một vụ việc dân sự đó”"},{"id":"ksdd045","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, khi xem xét hủy quyết định cá biệt, Tòa án phải đưa cơ quan, tổ chức hoặc người có thẩm quyền đã ban hành quyết định tham gia tố tụng với tư cách gì?","o":["Người đại diện theo pháp luật của bị đơn","Bị đơn","Người làm chứng","Người có quyền lợi, nghĩa vụ liên quan"],"a":3,"ref":"Khoản 3 Điều 34 BLTTDS: “Tòa án phải đưa cơ quan, tổ chức hoặc người có thẩm quyền đã ban hành quyết định tham gia tố tụng với tư cách người có quyền lợi, nghĩa vụ liên quan”"},{"id":"ksdd046","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, cơ quan, tổ chức, người có thẩm quyền đã ban hành quyết định cá biệt bị Tòa án xem xét hủy có nghĩa vụ gì?","o":["Phải tự thu hồi quyết định trước khi Tòa án mở phiên tòa","Phải tham gia tố tụng và trình bày ý kiến của mình về quyết định cá biệt bị xem xét hủy","Chỉ gửi văn bản ý kiến nếu muốn, không bắt buộc tham gia tố tụng","Được từ chối tham gia tố tụng nếu quyết định ban hành đúng thẩm quyền"],"a":1,"ref":"Khoản 3 Điều 34 BLTTDS: “Cơ quan, tổ chức, người có thẩm quyền đã ban hành quyết định phải tham gia tố tụng và trình bày ý kiến của mình về quyết định cá biệt bị Tòa án xem xét hủy”"},{"id":"ksdd047","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, trường hợp việc giải quyết vụ án có liên quan đến quyền lợi, nghĩa vụ của một người nhưng không ai đề nghị đưa họ vào tham gia tố tụng thì Tòa án xử lý thế nào?","o":["Tòa án chỉ đưa họ vào khi Viện kiểm sát có văn bản kiến nghị","Tòa án phải đưa họ vào tham gia tố tụng với tư cách người có quyền lợi, nghĩa vụ liên quan","Tòa án không được đưa vào vì không có đương sự nào đề nghị","Tòa án đình chỉ giải quyết vụ án để đương sự khởi kiện lại đúng người"],"a":1,"ref":"Khoản 4 Điều 68 BLTTDS: “mà không có ai đề nghị đưa họ vào tham gia tố tụng với tư cách là người có quyền lợi, nghĩa vụ liên quan thì Tòa án phải đưa họ vào tham gia tố tụng với tư cách là người có quyền lợi, nghĩa vụ liên quan”"},{"id":"ksdd048","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, Tòa án chỉ áp dụng quy định về thời hiệu trong trường hợp nào?","o":["Tòa án tự áp dụng thời hiệu kể cả khi không có đương sự nào yêu cầu áp dụng","Theo yêu cầu của đương sự đưa ra tại phiên tòa phúc thẩm, trước khi Hội đồng xét xử nghị án","Khi Viện kiểm sát đề nghị áp dụng thời hiệu trong văn bản phát biểu tại phiên tòa sơ thẩm","Theo yêu cầu của đương sự, đưa ra trước khi Tòa án cấp sơ thẩm ra bản án, quyết định"],"a":3,"ref":"Khoản 2 Điều 184 BLTTDS: “Tòa án chỉ áp dụng quy định về thời hiệu theo yêu cầu áp dụng thời hiệu của một bên hoặc các bên với điều kiện yêu cầu này phải được đưa ra trước khi Tòa án cấp sơ thẩm ra bản án, quyết định giải quyết vụ việc”"},{"id":"ksdd049","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, người được hưởng lợi từ việc áp dụng thời hiệu có quyền gì?","o":["Yêu cầu Tòa án kéo dài thời hiệu thêm 02 năm","Từ chối áp dụng thời hiệu chỉ khi được bên kia đồng ý bằng văn bản","Không được từ chối áp dụng thời hiệu trong mọi trường hợp","Từ chối áp dụng thời hiệu, trừ khi việc từ chối nhằm trốn tránh nghĩa vụ"],"a":3,"ref":"Khoản 2 Điều 184 BLTTDS: “Người được hưởng lợi từ việc áp dụng thời hiệu có quyền từ chối áp dụng thời hiệu, trừ trường hợp việc từ chối đó nhằm mục đích trốn tránh thực hiện nghĩa vụ”"},{"id":"ksdd050","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, trường hợp gửi đơn khởi kiện qua dịch vụ bưu chính thì ngày khởi kiện được xác định là ngày nào?","o":["Ngày Chánh án phân công Thẩm phán xem xét đơn","Ngày được ghi trên dấu của tổ chức dịch vụ bưu chính nơi gửi","Ngày Tòa án nhận được đơn","Ngày Tòa án thụ lý vụ án"],"a":1,"ref":"Khoản 2 Điều 190 BLTTDS: “Ngày khởi kiện là ngày đương sự nộp đơn khởi kiện tại Tòa án hoặc ngày được ghi trên dấu của tổ chức dịch vụ bưu chính nơi gửi”"},{"id":"ksdd051","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, \"chưa có đủ điều kiện khởi kiện\" là trường hợp nào?","o":["Người khởi kiện chưa được cấp Giấy chứng nhận quyền sử dụng đất đối với thửa đất tranh chấp","Bị đơn chưa có văn bản ghi ý kiến đối với yêu cầu khởi kiện của nguyên đơn","Người khởi kiện chưa nộp đủ tài liệu, chứng cứ chứng minh cho toàn bộ yêu cầu khởi kiện","Luật có quy định điều kiện khởi kiện nhưng người khởi kiện khởi kiện khi còn thiếu một trong các điều kiện đó"],"a":3,"ref":"Điểm b khoản 1 Điều 192 BLTTDS: “Chưa có đủ điều kiện khởi kiện là trường hợp pháp luật có quy định về các điều kiện khởi kiện nhưng người khởi kiện đã khởi kiện đến Tòa án khi còn thiếu một trong các điều kiện đó”"},{"id":"ksdd052","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, trường hợp nào sau đây Thẩm phán KHÔNG trả lại đơn khởi kiện với lý do sự việc đã được giải quyết bằng bản án, quyết định đã có hiệu lực pháp luật?","o":["Tranh chấp hợp đồng chuyển nhượng quyền sử dụng đất đã được bản án có hiệu lực tuyên vô hiệu","Tranh chấp chia di sản thừa kế là quyền sử dụng đất đã được bản án có hiệu lực phân chia","Tranh chấp ranh giới đất đã được bản án có hiệu lực giải quyết giữa cùng các đương sự","Đòi quyền sử dụng đất cho mượn, cho ở nhờ mà trước đó Tòa án chưa chấp nhận và pháp luật cho phép khởi kiện lại"],"a":3,"ref":"Điểm c khoản 1 Điều 192 BLTTDS: “đòi quyền sử dụng đất cho thuê, cho mượn, cho ở nhờ mà Tòa án chưa chấp nhận yêu cầu và theo quy định của pháp luật được quyền khởi kiện lại”"},{"id":"ksdd053","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, khi trả lại đơn khởi kiện, ngoài việc trả cho người khởi kiện, văn bản nêu rõ lý do trả lại đơn phải đồng thời gửi cho ai?","o":["Ủy ban nhân dân cấp xã nơi có đất","Chánh án Tòa án cấp trên trực tiếp","Viện kiểm sát cùng cấp","Viện kiểm sát cấp trên trực tiếp"],"a":2,"ref":"Khoản 2 Điều 192 BLTTDS: “Thẩm phán phải có văn bản nêu rõ lý do trả lại đơn khởi kiện, đồng thời gửi cho Viện kiểm sát cùng cấp”"},{"id":"ksdd054","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, Viện kiểm sát có quyền kiến nghị với Tòa án đã trả lại đơn khởi kiện trong thời hạn bao lâu?","o":["07 ngày, kể từ ngày Tòa án ký văn bản trả lại đơn","03 ngày làm việc, kể từ ngày nhận được văn bản trả lại đơn","15 ngày, kể từ ngày nhận được văn bản trả lại đơn","10 ngày, kể từ ngày nhận được văn bản trả lại đơn khởi kiện"],"a":3,"ref":"Khoản 1 Điều 194 BLTTDS: “Trong thời hạn 10 ngày, kể từ ngày nhận được văn bản trả lại đơn khởi kiện, người khởi kiện có quyền khiếu nại, Viện kiểm sát có quyền kiến nghị với Tòa án đã trả lại đơn khởi kiện”"},{"id":"ksdd055","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, phiên họp xem xét, giải quyết khiếu nại, kiến nghị về việc trả lại đơn khởi kiện có sự tham gia của những ai?","o":["Chỉ Thẩm phán và đương sự có khiếu nại","Hội đồng gồm ba Thẩm phán và Hội thẩm nhân dân","Đại diện Viện kiểm sát cùng cấp và đương sự có khiếu nại","Đại diện Viện kiểm sát cấp trên trực tiếp và bị kiện"],"a":2,"ref":"Khoản 3 Điều 194 BLTTDS: “Phiên họp xem xét, giải quyết khiếu nại, kiến nghị có sự tham gia của đại diện Viện kiểm sát cùng cấp và đương sự có khiếu nại”"},{"id":"ksdd056","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, không đồng ý với quyết định trả lời kiến nghị về việc trả lại đơn khởi kiện của Thẩm phán, Viện kiểm sát có quyền kiến nghị với ai?","o":["Chánh án Tòa án đã trả lại đơn","Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh","Chánh án Tòa án nhân dân tối cao","Chánh án Tòa án trên một cấp trực tiếp"],"a":3,"ref":"Khoản 5, khoản 6 Điều 194 BLTTDS: “Viện kiểm sát có quyền kiến nghị với Chánh án Tòa án trên một cấp trực tiếp xem xét, giải quyết”"},{"id":"ksdd057","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, trường hợp người khởi kiện phải nộp tiền tạm ứng án phí thì Thẩm phán thụ lý vụ án khi nào?","o":["Khi người khởi kiện nộp cho Tòa án biên lai thu tiền tạm ứng án phí","Khi nhận được đơn khởi kiện hợp lệ kèm tài liệu, chứng cứ","Khi Viện kiểm sát có ý kiến bằng văn bản về thẩm quyền","Khi bị đơn có văn bản ghi ý kiến đối với yêu cầu khởi kiện"],"a":0,"ref":"Khoản 3 Điều 195 BLTTDS: “Thẩm phán thụ lý vụ án khi người khởi kiện nộp cho Tòa án biên lai thu tiền tạm ứng án phí”"},{"id":"ksdd058","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, trong thời hạn bao lâu kể từ ngày thụ lý vụ án, Thẩm phán phải thông báo bằng văn bản cho Viện kiểm sát cùng cấp về việc thụ lý?","o":["05 ngày làm việc","03 ngày làm việc","10 ngày","07 ngày"],"a":1,"ref":"Khoản 1 Điều 196 BLTTDS: “Trong thời hạn 03 ngày làm việc, kể từ ngày thụ lý vụ án, Thẩm phán phải thông báo bằng văn bản cho nguyên đơn, bị đơn, cơ quan, tổ chức, cá nhân có quyền lợi, nghĩa vụ liên quan đến việc giải quyết vụ án, cho Viện kiểm sát cùng cấp”"},{"id":"ksdd059","cat":"ksdd","topic":"Thẩm quyền, khởi kiện, thụ lý","q":"Theo BLTTDS, bị đơn có quyền đưa ra yêu cầu phản tố, người có quyền lợi, nghĩa vụ liên quan có quyền đưa ra yêu cầu độc lập trước thời điểm nào?","o":["Trước thời điểm mở phiên tòa sơ thẩm","Trước khi Tòa án ra quyết định đưa vụ án ra xét xử sơ thẩm","Trước khi Hội đồng xét xử chuyển sang phần tranh luận tại phiên tòa sơ thẩm","Trước thời điểm mở phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ và hòa giải"],"a":3,"ref":"Khoản 3 Điều 200; khoản 2 Điều 201 BLTTDS: “Bị đơn có quyền đưa ra yêu cầu phản tố trước thời điểm mở phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ và hòa giải” … “Người có quyền lợi, nghĩa vụ liên quan có quyền đưa ra yêu cầu độc lập trước thời điểm mở phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ và hòa giải”"},{"id":"ksdd060","cat":"ksdd","topic":"Chứng cứ, chứng minh","q":"Theo BLTTDS, đương sự có yêu cầu Tòa án bảo vệ quyền và lợi ích hợp pháp của mình có nghĩa vụ gì (trừ trường hợp luật quy định khác)?","o":["Thu thập, cung cấp, giao nộp tài liệu, chứng cứ chứng minh yêu cầu là có căn cứ và hợp pháp","Đề nghị Viện kiểm sát thu thập chứng cứ thay cho mình","Chỉ phải chứng minh khi bị đơn có văn bản phản đối","Chỉ cần trình bày yêu cầu, Tòa án có nghĩa vụ thu thập toàn bộ chứng cứ"],"a":0,"ref":"Khoản 1 Điều 91 BLTTDS: “phải thu thập, cung cấp, giao nộp cho Tòa án tài liệu, chứng cứ để chứng minh cho yêu cầu đó là có căn cứ và hợp pháp”"},{"id":"ksdd061","cat":"ksdd","topic":"Chứng cứ, chứng minh","q":"Theo BLTTDS, đương sự có nghĩa vụ đưa ra chứng cứ để chứng minh mà không đưa ra được hoặc không đưa ra đủ chứng cứ thì Tòa án giải quyết thế nào?","o":["Tạm đình chỉ giải quyết vụ án chờ đương sự bổ sung chứng cứ","Giải quyết vụ việc dân sự theo những chứng cứ đã thu thập được có trong hồ sơ vụ việc","Trả lại đơn khởi kiện và tài liệu, chứng cứ cho đương sự","Đình chỉ giải quyết vụ án vì đương sự không thực hiện nghĩa vụ chứng minh"],"a":1,"ref":"Khoản 4 Điều 91 BLTTDS: “Tòa án giải quyết vụ việc dân sự theo những chứng cứ đã thu thập được có trong hồ sơ vụ việc”"},{"id":"ksdd062","cat":"ksdd","topic":"Chứng cứ, chứng minh","q":"Theo BLTTDS, tình tiết, sự kiện nào sau đây KHÔNG phải chứng minh?","o":["Tình tiết do nguyên đơn trình bày trong đơn khởi kiện","Tình tiết, sự kiện đã được ghi trong văn bản và được công chứng, chứng thực hợp pháp","Tình tiết do người làm chứng khai tại phiên tòa","Tình tiết được ghi trong giấy viết tay có hai người làm chứng"],"a":1,"ref":"Điểm c khoản 1 Điều 92 BLTTDS: “Những tình tiết, sự kiện đã được ghi trong văn bản và được công chứng, chứng thực hợp pháp”"},{"id":"ksdd063","cat":"ksdd","topic":"Chứng cứ, chứng minh","q":"Theo BLTTDS, tài liệu đọc được nội dung được coi là chứng cứ khi nào?","o":["Là bản chụp có chữ ký xác nhận \"sao y bản chính\" của chính người giao nộp tài liệu cho Tòa án","Có ít nhất hai người làm chứng ký xác nhận nội dung tài liệu là đúng sự thật","Là bản chính, bản sao có công chứng, chứng thực hợp pháp hoặc do cơ quan có thẩm quyền cung cấp, xác nhận","Được đương sự xuất trình và xác nhận là đúng sự thật tại phiên tòa sơ thẩm"],"a":2,"ref":"Khoản 1 Điều 95 BLTTDS: “Tài liệu đọc được nội dung được coi là chứng cứ nếu là bản chính hoặc bản sao có công chứng, chứng thực hợp pháp hoặc do cơ quan, tổ chức có thẩm quyền cung cấp, xác nhận”"},{"id":"ksdd064","cat":"ksdd","topic":"Chứng cứ, chứng minh","q":"Theo BLTTDS, thời hạn giao nộp tài liệu, chứng cứ do Thẩm phán ấn định nhưng không được vượt quá thời hạn nào?","o":["Thời điểm kết thúc phần tranh luận tại phiên tòa sơ thẩm","15 ngày kể từ ngày đương sự nhận được thông báo thụ lý","01 tháng kể từ ngày Tòa án thụ lý vụ án","Thời hạn chuẩn bị xét xử sơ thẩm (thời hạn chuẩn bị giải quyết việc dân sự)"],"a":3,"ref":"Khoản 4 Điều 96 BLTTDS: “nhưng không được vượt quá thời hạn chuẩn bị xét xử theo thủ tục sơ thẩm, thời hạn chuẩn bị giải quyết việc dân sự theo quy định của Bộ luật này”"},{"id":"ksdd065","cat":"ksdd","topic":"Chứng cứ, chứng minh","q":"Theo BLTTDS, biện pháp nào sau đây KHÔNG thuộc các biện pháp Tòa án có thể tiến hành để thu thập tài liệu, chứng cứ?","o":["Khám xét chỗ ở của đương sự","Định giá tài sản","Xác minh sự có mặt hoặc vắng mặt của đương sự tại nơi cư trú","Ủy thác thu thập, xác minh tài liệu, chứng cứ"],"a":0,"ref":"Khoản 2 Điều 97 BLTTDS: “d) Định giá tài sản; đ) Xem xét, thẩm định tại chỗ; e) Ủy thác thu thập, xác minh tài liệu, chứng cứ” … “h) Xác minh sự có mặt hoặc vắng mặt của đương sự tại nơi cư trú”"},{"id":"ksdd066","cat":"ksdd","topic":"Chứng cứ, chứng minh","q":"Theo BLTTDS, khi tiến hành biện pháp thu thập chứng cứ nào sau đây Tòa án phải ra quyết định, trong đó nêu rõ lý do và yêu cầu của Tòa án?","o":["Lấy lời khai của người làm chứng","Xem xét, thẩm định tại chỗ","Lấy lời khai của đương sự","Đối chất giữa các đương sự với nhau"],"a":1,"ref":"Khoản 3 Điều 97 BLTTDS: “Khi tiến hành các biện pháp quy định tại các điểm c, d, đ, e và g khoản 2 Điều này, Tòa án phải ra quyết định, trong đó nêu rõ lý do và yêu cầu của Tòa án” … “đ) Xem xét, thẩm định tại chỗ”"},{"id":"ksdd067","cat":"ksdd","topic":"Chứng cứ, chứng minh","q":"Theo BLTTDS, Thẩm phán tiến hành xem xét, thẩm định tại chỗ với sự có mặt của ai?","o":["Đại diện UBND cấp xã hoặc Công an xã, phường, đặc khu hoặc cơ quan, tổ chức nơi có đối tượng xem xét","Công chứng viên của tổ chức hành nghề công chứng nơi có đất để chứng nhận","Bắt buộc có Kiểm sát viên Viện kiểm sát cùng cấp và Thư ký Tòa án ghi biên bản","Bắt buộc có đại diện Văn phòng đăng ký đất đai và cơ quan thuế nơi có đất"],"a":0,"ref":"Khoản 1 Điều 101 BLTTDS: “Thẩm phán tiến hành việc xem xét, thẩm định tại chỗ với sự có mặt của đại diện Ủy ban nhân dân cấp xã hoặc Công an xã, phường, đặc khu hoặc cơ quan, tổ chức nơi có đối tượng cần xem xét, thẩm định”"},{"id":"ksdd068","cat":"ksdd","topic":"Chứng cứ, chứng minh","q":"Theo BLTTDS, biên bản xem xét, thẩm định tại chỗ phải ghi rõ nội dung nào?","o":["Đề xuất hướng giải quyết vụ án","Giá trị tài sản theo giá thị trường","Kết quả xem xét, thẩm định, mô tả rõ hiện trường","Kết luận ai là người có quyền sử dụng đất"],"a":2,"ref":"Khoản 2 Điều 101 BLTTDS: “Biên bản phải ghi rõ kết quả xem xét, thẩm định, mô tả rõ hiện trường”"},{"id":"ksdd069","cat":"ksdd","topic":"Chứng cứ, chứng minh","q":"Theo BLTTDS, trường hợp nào sau đây Tòa án ra quyết định định giá tài sản và thành lập Hội đồng định giá?","o":["Các đương sự đưa ra giá tài sản khác nhau hoặc không thỏa thuận được giá tài sản","Các đương sự đã thỏa thuận được giá và không ai yêu cầu định giá","Chỉ khi Viện kiểm sát có văn bản yêu cầu","Chỉ khi tài sản tranh chấp có giá trị từ 01 tỷ đồng trở lên"],"a":0,"ref":"Khoản 3 Điều 104 BLTTDS: “Các đương sự không thỏa thuận lựa chọn tổ chức thẩm định giá tài sản hoặc đưa ra giá tài sản khác nhau hoặc không thỏa thuận được giá tài sản”"},{"id":"ksdd070","cat":"ksdd","topic":"Chứng cứ, chứng minh","q":"Theo BLTTDS, Hội đồng định giá chỉ tiến hành định giá khi nào và quyền quyết định về giá thuộc về ai?","o":["Khi có mặt Kiểm sát viên; quyền quyết định về giá thuộc Chủ tịch Hội đồng","Khi có mặt quá nửa thành viên; quyền quyết định về giá thuộc Thẩm phán","Khi có mặt đầy đủ các thành viên của Hội đồng; quyền quyết định về giá thuộc Hội đồng định giá","Khi có mặt đầy đủ đương sự; quyền quyết định về giá thuộc các đương sự"],"a":2,"ref":"Điểm a khoản 4 Điều 104 BLTTDS: “Hội đồng định giá chỉ tiến hành định giá khi có mặt đầy đủ các thành viên của Hội đồng” … “Quyền quyết định về giá đối với tài sản định giá thuộc Hội đồng định giá”"},{"id":"ksdd071","cat":"ksdd","topic":"Chứng cứ, chứng minh","q":"Theo BLTTDS, việc định giá lại tài sản được thực hiện trong trường hợp nào?","o":["Có căn cứ cho rằng kết quả lần đầu không chính xác hoặc không phù hợp giá thị trường tại thời điểm giải quyết","Bất kỳ đương sự nào không đồng ý với kết quả định giá lần đầu, không cần nêu căn cứ","Đã quá 06 tháng kể từ ngày định giá lần đầu mà Tòa án chưa đưa vụ án ra xét xử","Có yêu cầu của người làm chứng hoặc của Ủy ban nhân dân cấp xã nơi có tài sản"],"a":0,"ref":"Khoản 5 Điều 104 BLTTDS: “Việc định giá lại tài sản được thực hiện trong trường hợp có căn cứ cho rằng kết quả định giá lần đầu không chính xác hoặc không phù hợp với giá thị trường nơi có tài sản định giá tại thời điểm giải quyết vụ án dân sự”"},{"id":"ksdd072","cat":"ksdd","topic":"Chứng cứ, chứng minh","q":"Theo BLTTDS, cơ quan, tổ chức, cá nhân đang quản lý, lưu giữ tài liệu, chứng cứ có trách nhiệm cung cấp đầy đủ theo yêu cầu của Tòa án trong thời hạn bao lâu kể từ ngày nhận được yêu cầu?","o":["07 ngày","15 ngày","30 ngày","10 ngày"],"a":1,"ref":"Khoản 3 Điều 106 BLTTDS: “có trách nhiệm cung cấp đầy đủ tài liệu, chứng cứ theo yêu cầu của Tòa án trong thời hạn 15 ngày, kể từ ngày nhận được yêu cầu”"},{"id":"ksdd073","cat":"ksdd","topic":"Biện pháp khẩn cấp tạm thời","q":"Theo BLTTDS, biện pháp nào sau đây là biện pháp khẩn cấp tạm thời?","o":["Thu hồi Giấy chứng nhận quyền sử dụng đất","Cấm thay đổi hiện trạng tài sản đang tranh chấp","Tịch thu tài sản đang tranh chấp","Tạm giữ người đang chiếm giữ tài sản"],"a":1,"ref":"Điều 114 BLTTDS: “8. Cấm thay đổi hiện trạng tài sản đang tranh chấp”"},{"id":"ksdd074","cat":"ksdd","topic":"Biện pháp khẩn cấp tạm thời","q":"Theo BLTTDS, biện pháp \"cấm thay đổi hiện trạng tài sản đang tranh chấp\" được áp dụng khi có căn cứ cho thấy người đang chiếm hữu hoặc giữ tài sản có hành vi nào?","o":["Không đến Tòa án theo giấy triệu tập hợp lệ lần thứ nhất","Cho người khác ở nhờ hoặc thuê lại nhà trên đất đang tranh chấp","Chậm nộp thuế sử dụng đất và lệ phí trước bạ đối với thửa đất tranh chấp","Tháo gỡ, lắp ghép, xây dựng thêm hoặc hành vi khác làm thay đổi hiện trạng tài sản"],"a":3,"ref":"Điều 122 BLTTDS: “có hành vi tháo gỡ, lắp ghép, xây dựng thêm hoặc có hành vi khác làm thay đổi hiện trạng tài sản đó”"},{"id":"ksdd075","cat":"ksdd","topic":"Biện pháp khẩn cấp tạm thời","q":"Theo BLTTDS, trường hợp nào sau đây Tòa án ra ngay quyết định hủy bỏ biện pháp khẩn cấp tạm thời đã được áp dụng?","o":["Đương sự kháng cáo bản án sơ thẩm","Tòa án ra quyết định đưa vụ án ra xét xử","Vụ án bị tạm đình chỉ giải quyết","Việc giải quyết vụ án được đình chỉ"],"a":3,"ref":"Điểm d khoản 1 Điều 138 BLTTDS: “d) Việc giải quyết vụ án được đình chỉ theo quy định của Bộ luật này”"},{"id":"ksdd076","cat":"ksdd","topic":"Biện pháp khẩn cấp tạm thời","q":"Theo BLTTDS, Viện kiểm sát có quyền kiến nghị về quyết định áp dụng biện pháp khẩn cấp tạm thời với ai và trong thời hạn bao lâu?","o":["Với Chánh án Tòa án cấp trên trực tiếp; trong 07 ngày kể từ ngày nhận được quyết định","Với Hội đồng xét xử; trong 10 ngày kể từ ngày ra quyết định","Với Chánh án Tòa án đang giải quyết vụ án; trong 03 ngày làm việc kể từ ngày nhận được quyết định","Với Thẩm phán đã ra quyết định; trong 05 ngày làm việc"],"a":2,"ref":"Điều 140 BLTTDS: “Viện kiểm sát có quyền kiến nghị với Chánh án Tòa án đang giải quyết vụ án” … “Thời hạn khiếu nại, kiến nghị là 03 ngày làm việc, kể từ ngày nhận được quyết định áp dụng, thay đổi, hủy bỏ biện pháp khẩn cấp tạm thời”"},{"id":"ksdd077","cat":"ksdd","topic":"Hòa giải, chuẩn bị xét xử, tạm đình chỉ, đình chỉ","q":"Theo BLTTDS, thời hạn chuẩn bị xét xử vụ án tranh chấp về dân sự (Điều 26) theo thủ tục thông thường là bao lâu kể từ ngày thụ lý?","o":["04 tháng","03 tháng","02 tháng","06 tháng"],"a":0,"ref":"Điểm a khoản 1 Điều 203 BLTTDS: “Đối với các vụ án quy định tại Điều 26 và Điều 28 của Bộ luật này thì thời hạn là 04 tháng, kể từ ngày thụ lý vụ án”"},{"id":"ksdd078","cat":"ksdd","topic":"Hòa giải, chuẩn bị xét xử, tạm đình chỉ, đình chỉ","q":"Theo BLTTDS, vụ án dân sự nào sau đây KHÔNG được hòa giải?","o":["Vụ án phát sinh từ giao dịch dân sự vi phạm điều cấm của luật hoặc trái đạo đức xã hội","Tranh chấp ranh giới đất giữa các hộ liền kề","Tranh chấp hợp đồng chuyển nhượng quyền sử dụng đất có giá trị lớn","Tranh chấp chia di sản thừa kế là quyền sử dụng đất"],"a":0,"ref":"Khoản 2 Điều 206 BLTTDS: “Những vụ án phát sinh từ giao dịch dân sự vi phạm điều cấm của luật hoặc trái đạo đức xã hội”"},{"id":"ksdd079","cat":"ksdd","topic":"Hòa giải, chuẩn bị xét xử, tạm đình chỉ, đình chỉ","q":"Theo BLTTDS, trường hợp nào sau đây là vụ án dân sự không tiến hành hòa giải được?","o":["Một trong các đương sự đề nghị không tiến hành hòa giải","Bị đơn được triệu tập hợp lệ lần thứ nhất nhưng vắng mặt","Đất tranh chấp chưa được cấp Giấy chứng nhận","Vụ án có trên 10 đương sự"],"a":0,"ref":"Khoản 4 Điều 207 BLTTDS: “Một trong các đương sự đề nghị không tiến hành hòa giải”"},{"id":"ksdd080","cat":"ksdd","topic":"Hòa giải, chuẩn bị xét xử, tạm đình chỉ, đình chỉ","q":"Theo BLTTDS, Tòa án phải gửi quyết định công nhận sự thỏa thuận của các đương sự cho Viện kiểm sát cùng cấp trong thời hạn bao lâu kể từ ngày ra quyết định?","o":["07 ngày","05 ngày làm việc","10 ngày","03 ngày làm việc"],"a":1,"ref":"Khoản 1 Điều 212 BLTTDS: “Trong thời hạn 05 ngày làm việc, kể từ ngày ra quyết định công nhận sự thoả thuận của các đương sự, Tòa án phải gửi quyết định đó cho các đương sự và Viện kiểm sát cùng cấp”"},{"id":"ksdd081","cat":"ksdd","topic":"Hòa giải, chuẩn bị xét xử, tạm đình chỉ, đình chỉ","q":"Theo BLTTDS, Thẩm phán chỉ ra quyết định công nhận sự thỏa thuận của các đương sự khi nào?","o":["Khi Viện kiểm sát đồng ý với nội dung thỏa thuận","Khi các đương sự thỏa thuận được ít nhất một nửa số yêu cầu","Khi các đương sự thỏa thuận được với nhau về việc giải quyết toàn bộ vụ án","Khi nguyên đơn và bị đơn thỏa thuận, không cần ý kiến người có quyền lợi, nghĩa vụ liên quan"],"a":2,"ref":"Khoản 2 Điều 212 BLTTDS: “Thẩm phán chỉ ra quyết định công nhận sự thoả thuận của các đương sự nếu các đương sự thoả thuận được với nhau về việc giải quyết toàn bộ vụ án”"},{"id":"ksdd082","cat":"ksdd","topic":"Hòa giải, chuẩn bị xét xử, tạm đình chỉ, đình chỉ","q":"Theo BLTTDS, quyết định công nhận sự thỏa thuận của các đương sự có hiệu lực pháp luật khi nào?","o":["Ngay sau khi được ban hành và không bị kháng cáo, kháng nghị theo thủ tục phúc thẩm","Sau 07 ngày kể từ ngày Viện kiểm sát nhận được quyết định","Sau 15 ngày kể từ ngày ban hành nếu không bị kháng cáo, kháng nghị","Sau khi các đương sự đăng ký biến động đất đai"],"a":0,"ref":"Khoản 1 Điều 213 BLTTDS: “Quyết định công nhận sự thoả thuận của các đương sự có hiệu lực pháp luật ngay sau khi được ban hành và không bị kháng cáo, kháng nghị theo thủ tục phúc thẩm”"},{"id":"ksdd083","cat":"ksdd","topic":"Hòa giải, chuẩn bị xét xử, tạm đình chỉ, đình chỉ","q":"Theo BLTTDS, trường hợp nào sau đây là căn cứ để Tòa án ra quyết định TẠM ĐÌNH CHỈ giải quyết vụ án?","o":["Nguyên đơn rút toàn bộ yêu cầu khởi kiện","Nguyên đơn không nộp tiền tạm ứng chi phí định giá tài sản","Cần đợi kết quả giải quyết vụ án khác có liên quan mới giải quyết được vụ án","Đương sự yêu cầu áp dụng thời hiệu và thời hiệu khởi kiện đã hết"],"a":2,"ref":"Điểm d khoản 1 Điều 214 BLTTDS: “Cần đợi kết quả giải quyết vụ án khác có liên quan hoặc sự việc được pháp luật quy định là phải do cơ quan, tổ chức khác giải quyết trước mới giải quyết được vụ án”"},{"id":"ksdd084","cat":"ksdd","topic":"Hòa giải, chuẩn bị xét xử, tạm đình chỉ, đình chỉ","q":"Theo BLTTDS, sau khi có quyết định tạm đình chỉ, Thẩm phán được phân công giải quyết vụ án có trách nhiệm gì?","o":["Trả lại toàn bộ tài liệu, chứng cứ cho đương sự và xóa tên vụ án","Chuyển trách nhiệm theo dõi, đôn đốc cho Viện kiểm sát cùng cấp","Theo dõi, đôn đốc khắc phục sớm nhất các lý do dẫn tới vụ án bị tạm đình chỉ","Không còn trách nhiệm đối với vụ án cho đến khi có quyết định tiếp tục giải quyết"],"a":2,"ref":"Khoản 4 Điều 215 BLTTDS: “có trách nhiệm theo dõi, đôn đốc cơ quan, tổ chức, cá nhân nhằm khắc phục trong thời gian ngắn nhất những lý do dẫn tới vụ án bị tạm đình chỉ để kịp thời đưa vụ án ra giải quyết”"},{"id":"ksdd085","cat":"ksdd","topic":"Hòa giải, chuẩn bị xét xử, tạm đình chỉ, đình chỉ","q":"Theo BLTTDS, nguyên đơn không nộp tiền tạm ứng chi phí định giá tài sản và chi phí tố tụng khác theo quy định thì Tòa án giải quyết thế nào?","o":["Ra quyết định tạm đình chỉ giải quyết vụ án","Ra quyết định đình chỉ giải quyết vụ án","Tòa án tạm ứng chi phí và tiếp tục giải quyết","Trả lại đơn khởi kiện"],"a":1,"ref":"Điểm đ khoản 1 Điều 217 BLTTDS: “Nguyên đơn không nộp tiền tạm ứng chi phí định giá tài sản và chi phí tố tụng khác theo quy định của Bộ luật này” … “Tòa án ra quyết định đình chỉ giải quyết vụ án dân sự trong các trường hợp sau đây”"},{"id":"ksdd086","cat":"ksdd","topic":"Hòa giải, chuẩn bị xét xử, tạm đình chỉ, đình chỉ","q":"Theo BLTTDS, nguyên đơn rút toàn bộ yêu cầu khởi kiện nhưng bị đơn không rút yêu cầu phản tố thì Tòa án giải quyết thế nào?","o":["Tạm đình chỉ giải quyết vụ án để chờ bị đơn quyết định có rút yêu cầu phản tố","Đình chỉ giải quyết toàn bộ vụ án, kể cả yêu cầu phản tố của bị đơn","Đình chỉ đối với yêu cầu của nguyên đơn; bị đơn trở thành nguyên đơn, nguyên đơn trở thành bị đơn","Trả lại đơn phản tố cho bị đơn để khởi kiện thành vụ án khác"],"a":2,"ref":"Điểm b khoản 2 Điều 217 BLTTDS: “Bị đơn không rút hoặc chỉ rút một phần yêu cầu phản tố thì Tòa án ra quyết định đình chỉ giải quyết đối với yêu cầu khởi kiện của nguyên đơn; bị đơn trở thành nguyên đơn, nguyên đơn trở thành bị đơn”"},{"id":"ksdd087","cat":"ksdd","topic":"Hòa giải, chuẩn bị xét xử, tạm đình chỉ, đình chỉ","q":"Theo BLTTDS, Tòa án đình chỉ giải quyết vụ án vì nguyên đơn đã được triệu tập hợp lệ lần thứ hai mà vẫn vắng mặt thì tiền tạm ứng án phí nguyên đơn đã nộp được xử lý thế nào?","o":["Sung vào công quỹ nhà nước","Chuyển cho bị đơn","Giữ lại chờ nguyên đơn khởi kiện lại","Trả lại cho nguyên đơn"],"a":0,"ref":"Khoản 2 Điều 218 BLTTDS: “vì lý do nguyên đơn đã được triệu tập hợp lệ lần thứ hai mà vẫn vắng mặt quy định tại điểm c khoản 1 Điều 217 của Bộ luật này thì tiền tạm ứng án phí mà đương sự đã nộp được sung vào công quỹ nhà nước”"},{"id":"ksdd088","cat":"ksdd","topic":"Hòa giải, chuẩn bị xét xử, tạm đình chỉ, đình chỉ","q":"Theo BLTTDS, trường hợp Viện kiểm sát tham gia phiên tòa sơ thẩm, thời hạn Viện kiểm sát nghiên cứu và trả lại hồ sơ cho Tòa án là bao lâu?","o":["07 ngày làm việc, kể từ ngày nhận được quyết định đưa vụ án ra xét xử","10 ngày, kể từ ngày nhận được hồ sơ","01 tháng, kể từ ngày nhận được hồ sơ","15 ngày, kể từ ngày nhận được hồ sơ"],"a":3,"ref":"Khoản 2 Điều 220 BLTTDS: “trong thời hạn 15 ngày, kể từ ngày nhận được hồ sơ, Viện kiểm sát phải nghiên cứu và trả lại hồ sơ cho Tòa án”"},{"id":"ksdd089","cat":"ksdd","topic":"Phiên tòa sơ thẩm","q":"Theo BLTTDS, Tòa án triệu tập hợp lệ lần thứ nhất mà đương sự vắng mặt (không có đơn đề nghị xét xử vắng mặt) thì Hội đồng xét xử xử lý thế nào?","o":["Đình chỉ giải quyết vụ án","Tạm đình chỉ giải quyết vụ án","Phải hoãn phiên tòa","Vẫn tiến hành xét xử vắng mặt"],"a":2,"ref":"Khoản 1 Điều 227 BLTTDS: “nếu có người vắng mặt thì Hội đồng xét xử phải hoãn phiên tòa, trừ trường hợp người đó có đơn đề nghị xét xử vắng mặt”"},{"id":"ksdd090","cat":"ksdd","topic":"Phiên tòa sơ thẩm","q":"Theo BLTTDS, được triệu tập hợp lệ lần thứ hai, nguyên đơn vắng mặt không vì sự kiện bất khả kháng, trở ngại khách quan, không có người đại diện và không có đơn đề nghị xét xử vắng mặt thì hậu quả là gì?","o":["Tòa án hoãn phiên tòa lần thứ hai và triệu tập nguyên đơn lần thứ ba","Tòa án tiến hành xét xử vắng mặt nguyên đơn và giải quyết toàn bộ yêu cầu khởi kiện","Bị coi là từ bỏ việc khởi kiện; Tòa án đình chỉ giải quyết yêu cầu khởi kiện của người đó","Tòa án tạm đình chỉ giải quyết vụ án cho đến khi nguyên đơn có mặt"],"a":2,"ref":"Điểm a khoản 2 Điều 227 BLTTDS: “Nguyên đơn vắng mặt mà không có người đại diện tham gia phiên tòa thì bị coi là từ bỏ việc khởi kiện và Tòa án ra quyết định đình chỉ giải quyết vụ án đối với yêu cầu khởi kiện của người đó”"},{"id":"ksdd091","cat":"ksdd","topic":"Phiên tòa sơ thẩm","q":"Theo BLTTDS, Kiểm sát viên được phân công tham gia phiên tòa sơ thẩm vắng mặt thì Hội đồng xét xử xử lý thế nào?","o":["Phải hoãn phiên tòa","Hoãn phiên tòa nếu Viện kiểm sát có văn bản đề nghị","Tạm ngừng phiên tòa để chờ Kiểm sát viên","Vẫn tiến hành xét xử, không hoãn phiên tòa"],"a":3,"ref":"Khoản 1 Điều 232 BLTTDS: “nếu Kiểm sát viên vắng mặt thì Hội đồng xét xử vẫn tiến hành xét xử, không hoãn phiên tòa”"},{"id":"ksdd092","cat":"ksdd","topic":"Phiên tòa sơ thẩm","q":"Theo BLTTDS, Kiểm sát viên có quyền gì đối với biên bản phiên tòa?","o":["Ký biên bản phiên tòa thay Thư ký phiên tòa trong trường hợp Thư ký vắng mặt","Xem biên bản ngay sau phiên tòa, yêu cầu ghi sửa đổi, bổ sung và ký xác nhận","Chỉ được xem biên bản phiên tòa sau khi bản án có hiệu lực pháp luật","Tự sửa nội dung biên bản phiên tòa nếu thấy Thư ký ghi chưa chính xác"],"a":1,"ref":"Khoản 4 Điều 236 BLTTDS: “Kiểm sát viên và những người tham gia tố tụng có quyền được xem biên bản phiên tòa ngay sau khi kết thúc phiên tòa, yêu cầu ghi những sửa đổi, bổ sung vào biên bản phiên tòa và ký xác nhận”"},{"id":"ksdd093","cat":"ksdd","topic":"Phiên tòa sơ thẩm","q":"Theo BLTTDS, Hội đồng xét xử có quyền quyết định tạm ngừng phiên tòa khi có căn cứ nào sau đây?","o":["Nguyên đơn rút một phần yêu cầu khởi kiện tại phiên tòa và bị đơn đồng ý với việc rút yêu cầu đó","Bị đơn không đồng ý với yêu cầu khởi kiện và đề nghị Hội đồng xét xử cho thêm thời gian chuẩn bị","Người bảo vệ quyền và lợi ích hợp pháp của đương sự vắng mặt tại phiên tòa không có lý do","Cần xác minh, thu thập bổ sung chứng cứ không thể thực hiện ngay tại phiên tòa, nếu thiếu thì không giải quyết được vụ án"],"a":3,"ref":"Điểm c khoản 1 Điều 259 BLTTDS: “Cần phải xác minh, thu thập bổ sung tài liệu, chứng cứ mà nếu không thực hiện thì không thể giải quyết được vụ án và không thể thực hiện được ngay tại phiên tòa”"},{"id":"ksdd094","cat":"ksdd","topic":"Phiên tòa sơ thẩm","q":"Theo BLTTDS, thời hạn tạm ngừng phiên tòa là bao lâu và hết thời hạn mà lý do tạm ngừng chưa được khắc phục thì xử lý thế nào?","o":["Không quá 01 tháng; chưa khắc phục được lý do thì ra quyết định tạm đình chỉ giải quyết vụ án","Không quá 05 ngày làm việc; hết thời hạn thì tiếp tục xét xử","Không quá 02 tháng; hết thời hạn thì hoãn phiên tòa","Không quá 15 ngày; hết thời hạn thì Hội đồng xét xử đình chỉ giải quyết vụ án"],"a":0,"ref":"Khoản 2 Điều 259 BLTTDS: “Thời hạn tạm ngừng phiên tòa là không quá 01 tháng, kể từ ngày Hội đồng xét xử quyết định tạm ngừng phiên tòa” … “nếu lý do để ngừng phiên tòa chưa được khắc phục thì Hội đồng xét xử ra quyết định tạm đình chỉ giải quyết vụ án dân sự”"},{"id":"ksdd095","cat":"ksdd","topic":"Phiên tòa sơ thẩm","q":"Theo BLTTDS, Kiểm sát viên phát biểu ý kiến về việc tuân theo pháp luật tố tụng trong khoảng thời gian nào của quá trình giải quyết vụ án?","o":["Chỉ trong thời gian diễn ra phiên tòa","Kể từ khi có quyết định đưa vụ án ra xét xử đến khi kết thúc tranh luận","Kể từ khi thụ lý cho đến trước thời điểm Hội đồng xét xử nghị án","Kể từ khi nhận đơn khởi kiện cho đến khi tuyên án"],"a":2,"ref":"Điều 262 BLTTDS: “trong quá trình giải quyết vụ án kể từ khi thụ lý cho đến trước thời điểm Hội đồng xét xử nghị án”"},{"id":"ksdd096","cat":"ksdd","topic":"Phiên tòa sơ thẩm","q":"Theo BLTTDS, Kiểm sát viên phải gửi văn bản phát biểu ý kiến tại phiên tòa sơ thẩm cho Tòa án khi nào?","o":["Cùng với quyết định kháng nghị (nếu có)","Trong thời hạn 03 ngày làm việc kể từ ngày kết thúc phiên tòa","Trong thời hạn 10 ngày kể từ ngày tuyên án","Ngay sau khi kết thúc phiên tòa"],"a":3,"ref":"Điều 262 BLTTDS: “Ngay sau khi kết thúc phiên tòa, Kiểm sát viên phải gửi văn bản phát biểu ý kiến cho Tòa án để lưu vào hồ sơ vụ án”"},{"id":"ksdd097","cat":"ksdd","topic":"Phiên tòa sơ thẩm","q":"Theo BLTTDS, trong thời hạn bao lâu kể từ ngày tuyên án, Tòa án phải giao hoặc gửi bản án cho Viện kiểm sát cùng cấp?","o":["05 ngày làm việc","10 ngày","15 ngày","03 ngày làm việc"],"a":1,"ref":"Khoản 2 Điều 269 BLTTDS: “Trong thời hạn 10 ngày, kể từ ngày tuyên án, Tòa án phải giao hoặc gửi bản án cho các đương sự, cơ quan, tổ chức, cá nhân khởi kiện và Viện kiểm sát cùng cấp”"},{"id":"ksdd098","cat":"ksdd","topic":"Kháng cáo, kháng nghị phúc thẩm","q":"Theo BLTTDS, ai có quyền kháng nghị bản án sơ thẩm theo thủ tục phúc thẩm?","o":["Chỉ Viện trưởng Viện kiểm sát cấp trên trực tiếp","Chỉ Viện trưởng Viện kiểm sát nhân dân tối cao","Viện trưởng Viện kiểm sát cùng cấp và cấp trên trực tiếp","Kiểm sát viên đã tham gia phiên tòa sơ thẩm"],"a":2,"ref":"Điều 278 BLTTDS: “Viện trưởng Viện kiểm sát cùng cấp và cấp trên trực tiếp có quyền kháng nghị bản án sơ thẩm”"},{"id":"ksdd099","cat":"ksdd","topic":"Kháng cáo, kháng nghị phúc thẩm","q":"Theo BLTTDS, văn bản nào sau đây của Tòa án cấp sơ thẩm KHÔNG thuộc đối tượng kháng nghị theo thủ tục phúc thẩm?","o":["Quyết định tạm đình chỉ giải quyết vụ án dân sự","Bản án sơ thẩm","Quyết định công nhận sự thỏa thuận của các đương sự","Quyết định đình chỉ giải quyết vụ án dân sự"],"a":2,"ref":"Điều 278; khoản 1 Điều 213 BLTTDS: “có quyền kháng nghị bản án sơ thẩm, quyết định tạm đình chỉ giải quyết vụ án dân sự, quyết định đình chỉ giải quyết vụ án dân sự của Tòa án cấp sơ thẩm” … “không bị kháng cáo, kháng nghị theo thủ tục phúc thẩm”"},{"id":"ksdd100","cat":"ksdd","topic":"Kháng cáo, kháng nghị phúc thẩm","q":"Theo BLTTDS, nội dung nào sau đây là nội dung chính bắt buộc của quyết định kháng nghị phúc thẩm?","o":["Lý do của việc kháng nghị và yêu cầu của Viện kiểm sát","Danh sách người làm chứng sẽ triệu tập tại phiên tòa phúc thẩm","Ý kiến của các đương sự về kháng nghị","Ý kiến của Tòa án cấp sơ thẩm về kháng nghị"],"a":0,"ref":"Khoản 1 Điều 279 BLTTDS: “d) Lý do của việc kháng nghị và yêu cầu của Viện kiểm sát”"},{"id":"ksdd101","cat":"ksdd","topic":"Kháng cáo, kháng nghị phúc thẩm","q":"Theo BLTTDS, thời hạn kháng nghị bản án sơ thẩm của Viện kiểm sát cùng cấp và Viện kiểm sát cấp trên trực tiếp lần lượt là bao lâu kể từ ngày tuyên án?","o":["10 ngày và 15 ngày","15 ngày và 30 ngày kể từ ngày nhận bản án","01 tháng và 02 tháng","15 ngày và 01 tháng"],"a":3,"ref":"Khoản 1 Điều 280 BLTTDS: “Thời hạn kháng nghị đối với bản án của Tòa án cấp sơ thẩm của Viện kiểm sát cùng cấp là 15 ngày, của Viện kiểm sát cấp trên trực tiếp là 01 tháng, kể từ ngày tuyên án”"},{"id":"ksdd102","cat":"ksdd","topic":"Kháng cáo, kháng nghị phúc thẩm","q":"Theo BLTTDS, trường hợp Kiểm sát viên không tham gia phiên tòa sơ thẩm thì thời hạn kháng nghị bản án được tính từ ngày nào?","o":["Ngày bản án được niêm yết","Ngày tuyên án","Ngày Viện kiểm sát cùng cấp nhận được bản án","Ngày Viện kiểm sát cấp trên nhận được bản án"],"a":2,"ref":"Khoản 1 Điều 280 BLTTDS: “Trường hợp Kiểm sát viên không tham gia phiên tòa thì thời hạn kháng nghị tính từ ngày Viện kiểm sát cùng cấp nhận được bản án”"},{"id":"ksdd103","cat":"ksdd","topic":"Kháng cáo, kháng nghị phúc thẩm","q":"Theo BLTTDS, thời hạn kháng nghị của Viện kiểm sát cùng cấp và cấp trên trực tiếp đối với quyết định tạm đình chỉ, quyết định đình chỉ giải quyết vụ án là bao lâu?","o":["07 ngày và 10 ngày, kể từ ngày Viện kiểm sát cùng cấp nhận được quyết định","15 ngày và 01 tháng, kể từ ngày Tòa án ra quyết định","10 ngày và 15 ngày, kể từ ngày đương sự nhận được quyết định","03 ngày làm việc và 07 ngày, kể từ ngày Tòa án ra quyết định"],"a":0,"ref":"Khoản 2 Điều 280 BLTTDS: “Thời hạn kháng nghị của Viện kiểm sát cùng cấp đối với quyết định tạm đình chỉ, quyết định đình chỉ giải quyết vụ án của Tòa án cấp sơ thẩm là 07 ngày, của Viện kiểm sát cấp trên trực tiếp là 10 ngày, kể từ ngày Viện kiểm sát cùng cấp nhận được quyết định”"},{"id":"ksdd104","cat":"ksdd","topic":"Kháng cáo, kháng nghị phúc thẩm","q":"Theo BLTTDS, khi Tòa án nhận được quyết định kháng nghị phúc thẩm đã quá thời hạn thì Tòa án cấp sơ thẩm xử lý thế nào?","o":["Mở phiên họp xét kháng nghị quá hạn có Hội thẩm tham gia","Yêu cầu Viện kiểm sát giải thích bằng văn bản và nêu rõ lý do","Tự động chấp nhận kháng nghị","Trả lại ngay quyết định kháng nghị"],"a":1,"ref":"Khoản 3 Điều 280 BLTTDS: “Tòa án cấp sơ thẩm yêu cầu Viện kiểm sát giải thích bằng văn bản và nêu rõ lý do”"},{"id":"ksdd105","cat":"ksdd","topic":"Kháng cáo, kháng nghị phúc thẩm","q":"Theo BLTTDS, khi chưa hết thời hạn kháng nghị, Viện kiểm sát đã kháng nghị có quyền thay đổi, bổ sung kháng nghị như thế nào?","o":["Chỉ được thu hẹp phạm vi kháng nghị","Không bị giới hạn bởi phạm vi kháng nghị ban đầu","Chỉ được thay đổi khi Tòa án cấp phúc thẩm đồng ý","Không được vượt quá phạm vi kháng nghị ban đầu"],"a":1,"ref":"Khoản 1 Điều 284 BLTTDS: “Viện kiểm sát đã kháng nghị có quyền thay đổi, bổ sung kháng nghị mà không bị giới hạn bởi phạm vi kháng nghị ban đầu”"},{"id":"ksdd106","cat":"ksdd","topic":"Kháng cáo, kháng nghị phúc thẩm","q":"Theo BLTTDS, khi thời hạn kháng nghị đã hết, trước khi bắt đầu phiên tòa hoặc tại phiên tòa phúc thẩm, Viện kiểm sát có quyền thay đổi, bổ sung kháng nghị như thế nào?","o":["Chỉ được bổ sung khi có kháng cáo của đương sự về cùng nội dung","Không được thay đổi, bổ sung kháng nghị trong mọi trường hợp","Được thay đổi, bổ sung nhưng không vượt quá phạm vi kháng nghị ban đầu","Được thay đổi, bổ sung không giới hạn phạm vi kháng nghị ban đầu"],"a":2,"ref":"Khoản 2 Điều 284 BLTTDS: “Viện kiểm sát đã kháng nghị có quyền thay đổi, bổ sung kháng nghị, nhưng không được vượt quá phạm vi kháng cáo, kháng nghị ban đầu, nếu thời hạn kháng cáo, kháng nghị đã hết”"},{"id":"ksdd107","cat":"ksdd","topic":"Kháng cáo, kháng nghị phúc thẩm","q":"Theo BLTTDS, trước khi bắt đầu phiên tòa hoặc tại phiên tòa phúc thẩm, chủ thể nào có quyền rút kháng nghị phúc thẩm?","o":["VKS đã kháng nghị hoặc VKS cấp trên trực tiếp","Tòa án cấp phúc thẩm theo đề nghị của đương sự","Đương sự có liên quan đến kháng nghị","Chỉ Viện trưởng Viện kiểm sát nhân dân tối cao"],"a":0,"ref":"Khoản 3 Điều 284 BLTTDS: “Viện kiểm sát đã kháng nghị hoặc Viện kiểm sát cấp trên trực tiếp có quyền rút kháng nghị”"},{"id":"ksdd108","cat":"ksdd","topic":"Kháng cáo, kháng nghị phúc thẩm","q":"Theo BLTTDS, phạm vi xét xử phúc thẩm được xác định như thế nào?","o":["Xem xét lại toàn bộ bản án sơ thẩm trong mọi trường hợp, kể cả phần không bị kháng cáo, kháng nghị","Chỉ phần bản án có kháng cáo, kháng nghị hoặc có liên quan đến việc xem xét nội dung kháng cáo, kháng nghị","Xem xét lại toàn bộ vụ án như xét xử sơ thẩm lần thứ hai, không phụ thuộc kháng cáo, kháng nghị","Chỉ xem xét phần bản án có kháng nghị của Viện kiểm sát, không xem xét phần bị kháng cáo"],"a":1,"ref":"Điều 293 BLTTDS: “Tòa án cấp phúc thẩm chỉ xem xét lại phần của bản án sơ thẩm, quyết định của Tòa án cấp sơ thẩm có kháng cáo, kháng nghị hoặc có liên quan đến việc xem xét nội dung kháng cáo, kháng nghị”"},{"id":"ksdd109","cat":"ksdd","topic":"Kháng cáo, kháng nghị phúc thẩm","q":"Theo BLTTDS, Hội đồng xét xử phúc thẩm sửa bản án sơ thẩm trong trường hợp việc thu thập chứng cứ và chứng minh chưa được thực hiện đầy đủ ở cấp sơ thẩm khi nào?","o":["Không được sửa, bắt buộc phải hủy bản án","Khi Viện kiểm sát có văn bản đồng ý","Khi tại phiên tòa phúc thẩm đã được bổ sung đầy đủ","Khi các đương sự đồng ý để Tòa án cấp phúc thẩm sửa"],"a":2,"ref":"Khoản 2 Điều 309 BLTTDS: “Việc thu thập chứng cứ và chứng minh chưa được thực hiện đầy đủ ở cấp sơ thẩm nhưng tại phiên tòa phúc thẩm đã được bổ sung đầy đủ”"},{"id":"ksdd110","cat":"ksdd","topic":"Kháng cáo, kháng nghị phúc thẩm","q":"Theo BLTTDS, Hội đồng xét xử phúc thẩm hủy bản án sơ thẩm, chuyển hồ sơ giải quyết lại theo thủ tục sơ thẩm khi thuộc trường hợp nào sau đây?","o":["Thu thập chứng cứ, chứng minh không đúng Chương VII hoặc chưa đầy đủ mà phúc thẩm không bổ sung được","Bản án sơ thẩm áp dụng điều luật đúng nhưng mức bồi thường chưa phù hợp với chứng cứ đã có","Viện kiểm sát kháng nghị đúng thời hạn và đề nghị Hội đồng xét xử phúc thẩm hủy bản án","Đương sự kháng cáo toàn bộ bản án sơ thẩm và cung cấp thêm chứng cứ mới tại phiên tòa phúc thẩm"],"a":0,"ref":"Khoản 1 Điều 310 BLTTDS: “Việc thu thập chứng cứ và chứng minh không theo đúng quy định tại Chương VII của Bộ luật này hoặc chưa được thực hiện đầy đủ mà tại phiên tòa phúc thẩm không thể thực hiện bổ sung được”"},{"id":"ksdd111","cat":"ksdd","topic":"Giám đốc thẩm, tái thẩm","q":"Theo BLTTDS, trường hợp nào sau đây là căn cứ để kháng nghị theo thủ tục GIÁM ĐỐC THẨM?","o":["Có giả mạo chứng cứ được phát hiện sau khi bản án có hiệu lực","Đương sự không đồng ý với mức án phí","Mới phát hiện được tình tiết quan trọng mà đương sự không thể biết được trong quá trình giải quyết vụ án","Có vi phạm nghiêm trọng thủ tục tố tụng làm cho đương sự không thực hiện được quyền, nghĩa vụ tố tụng của mình"],"a":3,"ref":"Điểm b khoản 1 Điều 326 BLTTDS: “Có vi phạm nghiêm trọng thủ tục tố tụng làm cho đương sự không thực hiện được quyền, nghĩa vụ tố tụng của mình”"},{"id":"ksdd112","cat":"ksdd","topic":"Giám đốc thẩm, tái thẩm","q":"Theo BLTTDS, trường hợp nào người có thẩm quyền kháng nghị giám đốc thẩm không cần phải có đơn đề nghị, thông báo, kiến nghị?","o":["Trường hợp xâm phạm đến lợi ích công cộng, lợi ích của Nhà nước, quyền, lợi ích hợp pháp của người thứ ba","Trường hợp bản án có giá trị tài sản tranh chấp từ 01 tỷ đồng trở lên","Trường hợp bản án, quyết định đã có hiệu lực của Tòa án nhân dân cấp tỉnh","Trường hợp đương sự đã chết mà không có người thừa kế quyền, nghĩa vụ tố tụng"],"a":0,"ref":"Khoản 2 Điều 326 BLTTDS: “trường hợp xâm phạm đến lợi ích công cộng, lợi ích của Nhà nước, quyền, lợi ích hợp pháp của người thứ ba thì không cần phải có đơn đề nghị”"},{"id":"ksdd113","cat":"ksdd","topic":"Giám đốc thẩm, tái thẩm","q":"Theo BLTTDS, đương sự có quyền đề nghị bằng văn bản với người có thẩm quyền kháng nghị giám đốc thẩm trong thời hạn bao lâu?","o":["06 tháng, kể từ ngày tuyên án phúc thẩm","02 năm, kể từ ngày nhận được bản án","03 năm, kể từ ngày bản án, quyết định có hiệu lực pháp luật","01 năm, kể từ ngày bản án, quyết định có hiệu lực pháp luật"],"a":3,"ref":"Khoản 1 Điều 327 BLTTDS: “Trong thời hạn 01 năm, kể từ ngày bản án, quyết định của Tòa án có hiệu lực pháp luật, nếu phát hiện có vi phạm pháp luật trong bản án, quyết định đó thì đương sự có quyền đề nghị bằng văn bản”"},{"id":"ksdd114","cat":"ksdd","topic":"Giám đốc thẩm, tái thẩm","q":"Theo BLTTDS (sửa đổi năm 2025), Viện trưởng Viện kiểm sát nhân dân cấp tỉnh có quyền kháng nghị giám đốc thẩm đối với bản án, quyết định nào?","o":["Mọi bản án, quyết định đã có hiệu lực pháp luật trên cả nước","Bản án, quyết định có hiệu lực của Tòa án nhân dân khu vực trong phạm vi thẩm quyền theo lãnh thổ","Quyết định giám đốc thẩm của Hội đồng Thẩm phán Tòa án nhân dân tối cao","Bản án, quyết định đã có hiệu lực pháp luật của Tòa án nhân dân cấp tỉnh"],"a":1,"ref":"Khoản 2 Điều 331 BLTTDS: “Chánh án Tòa án nhân dân cấp tỉnh, Viện trưởng Viện kiểm sát nhân dân cấp tỉnh có quyền kháng nghị theo thủ tục giám đốc thẩm bản án, quyết định đã có hiệu lực pháp luật của Tòa án nhân dân khu vực trong phạm vi thẩm quyền theo lãnh thổ”"},{"id":"ksdd115","cat":"ksdd","topic":"Giám đốc thẩm, tái thẩm","q":"Theo BLTTDS, thời hạn kháng nghị theo thủ tục giám đốc thẩm (trường hợp thông thường) là bao lâu?","o":["03 năm, kể từ ngày bản án, quyết định có hiệu lực pháp luật","01 năm, kể từ ngày bản án, quyết định có hiệu lực pháp luật","02 năm, kể từ ngày tuyên án phúc thẩm","05 năm, kể từ ngày bản án, quyết định có hiệu lực pháp luật"],"a":0,"ref":"Khoản 1 Điều 334 BLTTDS: “có quyền kháng nghị trong thời hạn 03 năm, kể từ ngày bản án, quyết định của Tòa án có hiệu lực pháp luật”"},{"id":"ksdd116","cat":"ksdd","topic":"Giám đốc thẩm, tái thẩm","q":"Theo BLTTDS, trường hợp nào sau đây là căn cứ để kháng nghị theo thủ tục TÁI THẨM?","o":["Thành phần Hội đồng xét xử sơ thẩm không đúng quy định của BLTTDS","Có sai lầm nghiêm trọng trong việc áp dụng pháp luật dẫn đến bản án không đúng","Mới phát hiện tình tiết quan trọng mà đương sự không thể biết được khi giải quyết vụ án","Kết luận trong bản án không phù hợp với những tình tiết khách quan của vụ án"],"a":2,"ref":"Khoản 1 Điều 352 BLTTDS: “Mới phát hiện được tình tiết quan trọng của vụ án mà đương sự đã không thể biết được trong quá trình giải quyết vụ án”"},{"id":"ksdd117","cat":"ksdd","topic":"Giám đốc thẩm, tái thẩm","q":"Theo BLTTDS, Tòa án căn cứ vào một quyết định của cơ quan nhà nước để giải quyết vụ án, sau khi bản án có hiệu lực thì quyết định đó bị hủy bỏ. Trường hợp này là căn cứ kháng nghị theo thủ tục nào?","o":["Thủ tục đặc biệt","Tái thẩm","Giám đốc thẩm","Phúc thẩm"],"a":1,"ref":"Khoản 4 Điều 352 BLTTDS: “Bản án, quyết định hình sự, hành chính, dân sự, hôn nhân và gia đình, kinh doanh, thương mại, lao động của Tòa án hoặc quyết định của cơ quan nhà nước mà Tòa án căn cứ vào đó để giải quyết vụ án đã bị hủy bỏ” … “Căn cứ để kháng nghị theo thủ tục tái thẩm”"},{"id":"ksdd118","cat":"ksdd","topic":"Giám đốc thẩm, tái thẩm","q":"Theo BLTTDS, thời hạn kháng nghị theo thủ tục tái thẩm là bao lâu?","o":["03 năm, kể từ ngày bản án, quyết định có hiệu lực pháp luật","01 năm, kể từ ngày bản án, quyết định có hiệu lực pháp luật","02 năm, kể từ ngày đương sự có đơn đề nghị tái thẩm","01 năm, kể từ ngày người có thẩm quyền biết được căn cứ kháng nghị"],"a":3,"ref":"Điều 355 BLTTDS: “Thời hạn kháng nghị theo thủ tục tái thẩm là 01 năm, kể từ ngày người có thẩm quyền kháng nghị biết được căn cứ để kháng nghị theo thủ tục tái thẩm”"},{"id":"ksdd119","cat":"ksdd","topic":"Luật Đất đai: khái niệm, người sử dụng đất","q":"Theo Luật Đất đai 2024, \"tranh chấp đất đai\" được hiểu là gì?","o":["Mọi tranh chấp có liên quan đến tài sản gắn liền với đất","Tranh chấp về quyền, nghĩa vụ của người sử dụng đất giữa hai hoặc nhiều bên trong quan hệ đất đai","Tranh chấp về hợp đồng có đối tượng là quyền sử dụng đất","Tranh chấp giữa người sử dụng đất với cơ quan nhà nước về quyết định hành chính"],"a":1,"ref":"Khoản 47 Điều 3 Luật Đất đai 2024: “Tranh chấp đất đai là tranh chấp về quyền, nghĩa vụ của người sử dụng đất giữa hai hoặc nhiều bên trong quan hệ đất đai”"},{"id":"ksdd120","cat":"ksdd","topic":"Luật Đất đai: khái niệm, người sử dụng đất","q":"Theo Luật Đất đai 2024, \"đất đang có tranh chấp\" là gì?","o":["Thửa đất chưa được cấp Giấy chứng nhận","Thửa đất có người khác xác lập quyền đối với thửa đất liền kề","Thửa đất đã có đơn yêu cầu hòa giải nhưng một bên đã rút đơn","Thửa đất có tranh chấp đang được cơ quan có thẩm quyền giải quyết"],"a":3,"ref":"Khoản 16 Điều 3 Luật Đất đai 2024: “Đất đang có tranh chấp là thửa đất có tranh chấp đất đai mà đang trong quá trình được cơ quan có thẩm quyền giải quyết”"},{"id":"ksdd121","cat":"ksdd","topic":"Luật Đất đai: khái niệm, người sử dụng đất","q":"Theo Luật Đất đai 2024, hành vi người sử dụng đất chuyển dịch mốc giới hoặc ranh giới thửa đất để mở rộng diện tích sử dụng mà không được cơ quan có thẩm quyền hoặc người sử dụng hợp pháp diện tích bị ảnh hưởng cho phép được gọi là gì?","o":["Chiếm đất","Lấn đất","Chuyển mục đích sử dụng đất","Hủy hoại đất"],"a":1,"ref":"Khoản 31 Điều 3 Luật Đất đai 2024: “Lấn đất là việc người sử dụng đất chuyển dịch mốc giới hoặc ranh giới thửa đất để mở rộng diện tích đất sử dụng mà không được cơ quan nhà nước có thẩm quyền cho phép hoặc không được người sử dụng hợp pháp diện tích đất bị lấn đó cho phép”"},{"id":"ksdd122","cat":"ksdd","topic":"Luật Đất đai: khái niệm, người sử dụng đất","q":"Theo Luật Đất đai 2024, hình thức nào sau đây KHÔNG thuộc \"chuyển quyền sử dụng đất\"?","o":["Tặng cho quyền sử dụng đất","Thừa kế quyền sử dụng đất","Góp vốn bằng quyền sử dụng đất","Thế chấp quyền sử dụng đất"],"a":3,"ref":"Khoản 12 Điều 3 Luật Đất đai 2024: “Chuyển quyền sử dụng đất là việc chuyển giao quyền sử dụng đất từ người này sang người khác thông qua hình thức chuyển đổi, chuyển nhượng, thừa kế, tặng cho quyền sử dụng đất, góp vốn bằng quyền sử dụng đất”"},{"id":"ksdd123","cat":"ksdd","topic":"Luật Đất đai: khái niệm, người sử dụng đất","q":"Theo Luật Đất đai 2024, các thành viên \"hộ gia đình sử dụng đất\" được xác định là những người có quan hệ hôn nhân, huyết thống, nuôi dưỡng, đang sống chung và có quyền sử dụng đất chung tại thời điểm nào?","o":["Thời điểm Tòa án thụ lý vụ án tranh chấp quyền sử dụng đất của hộ gia đình","Thời điểm được Nhà nước giao đất, cho thuê đất, công nhận quyền sử dụng đất, nhận chuyển quyền sử dụng đất","Thời điểm cấp đổi Giấy chứng nhận gần nhất theo danh sách nhân khẩu khi cấp đổi","Thời điểm phát sinh tranh chấp đất đai giữa các thành viên trong hộ gia đình"],"a":1,"ref":"Khoản 25 Điều 3 Luật Đất đai 2024: “đang sống chung và có quyền sử dụng đất chung tại thời điểm được Nhà nước giao đất, cho thuê đất, công nhận quyền sử dụng đất, nhận chuyển quyền sử dụng đất trước ngày Luật này có hiệu lực thi hành”"},{"id":"ksdd124","cat":"ksdd","topic":"Luật Đất đai: khái niệm, người sử dụng đất","q":"Theo Luật Đất đai 2024, hộ gia đình sử dụng đất được xác định theo pháp luật trước ngày Luật có hiệu lực thì tham gia quan hệ pháp luật về đất đai với tư cách gì?","o":["Tổ chức kinh tế có tư cách pháp nhân","Pháp nhân do chủ hộ làm người đại diện theo pháp luật","Nhóm người sử dụng đất mà có chung quyền sử dụng đất","Cộng đồng dân cư cùng sinh sống trên địa bàn"],"a":2,"ref":"Khoản 1 Điều 259 Luật Đất đai 2024: “được tham gia quan hệ pháp luật về đất đai với tư cách nhóm người sử dụng đất mà có chung quyền sử dụng đất quy định tại khoản 2 Điều 27 của Luật này”"},{"id":"ksdd125","cat":"ksdd","topic":"Luật Đất đai: quyền, điều kiện giao dịch QSDĐ","q":"Theo Luật Đất đai 2024, những hợp đồng nào sau đây phải được công chứng hoặc chứng thực (trừ trường hợp luật quy định khác)?","o":["Hợp đồng chuyển đổi quyền sử dụng đất nông nghiệp","Hợp đồng hợp tác sản xuất, kinh doanh bằng quyền sử dụng đất","Hợp đồng cho thuê, cho thuê lại quyền sử dụng đất","Hợp đồng chuyển nhượng, tặng cho, thế chấp, góp vốn bằng quyền sử dụng đất"],"a":3,"ref":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024: “Hợp đồng chuyển nhượng, tặng cho, thế chấp, góp vốn bằng quyền sử dụng đất, quyền sử dụng đất và tài sản gắn liền với đất phải được công chứng hoặc chứng thực, trừ trường hợp quy định tại điểm b khoản này”"},{"id":"ksdd126","cat":"ksdd","topic":"Luật Đất đai: quyền, điều kiện giao dịch QSDĐ","q":"Theo Luật Đất đai 2024, hợp đồng nào sau đây được công chứng hoặc chứng thực THEO YÊU CẦU của các bên?","o":["Hợp đồng chuyển nhượng quyền sử dụng đất giữa hai cá nhân không kinh doanh bất động sản","Hợp đồng tặng cho quyền sử dụng đất giữa hai cá nhân","Hợp đồng chuyển đổi quyền sử dụng đất nông nghiệp","Hợp đồng thế chấp quyền sử dụng đất"],"a":2,"ref":"Điểm b khoản 3 Điều 27 Luật Đất đai 2024: “hợp đồng chuyển đổi quyền sử dụng đất nông nghiệp” … “được công chứng hoặc chứng thực theo yêu cầu của các bên”"},{"id":"ksdd127","cat":"ksdd","topic":"Luật Đất đai: quyền, điều kiện giao dịch QSDĐ","q":"Theo Luật Đất đai 2024, trường hợp quyền sử dụng đất của nhóm người sử dụng đất không phân chia được theo phần thì quyền và nghĩa vụ được thực hiện thế nào?","o":["Các thành viên cùng thực hiện hoặc ủy quyền cho người đại diện","Thành viên có phần đóng góp lớn nhất quyết định","Theo quyết định của Ủy ban nhân dân cấp xã","Người đứng tên đầu tiên trên Giấy chứng nhận tự quyết định"],"a":0,"ref":"Điểm b khoản 2 Điều 27 Luật Đất đai 2024: “Trường hợp quyền sử dụng đất của nhóm người sử dụng đất không phân chia được theo phần thì các thành viên cùng nhau thực hiện hoặc ủy quyền cho người đại diện để thực hiện quyền và nghĩa vụ của nhóm người sử dụng đất”"},{"id":"ksdd128","cat":"ksdd","topic":"Luật Đất đai: quyền, điều kiện giao dịch QSDĐ","q":"Theo Luật Đất đai 2024, điều kiện nào sau đây là một trong các điều kiện để người sử dụng đất được thực hiện quyền chuyển nhượng quyền sử dụng đất?","o":["Có xác nhận không nợ thuế của năm tiếp theo","Được Ủy ban nhân dân cấp xã đồng ý bằng văn bản","Trong thời hạn sử dụng đất","Đã sử dụng đất ổn định tối thiểu 05 năm"],"a":2,"ref":"Khoản 1 Điều 45 Luật Đất đai 2024: “d) Trong thời hạn sử dụng đất”"},{"id":"ksdd129","cat":"ksdd","topic":"Luật Đất đai: quyền, điều kiện giao dịch QSDĐ","q":"Theo Luật Đất đai 2024, quyền sử dụng đất đang bị Tòa án áp dụng biện pháp khẩn cấp tạm thời thì người sử dụng đất có được chuyển nhượng không?","o":["Được, nếu Ủy ban nhân dân cấp xã xác nhận","Được, nếu hợp đồng được công chứng","Được, nếu bên nhận chuyển nhượng biết rõ tình trạng đất","Không được chuyển nhượng"],"a":3,"ref":"Điểm đ khoản 1 Điều 45 Luật Đất đai 2024: “Quyền sử dụng đất không bị áp dụng biện pháp khẩn cấp tạm thời theo quy định của pháp luật” … “khi có đủ các điều kiện sau đây”"},{"id":"ksdd130","cat":"ksdd","topic":"Luật Đất đai: quyền, điều kiện giao dịch QSDĐ","q":"Theo Luật Đất đai 2024, đối với điều kiện về tranh chấp, người sử dụng đất được thực hiện quyền chuyển nhượng khi nào?","o":["Đất có tranh chấp nhưng đã hòa giải không thành tại Ủy ban nhân dân cấp xã nơi có đất","Đất không có tranh chấp hoặc tranh chấp đã được giải quyết bằng văn bản có hiệu lực pháp luật của cơ quan có thẩm quyền","Đất có tranh chấp nhưng người chuyển nhượng đã được cấp Giấy chứng nhận","Đất có tranh chấp nhưng bên nhận chuyển nhượng cam kết bằng văn bản tự giải quyết tranh chấp"],"a":1,"ref":"Điểm b khoản 1 Điều 45 Luật Đất đai 2024: “Đất không có tranh chấp hoặc tranh chấp đã được giải quyết bởi cơ quan nhà nước có thẩm quyền, bản án, quyết định của Tòa án, quyết định hoặc phán quyết của Trọng tài đã có hiệu lực pháp luật”"},{"id":"ksdd131","cat":"ksdd","topic":"Luật Đất đai: quyền, điều kiện giao dịch QSDĐ","q":"Theo Luật Đất đai 2024, trường hợp nào sau đây người sử dụng đất được thực hiện quyền mà KHÔNG cần điều kiện có Giấy chứng nhận?","o":["Chuyển nhượng quyền sử dụng đất cho người thân","Thừa kế quyền sử dụng đất","Thế chấp quyền sử dụng đất tại ngân hàng","Góp vốn bằng quyền sử dụng đất thành lập doanh nghiệp"],"a":1,"ref":"Điểm a khoản 1 Điều 45 Luật Đất đai 2024: “trừ trường hợp thừa kế quyền sử dụng đất, chuyển đổi đất nông nghiệp khi dồn điền, đổi thửa, tặng cho quyền sử dụng đất cho Nhà nước, cộng đồng dân cư”"},{"id":"ksdd132","cat":"ksdd","topic":"Luật Đất đai: quyền, điều kiện giao dịch QSDĐ","q":"Theo Luật Đất đai 2024, người nhận thừa kế quyền sử dụng đất được thực hiện các quyền của người sử dụng đất khi nào?","o":["Ngay tại thời điểm mở thừa kế, không cần điều kiện nào khác","Khi được Ủy ban nhân dân cấp xã xác nhận là người thừa kế","Khi có văn bản phân chia di sản, không cần công chứng, chứng thực","Khi có Giấy chứng nhận hoặc đủ điều kiện để được cấp Giấy chứng nhận"],"a":3,"ref":"Khoản 4 Điều 45 Luật Đất đai 2024: “hoặc đủ điều kiện để cấp Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất theo quy định của Luật này”"},{"id":"ksdd133","cat":"ksdd","topic":"Luật Đất đai: quyền, điều kiện giao dịch QSDĐ","q":"Theo Luật Đất đai 2024, cá nhân không sinh sống trong khu vực rừng phòng hộ, rừng đặc dụng thì có được nhận chuyển nhượng, nhận tặng cho quyền sử dụng đất ở trong khu vực rừng phòng hộ không?","o":["Được, nếu là người thuộc hàng thừa kế","Được, nếu có hợp đồng công chứng","Không được","Được, nếu diện tích dưới hạn mức đất ở"],"a":2,"ref":"Điểm b khoản 8 Điều 45 Luật Đất đai 2024: “Cá nhân không sinh sống trong khu vực rừng phòng hộ, rừng đặc dụng thì không được nhận chuyển nhượng, nhận tặng cho quyền sử dụng đất ở và đất khác trong khu vực rừng phòng hộ”"},{"id":"ksdd134","cat":"ksdd","topic":"Luật Đất đai: quyền, điều kiện giao dịch QSDĐ","q":"Theo Luật Đất đai 2024, người được thừa kế quyền sử dụng đất là người gốc Việt Nam định cư ở nước ngoài không thuộc đối tượng quy định tại khoản 1 Điều 44 thì được hưởng gì?","o":["Được nhận thừa kế và cấp Giấy chứng nhận như cá nhân trong nước","Được nhận thừa kế nhưng chỉ được sử dụng 50 năm","Không được hưởng thừa kế","Được hưởng giá trị của phần thừa kế đó"],"a":3,"ref":"Điểm đ khoản 1 Điều 37 Luật Đất đai 2024: “nếu không thuộc đối tượng quy định tại khoản 1 Điều 44 của Luật này thì được hưởng giá trị của phần thừa kế đó”"},{"id":"ksdd135","cat":"ksdd","topic":"Luật Đất đai: quyền, điều kiện giao dịch QSDĐ","q":"Theo Luật Đất đai 2024, trường hợp phân chia quyền sử dụng đất theo bản án, quyết định của Tòa án mà việc phân chia không bảo đảm các điều kiện, diện tích, kích thước tách thửa theo quy định thì xử lý thế nào?","o":["Vẫn thực hiện tách thửa theo bản án","Không thực hiện tách thửa","Thực hiện tách thửa sau khi các bên nộp tiền chênh lệch","Thực hiện tách thửa nếu được Ủy ban nhân dân cấp xã đồng ý"],"a":1,"ref":"Điểm c khoản 2 Điều 220 Luật Đất đai 2024: “Trường hợp phân chia quyền sử dụng đất theo bản án, quyết định của Tòa án mà việc phân chia không bảo đảm các điều kiện, diện tích, kích thước tách thửa theo quy định thì không thực hiện tách thửa”"},{"id":"ksdd136","cat":"ksdd","topic":"Luật Đất đai: quyền, điều kiện giao dịch QSDĐ","q":"Theo Luật Đất đai 2024, thửa đất có tranh chấp nhưng xác định được phạm vi diện tích, ranh giới đang tranh chấp thì việc tách thửa được thực hiện thế nào?","o":["Chỉ được tách thửa sau khi có bản án sơ thẩm giải quyết tranh chấp","Không được tách thửa đối với toàn bộ thửa đất cho đến khi giải quyết xong","Phần còn lại không tranh chấp của thửa đất được phép tách thửa, hợp thửa","Được tách thửa toàn bộ nếu bên tranh chấp đồng ý bằng lời nói"],"a":2,"ref":"Điểm c khoản 1 Điều 220 Luật Đất đai 2024: “Trường hợp đất có tranh chấp nhưng xác định được phạm vi diện tích, ranh giới đang tranh chấp thì phần diện tích, ranh giới còn lại không tranh chấp của thửa đất đó được phép tách thửa đất, hợp thửa đất”"},{"id":"ksdd137","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, việc đăng ký đất đai được quy định như thế nào?","o":["Chỉ bắt buộc khi người sử dụng đất chuyển nhượng quyền sử dụng đất","Bắt buộc đối với người sử dụng đất và người được giao đất để quản lý","Chỉ bắt buộc đối với tổ chức được Nhà nước giao đất, cho thuê đất","Tự nguyện, thực hiện theo yêu cầu của người sử dụng đất"],"a":1,"ref":"Khoản 1 Điều 131 Luật Đất đai 2024: “Đăng ký đất đai là bắt buộc đối với người sử dụng đất và người được giao đất để quản lý”"},{"id":"ksdd138","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, đối với trường hợp chuyển nhượng, tặng cho quyền sử dụng đất, người sử dụng đất phải đăng ký biến động trong thời hạn bao lâu kể từ ngày có biến động?","o":["60 ngày","15 ngày","90 ngày","30 ngày"],"a":3,"ref":"Khoản 3 Điều 133 Luật Đất đai 2024: “thì trong thời hạn 30 ngày kể từ ngày có biến động, người sử dụng đất phải đăng ký biến động tại cơ quan có thẩm quyền”"},{"id":"ksdd139","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, trường hợp thừa kế quyền sử dụng đất, thời hạn đăng ký biến động được tính từ thời điểm nào?","o":["Từ ngày phân chia xong di sản là quyền sử dụng đất hoặc ngày bản án, quyết định của Tòa án có hiệu lực","Từ ngày người để lại di sản chết (thời điểm mở thừa kế)","Từ ngày Ủy ban nhân dân cấp xã xác nhận quan hệ nhân thân của người thừa kế","Từ ngày người thừa kế được cấp Giấy chứng nhận đứng tên mình"],"a":0,"ref":"Khoản 3 Điều 133 Luật Đất đai 2024: “trường hợp thừa kế quyền sử dụng đất thì thời hạn đăng ký biến động được tính từ ngày phân chia xong quyền sử dụng đất là di sản thừa kế theo quy định của pháp luật về dân sự hoặc kể từ ngày bản án, quyết định của Tòa án có hiệu lực pháp luật”"},{"id":"ksdd140","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, thửa đất có nhiều người chung quyền sử dụng đất thì cấp Giấy chứng nhận thế nào?","o":["Cấp 01 Giấy chứng nhận đứng tên người có phần quyền sử dụng đất lớn nhất","Cấp mỗi người 01 Giấy chứng nhận; nếu họ yêu cầu thì cấp chung 01 Giấy và trao cho người đại diện","Chỉ cấp 01 Giấy chứng nhận đứng tên người lớn tuổi nhất và trao cho người đó","Không cấp Giấy chứng nhận cho đến khi những người có chung quyền chia xong đất"],"a":1,"ref":"Khoản 2 Điều 135 Luật Đất đai 2024: “thì cấp cho mỗi người 01 Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất; trường hợp những người có chung quyền sử dụng đất, chung quyền sở hữu tài sản gắn liền với đất có yêu cầu thì cấp chung 01 Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất và trao cho người đại diện”"},{"id":"ksdd141","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, quyền sử dụng đất là tài sản chung của vợ và chồng thì Giấy chứng nhận ghi tên như thế nào?","o":["Ghi cả họ, tên vợ và chồng, trừ khi vợ chồng thỏa thuận ghi tên một người đại diện","Chỉ ghi họ, tên người chồng là chủ hộ; người vợ được ghi chú tại trang bổ sung","Ghi họ, tên người trực tiếp nộp hồ sơ đề nghị cấp Giấy chứng nhận","Ghi họ, tên người có đóng góp nhiều hơn trong việc tạo lập quyền sử dụng đất"],"a":0,"ref":"Khoản 4 Điều 135 Luật Đất đai 2024: “thì phải ghi cả họ, tên vợ và họ, tên chồng vào Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất, trừ trường hợp vợ và chồng có thỏa thuận ghi tên một người để đứng tên làm đại diện cho vợ và chồng”"},{"id":"ksdd142","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, thửa đất thuộc quyền sử dụng của hộ gia đình thì Giấy chứng nhận được cấp như thế nào (trường hợp không có yêu cầu khác)?","o":["Ghi chung cụm từ \"hộ gia đình\" kèm tên chủ hộ, không ghi tên thành viên","Chỉ ghi tên chủ hộ trên Giấy chứng nhận, không ghi tên các thành viên khác","Cấp một Giấy chứng nhận ghi đầy đủ tên các thành viên có chung quyền sử dụng đất, trao cho người đại diện","Cấp cho mỗi thành viên của hộ gia đình một Giấy chứng nhận riêng"],"a":2,"ref":"Khoản 5 Điều 135 Luật Đất đai 2024: “thì cấp một Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất ghi đầy đủ tên thành viên có chung quyền sử dụng đất của hộ gia đình trên Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất và trao cho người đại diện”"},{"id":"ksdd143","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, có chênh lệch diện tích giữa số liệu đo đạc thực tế với giấy tờ đã cấp, nhưng ranh giới thửa đất không thay đổi và không có tranh chấp với người sử dụng đất liền kề thì diện tích được xác định theo số liệu nào khi cấp, cấp đổi Giấy chứng nhận?","o":["Số liệu ghi trên Giấy chứng nhận đã cấp","Số liệu do các bên liền kề thỏa thuận","Số liệu đo đạc thực tế","Số liệu trung bình giữa hai nguồn"],"a":2,"ref":"Khoản 6 Điều 135 Luật Đất đai 2024: “diện tích đất được xác định theo số liệu đo đạc thực tế”"},{"id":"ksdd144","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, hộ gia đình, cá nhân đang sử dụng đất ổn định có một trong các loại giấy tờ về quyền sử dụng đất được lập trước ngày nào thì được cấp Giấy chứng nhận và không phải nộp tiền sử dụng đất?","o":["15/10/1993","01/7/2014","18/12/1980","01/7/2004"],"a":0,"ref":"Khoản 1 Điều 137 Luật Đất đai 2024: “Hộ gia đình, cá nhân đang sử dụng đất ổn định mà có một trong các loại giấy tờ được lập trước ngày 15 tháng 10 năm 1993 sau đây thì được cấp Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất và không phải nộp tiền sử dụng đất”"},{"id":"ksdd145","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, giấy tờ được lập trong quá trình thực hiện đăng ký ruộng đất theo văn bản nào sau đây được xác định là giấy tờ về quyền sử dụng đất?","o":["Chỉ thị số 299/TTg ngày 10/11/1980 của Thủ tướng Chính phủ","Chỉ thị số 282/CT-QP ngày 11/7/1991 của Bộ trưởng Bộ Quốc phòng","Pháp lệnh Thừa kế năm 1990","Nghị quyết số 23/2003/QH11 của Quốc hội"],"a":0,"ref":"Điểm e khoản 1 Điều 137 Luật Đất đai 2024: “Một trong các giấy tờ được lập trong quá trình thực hiện đăng ký ruộng đất theo Chỉ thị số 299/TTg ngày 10 tháng 11 năm 1980 của Thủ tướng Chính phủ”"},{"id":"ksdd146","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, hộ gia đình, cá nhân đang sử dụng đất có giấy tờ về quyền sử dụng đất nhưng giấy tờ ghi tên người khác, kèm theo giấy tờ về việc chuyển quyền, chưa làm thủ tục chuyển quyền và đất không có tranh chấp thì có được cấp Giấy chứng nhận không?","o":["Được cấp Giấy chứng nhận; việc thực hiện nghĩa vụ tài chính theo quy định của pháp luật","Chỉ được cấp nếu có bản án của Tòa án","Chỉ được cấp nếu người đứng tên trên giấy tờ còn sống","Không được cấp cho đến khi người đứng tên trên giấy tờ ký hợp đồng mới"],"a":0,"ref":"Khoản 5 Điều 137 Luật Đất đai 2024: “mà trên giấy tờ đó ghi tên người khác, kèm theo giấy tờ về việc chuyển quyền sử dụng đất, nhưng đến trước ngày Luật này có hiệu lực thi hành chưa thực hiện thủ tục chuyển quyền sử dụng đất theo quy định của pháp luật và đất đó không có tranh chấp thì được cấp Giấy chứng nhận”"},{"id":"ksdd147","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, hộ gia đình, cá nhân được sử dụng đất theo bản án, quyết định của Tòa án đã được thi hành thì có được cấp Giấy chứng nhận không?","o":["Chỉ được cấp nếu bản án đã qua giám đốc thẩm","Được cấp; nghĩa vụ tài chính thực hiện theo quy định của pháp luật","Không được cấp, chỉ được ghi nhận vào sổ mục kê","Chỉ được cấp sau 03 năm kể từ ngày bản án có hiệu lực"],"a":1,"ref":"Khoản 6 Điều 137 Luật Đất đai 2024: “Hộ gia đình, cá nhân, cộng đồng dân cư được sử dụng đất theo bản án hoặc quyết định của Tòa án” … “đã được thi hành, văn bản công nhận kết quả hòa giải thành thì được cấp Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất; việc thực hiện nghĩa vụ tài chính theo quy định của pháp luật”"},{"id":"ksdd148","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, mốc thời gian sử dụng đất nào sau đây được Điều 138 quy định khi cấp Giấy chứng nhận cho hộ gia đình, cá nhân sử dụng đất không có giấy tờ, không vi phạm pháp luật đất đai?","o":["Từ ngày 01/7/2004 đến trước ngày 01/01/2025","Từ ngày 30/4/1975 đến trước ngày 18/12/1980","Từ ngày 15/10/1993 đến trước ngày 01/7/2014","Từ ngày 01/7/2014 đến trước ngày 01/8/2024"],"a":2,"ref":"Khoản 3 Điều 138 Luật Đất đai 2024: “Hộ gia đình, cá nhân sử dụng đất từ ngày 15 tháng 10 năm 1993 đến trước ngày 01 tháng 7 năm 2014”"},{"id":"ksdd149","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, trường hợp nào sau đây người sử dụng đất KHÔNG được cấp Giấy chứng nhận?","o":["Đất đang có tranh chấp, đang bị kê biên hoặc quyền sử dụng đất đang bị áp dụng biện pháp khẩn cấp tạm thời","Đất có giấy tờ ghi tên người khác kèm giấy tờ chuyển quyền, không tranh chấp","Đất có chênh lệch diện tích nhưng ranh giới không thay đổi","Đất được sử dụng theo bản án của Tòa án đã được thi hành"],"a":0,"ref":"Điểm e khoản 1 Điều 151 Luật Đất đai 2024: “Đất đang có tranh chấp, đang bị kê biên, áp dụng biện pháp khác để bảo đảm thi hành án theo quy định của pháp luật về thi hành án dân sự; quyền sử dụng đất đang bị áp dụng biện pháp khẩn cấp tạm thời theo quy định của pháp luật”"},{"id":"ksdd150","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, trường hợp nào sau đây Nhà nước thu hồi Giấy chứng nhận đã cấp?","o":["Người sử dụng đất chậm nộp thuế sử dụng đất hằng năm","Người sử dụng đất thế chấp quyền sử dụng đất tại ngân hàng","Giấy chứng nhận cấp không đúng thẩm quyền, đối tượng hoặc diện tích đất","Người sử dụng đất cho người khác ở nhờ trên đất"],"a":2,"ref":"Điểm d khoản 2 Điều 152 Luật Đất đai 2024: “Giấy chứng nhận đã cấp không đúng thẩm quyền, không đúng đối tượng sử dụng đất, không đúng diện tích đất, không đủ điều kiện được cấp”"},{"id":"ksdd151","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, Giấy chứng nhận đã cấp bị Tòa án có thẩm quyền tuyên hủy thì xử lý thế nào?","o":["Giấy chứng nhận vẫn giữ nguyên giá trị","Chỉ đính chính thông tin trên Giấy chứng nhận","Nhà nước thu hồi Giấy chứng nhận đã cấp","Người sử dụng đất tự hủy Giấy chứng nhận"],"a":2,"ref":"Điểm đ khoản 2 Điều 152 Luật Đất đai 2024: “Nhà nước thu hồi giấy chứng nhận đã cấp trong các trường hợp sau đây” … “đ) Giấy chứng nhận đã cấp bị Tòa án có thẩm quyền tuyên hủy”"},{"id":"ksdd152","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, trường hợp Tòa án có thẩm quyền giải quyết tranh chấp đất đai có bản án, quyết định có hiệu lực thi hành, trong đó có kết luận về việc thu hồi Giấy chứng nhận đã cấp thì việc thu hồi được thực hiện theo căn cứ nào?","o":["Theo đề nghị của Ủy ban nhân dân cấp xã","Theo bản án, quyết định đó","Theo kết luận thanh tra bổ sung","Theo yêu cầu của người được cấp Giấy chứng nhận"],"a":1,"ref":"Điểm a khoản 3 Điều 152 Luật Đất đai 2024: “thì việc thu hồi giấy chứng nhận đã cấp được thực hiện theo bản án, quyết định đó”"},{"id":"ksdd153","cat":"ksdd","topic":"Luật Đất đai: đăng ký, Giấy chứng nhận","q":"Theo Luật Đất đai 2024, Giấy chứng nhận cấp không đúng quy định (điểm d khoản 2 Điều 152) nhưng người được cấp đã thực hiện chuyển quyền sử dụng đất theo quy định của pháp luật đất đai thì cơ quan có thẩm quyền xử lý thế nào?","o":["Đính chính Giấy chứng nhận sang tên người bị thiệt hại","Hủy hợp đồng chuyển quyền và thu hồi Giấy chứng nhận đã cấp","Không thu hồi; thiệt hại được xử lý theo bản án, quyết định của Tòa án","Thu hồi Giấy chứng nhận đã cấp cho người nhận chuyển quyền"],"a":2,"ref":"Khoản 4 Điều 152 Luật Đất đai 2024: “không thu hồi giấy chứng nhận đã cấp trong các trường hợp quy định tại điểm d khoản 2 Điều này nếu người được cấp giấy chứng nhận đã thực hiện chuyển quyền sử dụng đất” … “Việc xử lý thiệt hại do việc cấp giấy chứng nhận tại khoản này thực hiện theo bản án, quyết định của Tòa án”"},{"id":"ksdd154","cat":"ksdd","topic":"Luật Đất đai: hòa giải, thẩm quyền giải quyết tranh chấp, chuyển tiếp","q":"Theo Luật Đất đai 2024, trước khi cơ quan nhà nước có thẩm quyền giải quyết tranh chấp đất đai theo Điều 236, các bên tranh chấp phải thực hiện hòa giải tại đâu?","o":["Ủy ban nhân dân cấp xã nơi có đất tranh chấp","Văn phòng đăng ký đất đai","Trung tâm hòa giải thương mại","Tòa án nhân dân khu vực nơi có đất"],"a":0,"ref":"Khoản 2 Điều 235 Luật Đất đai 2024: “Trước khi cơ quan nhà nước có thẩm quyền giải quyết tranh chấp đất đai quy định tại Điều 236 của Luật này, các bên tranh chấp phải thực hiện hòa giải tại Ủy ban nhân dân cấp xã nơi có đất tranh chấp”"},{"id":"ksdd155","cat":"ksdd","topic":"Luật Đất đai: hòa giải, thẩm quyền giải quyết tranh chấp, chuyển tiếp","q":"Theo Luật Đất đai 2024, ai là Chủ tịch Hội đồng hòa giải tranh chấp đất đai tại Ủy ban nhân dân cấp xã?","o":["Trưởng thôn, buôn nơi có đất","Chủ tịch hoặc Phó Chủ tịch Ủy ban nhân dân cấp xã","Chủ tịch Ủy ban Mặt trận Tổ quốc Việt Nam cấp xã","Công chức làm công tác địa chính"],"a":1,"ref":"Điểm b khoản 2 Điều 235 Luật Đất
